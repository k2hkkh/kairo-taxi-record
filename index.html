    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

    .hud-flip-y { transform: scaleY(-1); }
    .hud-rot90-left { transform: rotate(-90deg) scaleY(-1); }
    .hud-rot90-right { transform: rotate(90deg) scaleY(-1); }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0.5rem); }

    /* 교대 펌핑 애니메이션 */
    @keyframes pulse-top-grow {
      0%, 100% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(239, 68, 68, 0.95)); }
      50% { transform: scale(0.94); filter: drop-shadow(0 0 8px rgba(234, 179, 8, 0.4)); }
    }
    @keyframes pulse-bottom-grow {
      0%, 100% { transform: scale(0.94); filter: drop-shadow(0 0 8px rgba(234, 179, 8, 0.4)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(0, 245, 255, 0.95)); }
    }
    .animate-top-pump { animation: pulse-top-grow 0.85s infinite ease-in-out; }
    .animate-bottom-pump { animation: pulse-bottom-grow 0.85s infinite ease-in-out; }

    /* 네온 스트로브 경고 점멸 */
    @keyframes strobe-warning {
      0% { background-color: rgba(239, 68, 68, 0.35); border-color: #ef4444; }
      25% { background-color: rgba(234, 179, 8, 0.35); border-color: #eab308; }
      50% { background-color: rgba(6, 182, 212, 0.35); border-color: #06b6d4; }
      75% { background-color: rgba(168, 85, 247, 0.35); border-color: #a855f7; }
      100% { background-color: rgba(239, 68, 68, 0.35); border-color: #ef4444; }
    }
    .animate-strobe-alert { animation: strobe-warning 0.5s infinite linear; }

    /* 속도계 폰트 스타일 */
    .font-speed-hollow {
      color: rgba(255, 255, 255, 0.15);
      -webkit-text-stroke: 2.5px rgba(255, 255, 255, 0.65);
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.95);
    }
    .font-speed-cyan {
      color: #00f5ff;
      -webkit-text-stroke: 2.5px #ffffff;
      text-shadow: 0 0 28px rgba(0, 245, 255, 1), 0 4px 14px rgba(0, 0, 0, 0.95);
    }
    .font-speed-red {
      color: #ff1e44;
      -webkit-text-stroke: 2.5px #ffffff;
      text-shadow: 0 0 32px rgba(255, 30, 68, 1), 0 4px 14px rgba(0, 0, 0, 0.95);
    }

    .leaflet-container {
      background-color: #1e293b !important;
      font-family: inherit;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
    }
    .leaflet-control-attribution { display: none !important; }
  </style>
</head>
<body class="select-none antialiased bg-slate-950">

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const APP_VERSION = 'v4.1.0';
    const CURRENT_STORAGE_KEY = 'K_TAXI_RECORD_DATA_V14';
    const DEFAULT_MAP_ZOOM = 17;

    // 기사 맞춤형 웰컴 & 격려 멘트 풀
    const WELCOME_MESSAGES = [
      "오늘도 안전운전 하실 거죠? 안전이 최우선입니다!",

    const CLOSING_MESSAGES = [
      "오늘 하루도 정말 수고하셨습니다. 즐거운 마음으로 내일 다시 만나요!",
      "내일을 위하여 오늘은 충분하고 편안한 휴식을 푹 취하세요.",

      "푹 쉬시고 충전된 에너지로 내일 다시 뵙겠습니다!"
    ];

    // 천안·아산 주요 단속 포인트 DB
    const CAMERA_DB = [
      { id: 'cam1', name: '불당대로 (시청 앞)', lat: 36.8152, lon: 127.1135, limit: 50, type: 'speed' },
      { id: 'cam2', name: '번영로 (종합운동장)', lat: 36.8285, lon: 127.1210, limit: 60, type: 'speed' },
      { id: 'cam3', name: '충무로 (쌍용고사거리)', lat: 36.7950, lon: 127.1260, limit: 50, type: 'speed' },
      { id: 'cam4', name: '서부대로 (봉명역 인근)', lat: 36.8010, lon: 127.1350, limit: 50, type: 'speed' },
      { id: 'cam5', name: '온천대로 (아산시청 앞)', lat: 36.7895, lon: 127.0035, limit: 50, type: 'speed' },
      { id: 'cam6', name: '배방로 (배방역 광장)', lat: 36.7770, lon: 127.0520, limit: 50, type: 'speed' },
      { id: 'cam7', name: '천안역 서부광장 주정차', lat: 36.8105, lon: 127.1460, limit: 30, type: 'parking' },
      { id: 'cam8', name: '남부대로 구간단속 (유량~목천)', lat: 36.7820, lon: 127.1650, limit: 70, type: 'section' }
    ];

    const calculateDistanceMeters = (lat1, lon1, lat2, lon2) => {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    };

    const calculateBearing = (startLat, startLng, destLat, destLng) => {
      const startLatRad = startLat * Math.PI / 180;
      const startLngRad = startLng * Math.PI / 180;
      const destLatRad = destLat * Math.PI / 180;
      const destLngRad = destLng * Math.PI / 180;
      const y = Math.sin(destLngRad - startLngRad) * Math.cos(destLatRad);
      const x = Math.cos(startLatRad) * Math.sin(destLatRad) -
                Math.sin(startLatRad) * Math.cos(destLatRad) * Math.cos(destLngRad - startLngRad);
      const brng = Math.atan2(y, x) * 180 / Math.PI;
      return (brng + 360) % 360;
    };

    // 전자 내비 사운드 엔진
    let activeAudioSources = [];

    const getAudioContext = () => {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!window._kTaxiAudioCtx) {
        window._kTaxiAudioCtx = new AudioCtx();
      }
      if (window._kTaxiAudioCtx.state === 'suspended') {
        window._kTaxiAudioCtx.resume();
      }
      return window._kTaxiAudioCtx;
    };

    const stopAllAudio = () => {
      activeAudioSources.forEach((src) => {
        try {
          if (src.stop) src.stop();
          if (src.disconnect) src.disconnect();
        } catch (e) {}
      });
      activeAudioSources = [];
    };

    const playNavigationChime = (type = 'chime') => {
      try {
        stopAllAudio();
        const ctx = getAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;

        if (type === 'chime') {
          [0, 0.16].forEach((delay, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(idx === 0 ? 880 : 1174, now + delay);
            gain.gain.setValueAtTime(0.4, now + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + delay);
            osc.stop(now + delay + 0.35);
            activeAudioSources.push(osc);
          });
        } else if (type === 'warning') {
          [0, 0.12].forEach((delay) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1318, now + delay);
            gain.gain.setValueAtTime(0.55, now + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + delay);
            osc.stop(now + delay + 0.1);
            activeAudioSources.push(osc);
          });
        }
      } catch (e) {
        console.warn('Audio Engine Error:', e);
      }
    };

    const formatMoney = (val) => Number(String(val).replace(/[^0-9]/g, '') || 0).toLocaleString('ko-KR');
    const formatShortMoney = (val) => {
      const num = Number(val) || 0;
      if (num === 0) return '0';
      if (num >= 10000) return (num / 10000).toFixed(num % 10000 === 0 ? 0 : 1) + '만';
      return (num / 1000).toFixed(0) + '천';
    };
    const getTodayKey = () => {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    };
    const getCurrentTimeStr = () => {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    };
    const calculateMinutes = (start, end) => {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let sMin = sh * 60 + sm;
      let eMin = eh * 60 + em;
      if (eMin < sMin) eMin += 24 * 60;
      return Math.max(0, eMin - sMin);
    };
    const formatMinutesToHours = (totalMins) => {
      if (!totalMins || totalMins <= 0) return '0시간';
      const hours = Math.floor(totalMins / 60);
      const mins = totalMins % 60;
      return mins === 0 ? `${hours}시간` : `${hours}시간 ${mins}분`;
    };

    const DEFAULT_STORAGE = {
      hasSelectedType: false,
      isShiftActive: false,
      activeType: 'corporate',
      hudSpeedLimit: 50,
      defaultOffDay: 1,
      healthRoutines: [
        { id: 1, type: 'med', time: '18:00', title: '식후 혈압/당뇨 약 복용', done: false },
        { id: 2, type: 'meal', time: '20:30', title: '1차 속 편한 간편식 (감자/계란/샐러드)', done: false },
        { id: 3, type: 'stretch', time: '23:00', title: '가스 충전 시 3분 허리 신전 스트레칭', done: false },
        { id: 4, type: 'nap', time: '01:30', title: '새벽 20분 전략적 파워 쪽잠', done: false }
      ],
      corporate: {
        carNumber: '',
        dailyDeposit: 201000,
        deductionRate: 9.0,
        fixedAllowanceItems: [
          { id: 1, name: '기본급', amount: 1181700 },
          { id: 2, name: '승무수당', amount: 130000 },
          { id: 3, name: '교육수당', amount: 21000 },
          { id: 4, name: '법정휴일수당', amount: 35000 }
        ],
        fixedExpenseItems: [
          { id: 1, name: '노조비', amount: 25000 },
          { id: 2, name: '상조회비', amount: 0 }
        ],
        records: {}
      },
      private: {
        carNumber: '',
        records: {}
      }
    };

    const loadSafeData = () => {
      try {
        let saved = null;
        for (let i = 15; i >= 1; i--) {
          const raw = localStorage.getItem(`K_TAXI_RECORD_DATA_V${i}`);
          if (raw) { saved = raw; break; }
        }
        if (!saved) saved = localStorage.getItem('K_TAXI_RECORD_DATA');
        if (saved) {
          const p = JSON.parse(saved);
          return {
            hasSelectedType: p.hasSelectedType !== undefined ? p.hasSelectedType : true,
            isShiftActive: p.isShiftActive || false,
            activeType: (p.activeType || p.activeTab || 'corporate') === 'private' ? 'private' : 'corporate',
            hudSpeedLimit: Number(p.hudSpeedLimit || 50),
            defaultOffDay: Number(p.defaultOffDay !== undefined ? p.defaultOffDay : 1),
            healthRoutines: Array.isArray(p.healthRoutines) && p.healthRoutines.length > 0 ? p.healthRoutines : DEFAULT_STORAGE.healthRoutines,
            corporate: {
              carNumber: p.corporate?.carNumber || '',
              dailyDeposit: Number(p.corporate?.dailyDeposit || p.corporate?.baseDeposit || 201000),
              deductionRate: Number(p.corporate?.deductionRate !== undefined ? p.corporate.deductionRate : 9.0),
              fixedAllowanceItems: Array.isArray(p.corporate?.fixedAllowanceItems) && p.corporate.fixedAllowanceItems.length > 0 ? p.corporate.fixedAllowanceItems : DEFAULT_STORAGE.corporate.fixedAllowanceItems,
              fixedExpenseItems: Array.isArray(p.corporate?.fixedExpenseItems) ? p.corporate.fixedExpenseItems : DEFAULT_STORAGE.corporate.fixedExpenseItems,
              records: p.corporate?.records || {}
            },
            private: { carNumber: p.private?.carNumber || '', records: p.private?.records || {} }
          };
        }
      } catch (e) {
        console.warn('Storage Load Fallback', e);
      }
      return DEFAULT_STORAGE;
    };

    const createDynamicUserIcon = (cameraType, heading = 0) => {
      const rotStyle = `transform: rotate(${heading}deg); transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);`;

      return L.divIcon({
        className: 'custom-user-morph-marker',
        html: `
          <div class="relative flex items-center justify-center" style="width:52px; height:52px; ${rotStyle}">
            <div class="absolute w-10 h-10 rounded-full bg-blue-500/30 animate-ping"></div>
            <svg viewBox="0 0 48 48" class="w-12 h-12 drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)]" style="filter: drop-shadow(0 0 8px rgba(250,204,21,0.9));">
              <polygon points="16,10 4,-6 44,-6 32,10" fill="rgba(254,240,138,0.35)"/>
              <rect x="12" y="8" width="24" height="34" rx="8" fill="#facc15" stroke="#0f172a" stroke-width="2.5"/>
              <path d="M 15 17 L 33 17 L 31 23 L 17 23 Z" fill="#0f172a"/>
              <path d="M 17 33 L 31 33 L 32 37 L 16 37 Z" fill="#0f172a"/>
              <rect x="18" y="24" width="12" height="6" rx="2" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
              <text x="24" y="28.5" font-size="3.5" font-weight="900" fill="#ffffff" text-anchor="middle">TAXI</text>
              <circle cx="15" cy="9" r="2" fill="#ffffff"/>
              <circle cx="33" cy="9" r="2" fill="#ffffff"/>
            </svg>
          </div>
        `,
        iconSize: [52, 52],
        iconAnchor: [26, 26]
      });
    };

    function FullscreenLiveMapView({ currentCoords, nearbyCamera, isAutoTracking, setIsAutoTracking, userHeading }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const userMarkerRef = useRef(null);
      const autoResumeTimer = useRef(null);

      useEffect(() => {
        if (!mapContainerRef.current) return;

        const defaultLat = currentCoords?.lat || 36.8152;
        const defaultLon = currentCoords?.lon || 127.1135;

        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: [defaultLat, defaultLon],
            zoom: DEFAULT_MAP_ZOOM,
            zoomControl: false,
            attributionControl: false
          });

          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            minZoom: 12
          }).addTo(map);

          map.on('dragstart zoomstart', () => {
            setIsAutoTracking(false);
            if (autoResumeTimer.current) clearTimeout(autoResumeTimer.current);
          });

          map.on('dragend zoomend', () => {
            if (autoResumeTimer.current) clearTimeout(autoResumeTimer.current);
            autoResumeTimer.current = setTimeout(() => {
              setIsAutoTracking(true);
            }, 6000);
          });

          CAMERA_DB.forEach((cam) => {
            const camIcon = L.divIcon({
              className: 'custom-cam-pin',
              html: `<div style="background-color:#dc2626;color:white;font-weight:900;border:3px solid #ffffff;border-radius:9999px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,0.6);">${cam.limit}</div>`,
              iconSize: [34, 34],
              iconAnchor: [17, 17]
            });
            L.marker([cam.lat, cam.lon], { icon: camIcon })
              .addTo(map)
              .bindPopup(`<b>${cam.name}</b><br>제한속도: ${cam.limit}km/h`);
          });

          userMarkerRef.current = L.marker([defaultLat, defaultLon], {
            icon: createDynamicUserIcon(null, userHeading)
          }).addTo(map);

          mapInstanceRef.current = map;
        }

        const resizeTimer = setTimeout(() => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.invalidateSize();
          }
        }, 300);

        return () => {
          clearTimeout(resizeTimer);
          if (autoResumeTimer.current) clearTimeout(autoResumeTimer.current);
        };
      }, []);

      useEffect(() => {
        if (userMarkerRef.current) {
          const activeType = nearbyCamera ? nearbyCamera.type : null;
          userMarkerRef.current.setIcon(createDynamicUserIcon(activeType, userHeading));
        }
      }, [nearbyCamera, userHeading]);

      useEffect(() => {
        if (mapInstanceRef.current && currentCoords) {
          const { lat, lon } = currentCoords;
          if (userMarkerRef.current) {
            userMarkerRef.current.setLatLng([lat, lon]);
          }
          if (isAutoTracking) {
            mapInstanceRef.current.panTo([lat, lon], { animate: true, duration: 0.8 });
          }
        }
      }, [currentCoords, isAutoTracking]);

      const handleRecenter = (e) => {
        e.stopPropagation();
        if (mapInstanceRef.current && currentCoords) {
          mapInstanceRef.current.setView([currentCoords.lat, currentCoords.lon], DEFAULT_MAP_ZOOM, {
            animate: true,
            duration: 0.8
          });
          setIsAutoTracking(true);
        }
      };

      return (
        <div className="w-full h-full relative flex-1 flex flex-col bg-slate-950">
          <div ref={mapContainerRef} className="w-full h-full flex-1" />

          {!isAutoTracking && (
            <button
              onClick={handleRecenter}
              className="absolute bottom-24 right-4 z-[450] px-3.5 py-2 bg-slate-900/95 hover:bg-slate-800 text-yellow-400 font-black text-xs rounded-2xl border-2 border-yellow-500 shadow-2xl flex items-center gap-1.5 active:scale-95 transition pointer-events-auto"
            >
              <span className="text-base">📍</span> 내 위치로
            </button>
          )}

          <div className="absolute bottom-24 left-4 z-[400] bg-slate-950/90 border border-slate-700 px-2.5 py-1 rounded-xl text-[10px] text-slate-200 font-bold flex items-center gap-1.5 shadow pointer-events-none">
            <span className={`w-2 h-2 rounded-full ${isAutoTracking ? 'bg-emerald-400 animate-pulse' : 'bg-orange-400'}`}></span>
            {isAutoTracking ? '주행 추적 중' : '자유 탐색'}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 카카오T 스타일 '밀어서 퇴근하기' 슬라이더 컴포넌트
    // =========================================================================
    function SlideToUnlock({ onUnlock, text = "오른쪽으로 밀어서 퇴근하기" }) {
      const [dragX, setDragX] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const containerRef = useRef(null);
      const startXRef = useRef(0);

      const handleStart = (clientX) => {
        setIsDragging(true);
        startXRef.current = clientX;
      };

      const handleMove = (clientX) => {
        if (!isDragging || !containerRef.current) return;
        const maxDrag = containerRef.current.clientWidth - 62;
        const delta = clientX - startXRef.current;
        const bounded = Math.max(0, Math.min(delta, maxDrag));
        setDragX(bounded);
      };

      const handleEnd = () => {
        if (!isDragging || !containerRef.current) return;
        setIsDragging(false);
        const maxDrag = containerRef.current.clientWidth - 62;
        if (dragX >= maxDrag * 0.82) {
          setDragX(maxDrag);
          onUnlock();
          setTimeout(() => setDragX(0), 800);
        } else {
          setDragX(0);
        }
      };

      return (
        <div
          ref={containerRef}
          className="relative w-full h-16 bg-slate-900/90 border-2 border-orange-500/70 rounded-2xl overflow-hidden flex items-center justify-center select-none shadow-2xl"
          onTouchStart={(e) => handleStart(e.touches[0].clientX)}
          onTouchMove={(e) => handleMove(e.touches[0].clientX)}
          onTouchEnd={handleEnd}
          onMouseDown={(e) => handleStart(e.clientX)}
          onMouseMove={(e) => handleMove(e.clientX)}
          onMouseUp={handleEnd}
          onMouseLeave={handleEnd}
        >
          <div
            className="absolute left-0 top-0 bottom-0 bg-gradient-to-r from-orange-600/30 to-red-600/50"
            style={{ width: `${dragX + 32}px` }}
          />

          <span className="text-xs font-black text-slate-300 tracking-wider flex items-center gap-1.5 pointer-events-none animate-pulse">
            <span>{text}</span>
            <span className="text-orange-400 font-bold">➔➔</span>
          </span>

          <div
            className="absolute left-1.5 top-1.5 bottom-1.5 w-14 bg-gradient-to-tr from-orange-600 to-red-500 hover:from-orange-500 hover:to-red-400 text-white font-black text-xl rounded-xl flex items-center justify-center shadow-lg cursor-grab active:cursor-grabbing transition-transform duration-75"
            style={{ transform: `translateX(${dragX}px)` }}
          >
            🏁
          </div>
        </div>
      );
    }

    function SmartMoneyInput({ value, onChange, placeholder = "0", className = "", colorClass = "text-white" }) {
      const numVal = Number(value) || 0;
      const displayVal = numVal > 0 ? numVal.toLocaleString('ko-KR') : '';

      return (
        <div className="relative flex items-center w-full">
          {numVal > 0 && (
            <button
              type="button"
              onClick={() => onChange(0)}
              className="absolute left-2 z-10 text-slate-400 hover:text-red-400 bg-slate-800 active:bg-slate-700 rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-black"
              tabIndex={-1}
            >
              ✕
            </button>
          )}
          <input
            type="text"
            inputMode="numeric"
            value={displayVal}
            placeholder={placeholder}
            onFocus={(e) => e.target.select()}
            onChange={(e) => {
              const raw = e.target.value.replace(/[^0-9]/g, '');
              onChange(raw ? Number(raw) : 0);
            }}
            className={`w-full bg-slate-900 border border-slate-700 p-2 text-sm rounded-xl text-right font-bold ${colorClass} focus:border-yellow-500 focus:outline-none ${className}`}
          />
        </div>
      );
    }

    function App() {

      const [closingMsg, setClosingMsg] = useState('');
      const [showClosingModal, setShowClosingModal] = useState(false);

      // 모달 상태
      const [showNavModal, setShowNavModal] = useState(false);

      const [newRoutineTime, setNewRoutineTime] = useState('12:00');
      const [newRoutineType, setNewRoutineType] = useState('med');

      // GPS & HUD & 방위각 상태
      const [gpsSpeed, setGpsSpeed] = useState(0);
      const [currentCoords, setCurrentCoords] = useState(null);
      const [userHeading, setUserHeading] = useState(0);
      const prevCoordsRef = useRef(null);

      // HUD 4단계 화면 순환: 1: map, 2: mirror_vert, 3: mirror_rot_left, 4: mirror_rot_right
      const [hudCycleStep, setHudCycleStep] = useState(1);
      const [isAutoTracking, setIsAutoTracking] = useState(true);

      const [isSimDriveActive, setIsSimDriveActive] = useState(false);

      // 구간단속 평균속도 상태

      const sectionStartTime = useRef(null);
      const sectionTotalSpeed = useRef(0);
      const sectionSpeedSamples = useRef(0);

      // 쪽잠 카운트다운 타이머
      const [napTotalMinutes, setNapTotalMinutes] = useState(20);

      const [isNapTimerActive, setIsNapTimerActive] = useState(false);

      // 단속 방어 / 적발 이력
      const [defenseHistory, setDefenseHistory] = useState([
        { id: 1, time: '18:42', name: '불당대로 (시청 앞)', type: 'speed', limit: 50, speed: 48, status: 'pass', amount: 40000 },
        { id: 2, time: '19:15', name: '천안역 광장 (주정차)', type: 'parking', limit: 30, speed: 0, status: 'pass', amount: 40000 }
      ]);

      const activeCameraTracking = useRef(null);
      const activeType = appData?.activeType === 'private' ? 'private' : 'corporate';
      const todayKey = getTodayKey();
      const todayRecord = appData[activeType]?.records?.[todayKey] || {};

      useEffect(() => {
        try {
          localStorage.setItem(CURRENT_STORAGE_KEY, JSON.stringify(appData));

          console.warn('Storage Save Warning', e);
        }

      // 화면 상시 켜짐 방지
      useEffect(() => {
        let wakeLockSentinel = null;
        const requestWakeLock = async () => {
          try {
            if ('wakeLock' in navigator) {
              wakeLockSentinel = await navigator.wakeLock.request('screen');
            }
          } catch (err) {
            console.warn('Wake Lock Error:', err);
          }

        if (currentTab === 'hud') requestWakeLock();

        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible' && currentTab === 'hud') {
            requestWakeLock();
          }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          if (wakeLockSentinel) wakeLockSentinel.release().catch(() => {});
        };
      }, [currentTab]);

      // 1. 초대형 직사각형 출근하기
      const handleStartShift = () => {
        const nowTime = getCurrentTimeStr();
        const updatedRec = {
          ...todayRecord,
          startTime: todayRecord.startTime || nowTime,
          endTime: '',
          workMinutes: 0
        };

        setAppData(prev => ({
          ...prev,
          isShiftActive: true,
          [activeType]: {
            ...prev[activeType],
            records: { ...(prev[activeType]?.records || {}), [todayKey]: updatedRec }
          }
        }));

        playNavigationChime('chime');
        setCurrentTab('today');
      };

      // 출근 시각 초기화
      const handleResetShift = () => {
        if (!confirm('오늘의 출근 기록을 초기화하시겠습니까?')) return;
        const updatedRec = { ...todayRecord, startTime: '', endTime: '', workMinutes: 0 };
        setAppData(prev => ({
          ...prev,
          isShiftActive: false,
          [activeType]: {
            ...prev[activeType],
            records: { ...(prev[activeType]?.records || {}), [todayKey]: updatedRec }
          }
        }));
        setCurrentTab('welcome');
      };

      // 출근 시각 직접 수정
      const handleSaveCustomStartTime = () => {
        const updatedRec = {
          ...todayRecord,
          startTime: tempStartTime,
          workMinutes: todayRecord.endTime ? calculateMinutes(tempStartTime, todayRecord.endTime) : 0
        };
        setAppData(prev => ({
          ...prev,
          [activeType]: {
            ...prev[activeType],
            records: { ...(prev[activeType]?.records || {}), [todayKey]: updatedRec }
          }
        }));
        setShowEditStartTimeModal(false);
      };

      // 2. 카카오T 스타일 슬라이드 퇴근 완료 & 풀스크린 격려 멘트
      const handleEndShift = () => {
        const nowTime = getCurrentTimeStr();
        const sTime = todayRecord.startTime || nowTime;
        const workMins = calculateMinutes(sTime, nowTime);

        const updatedRec = {
          ...todayRecord,
          startTime: sTime,
          endTime: nowTime,
          workMinutes: workMins
        };

        setAppData(prev => ({
          ...prev,
          isShiftActive: false,
          [activeType]: {
            ...prev[activeType],
            records: { ...(prev[activeType]?.records || {}), [todayKey]: updatedRec }
          }
        }));

        const randomClosing = CLOSING_MESSAGES[Math.floor(Math.random() * CLOSING_MESSAGES.length)];
        setClosingMsg(randomClosing);
        setShowClosingModal(true);
      };

      // 외부 내비 원터치 실행
      const openExternalNav = (navType) => {
        const isAndroid = /Android/i.test(navigator.userAgent);
        const encoded = encodeURIComponent('가스충전소');

        if (navType === 'tmap') {
          window.location.href = isAndroid
            ? `intent://search?name=${encoded}#Intent;scheme=tmap;package=com.skt.tmap.ku;end`
            : `tmap://search?name=${encoded}`;
        } else if (navType === 'kakao') {
          window.location.href = isAndroid
            ? `intent://search?q=${encoded}#Intent;scheme=kakaomap;package=net.daum.android.map;end`
            : `https://map.kakao.com/link/search/${encoded}`;
        } else if (navType === 'naver') {
          window.location.href = isAndroid
            ? `intent://search?query=${encoded}&appname=k-taxi#Intent;scheme=nmap;package=com.nhn.android.nmap;end`
            : `https://m.map.naver.com/search2/search.naver?query=${encoded}`;
        }
        setShowNavModal(false);
      };

      // 과속 경보 엔진
      const effectiveLimit = nearbyCamera ? nearbyCamera.limit : (appData.hudSpeedLimit || 50);
      const isCurrentlyOverspeed = (gpsSpeed > effectiveLimit) && Boolean(nearbyCamera);

      useEffect(() => {
        let overspeedAlarmInterval = null;

        if (isCurrentlyOverspeed && nearbyCamera) {
          playNavigationChime('warning');
          overspeedAlarmInterval = setInterval(() => {
            playNavigationChime('warning');
          }, 2500);
        } else {
          stopAllAudio();
        }

        return () => {
          if (overspeedAlarmInterval) clearInterval(overspeedAlarmInterval);
          stopAllAudio();
        };
      }, [isCurrentlyOverspeed, nearbyCamera]);

      // 주정차 5분 타이머 엔진
      useEffect(() => {
        let timer = null;
        if (isParkingStopped && parkingCountdown > 0) {
          timer = setInterval(() => setParkingCountdown(prev => prev - 1), 1000);
        } else if (isParkingStopped && parkingCountdown === 0) {
          playNavigationChime('warning');
          const failEntry = {
            id: Date.now(),
            time: getCurrentTimeStr(),
            name: nearbyCamera?.name || '주정차 단속 구역',
            type: 'parking',
            limit: 30,
            speed: 0,
            status: 'fail',
            amount: -40000
          };
          setDefenseHistory(prev => [failEntry, ...prev]);
          setIsParkingStopped(false);
          alert('🚨 주정차 5분 유예시간이 초과되었습니다! 즉시 이동하세요.');
        }
        return () => clearInterval(timer);
      }, [isParkingStopped, parkingCountdown]);

      // 견고한 GPS 연산 엔진
      useEffect(() => {
        if (!navigator.geolocation || isSimDriveActive) return;

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
            setCurrentCoords({ lat, lon });
            setGpsSpeed(speedKmh);
            prevCoordsRef.current = { lat, lon, time: Date.now() };
          },
          (err) => console.warn('Initial GPS Warn:', err.message),
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
        );

        const watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            setGpsSpeed(speedKmh);
            setCurrentCoords({ lat, lon });

            if (pos.coords.heading !== null && !isNaN(pos.coords.heading) && pos.coords.heading >= 0) {
              setUserHeading(Math.round(pos.coords.heading));
            } else if (prevCoordsRef.current) {
              const dist = calculateDistanceMeters(prevCoordsRef.current.lat, prevCoordsRef.current.lon, lat, lon);
              if (dist >= 2) {
                const calculatedBrng = calculateBearing(prevCoordsRef.current.lat, prevCoordsRef.current.lon, lat, lon);
                setUserHeading(Math.round(calculatedBrng));
                prevCoordsRef.current = { lat, lon, time: Date.now() };
              }
            } else {
              prevCoordsRef.current = { lat, lon, time: Date.now() };
            }

            let closest = null;
            let minDistance = 99999;

            CAMERA_DB.forEach((cam) => {
              const dist = calculateDistanceMeters(lat, lon, cam.lat, cam.lon);
              if (dist < minDistance) {
                minDistance = dist;
                closest = { ...cam, dist };
              }
            });

            if (closest && closest.dist <= 350) {
              if (!nearbyCamera) {
                playNavigationChime('chime');
              }
              setNearbyCamera(closest);

              if (closest.type === 'parking') {
                if (speedKmh === 0 && !isParkingStopped) {
                  setIsParkingStopped(true);
                  setParkingCountdown(300);
                } else if (speedKmh > 5 && isParkingStopped) {
                  const passEntry = {
                    id: Date.now(),
                    time: getCurrentTimeStr(),
                    name: closest.name,
                    type: 'parking',
                    limit: closest.limit,
                    speed: 0,
                    status: 'pass',
                    amount: 40000
                  };
                  setDefenseHistory(prev => [passEntry, ...prev]);
                  setIsParkingStopped(false);
                  setParkingCountdown(300);
                }
              }

              if (closest.type === 'section') {
                if (!sectionStartTime.current) {
                  sectionStartTime.current = Date.now();
                  sectionTotalSpeed.current = speedKmh;
                  sectionSpeedSamples.current = 1;
                } else {
                  sectionTotalSpeed.current += speedKmh;
                  sectionSpeedSamples.current += 1;
                  setSectionAvgSpeed(Math.round(sectionTotalSpeed.current / sectionSpeedSamples.current));
                }
              }

              if (!activeCameraTracking.current) {
                activeCameraTracking.current = {
                  id: closest.id,
                  name: closest.name,
                  limit: closest.limit,
                  type: closest.type,
                  maxSpeed: speedKmh
                };
              } else {
                if (speedKmh > activeCameraTracking.current.maxSpeed) {
                  activeCameraTracking.current.maxSpeed = speedKmh;
                }
              }
            } else {
              if (activeCameraTracking.current && minDistance > 400) {
                const { name, limit, type, maxSpeed } = activeCameraTracking.current;
                let isOverspeed = maxSpeed > limit;
                let checkSpeed = maxSpeed;

                if (type === 'section' && sectionSpeedSamples.current > 0) {
                  checkSpeed = sectionAvgSpeed;
                  isOverspeed = sectionAvgSpeed > limit;
                  sectionStartTime.current = null;
                  sectionTotalSpeed.current = 0;
                  sectionSpeedSamples.current = 0;
                  setSectionAvgSpeed(0);
                }

                let penaltyAmount = 40000;
                if (isOverspeed) {
                  const diff = checkSpeed - limit;
                  if (diff > 40) penaltyAmount = 100000;
                  else if (diff > 20) penaltyAmount = 70000;
                  else penaltyAmount = 40000;
                }

                if (type !== 'parking') {
                  const newEntry = {
                    id: Date.now(),
                    time: getCurrentTimeStr(),
                    name,
                    type,
                    limit,
                    speed: checkSpeed,
                    status: isOverspeed ? 'fail' : 'pass',
                    amount: isOverspeed ? -penaltyAmount : 40000
                  };
                  setDefenseHistory(prev => [newEntry, ...prev]);
                }
                activeCameraTracking.current = null;
              }
              setNearbyCamera(null);
              setIsParkingStopped(false);
              stopAllAudio();
            }
          },
          (err) => console.warn('GPS Watch Error:', err.message),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );

        return () => navigator.geolocation.clearWatch(watchId);
      }, [isSimDriveActive, nearbyCamera, isParkingStopped, sectionAvgSpeed]);

      // 실전 모의 주행
      const toggleSimDrive = (e) => {
        e.stopPropagation();
        stopAllAudio();

        if (isSimDriveActive) {
          setIsSimDriveActive(false);
          clearInterval(simDriveTimerRef.current);
          setGpsSpeed(0);
          setNearbyCamera(null);
          setIsParkingStopped(false);
          setUserHeading(0);
        } else {
          setIsSimDriveActive(true);
          let step = 0;

          const route = [
            { lat: 36.8120, lon: 127.1135, speed: 45, heading: 0, cam: null },
            { lat: 36.8135, lon: 127.1135, speed: 64, heading: 0, cam: { id: 'sim_1', name: '불당대로 (과속단속)', limit: 50, dist: 180, type: 'speed' } },
            { lat: 36.8150, lon: 127.1135, speed: 48, heading: 0, cam: { id: 'sim_1', name: '불당대로 (과속단속)', limit: 50, dist: 40, type: 'speed' } },
            { lat: 36.8152, lon: 127.1150, speed: 35, heading: 90, cam: null },
            { lat: 36.8152, lon: 127.1180, speed: 50, heading: 90, cam: null },
            { lat: 36.8130, lon: 127.1180, speed: 40, heading: 180, cam: null },
            { lat: 36.8110, lon: 127.1180, speed: 0, heading: 180, cam: { id: 'sim_p', name: '천안역 서부광장 (주정차)', limit: 30, dist: 50, type: 'parking' } }
          ];

          playNavigationChime('chime');

          simDriveTimerRef.current = setInterval(() => {
            const currentStep = route[step % route.length];
            setCurrentCoords({ lat: currentStep.lat, lon: currentStep.lon });
            setGpsSpeed(currentStep.speed);
            setUserHeading(currentStep.heading);
            setNearbyCamera(currentStep.cam);

            if (currentStep.cam && currentStep.speed > currentStep.cam.limit) {
              playNavigationChime('warning');
            } else if (currentStep.cam && currentStep.speed === 0) {
              setIsParkingStopped(true);
            } else {
              setIsParkingStopped(false);
            }

            step++;
          }, 2400);
        }
      };

      const passCount = defenseHistory.filter(h => h.status === 'pass').length;
      const failCount = defenseHistory.filter(h => h.status === 'fail').length;
      const totalSaved = defenseHistory.filter(h => h.status === 'pass').reduce((s, h) => s + h.amount, 0);
      const totalFines = defenseHistory.filter(h => h.status === 'fail').reduce((s, h) => s + Math.abs(h.amount), 0);
      const netSaved = totalSaved - totalFines;

      const handleResetDefenseHistory = (e) => {
        if (e) e.stopPropagation();
        if (confirm('오늘 기록된 단속 방어 및 적발 내역을 모두 초기화하시겠습니까?')) {
          setDefenseHistory([]);
        }
      };

      const handleDeleteDefenseItem = (id) => {
        setDefenseHistory(prev => prev.filter(item => item.id !== id));
      };

      const toggleRoutineDone = (id) => {
        setAppData(prev => ({
          ...prev,
          healthRoutines: (prev.healthRoutines || []).map(r => r.id === id ? { ...r, done: !r.done } : r)
        }));
      };

      const handleAddRoutine = () => {
        if (!newRoutineTitle.trim()) return;
        const newEntry = {
          id: Date.now(),
          type: newRoutineType,
          time: newRoutineTime,
          title: newRoutineTitle.trim(),
          done: false
        };
        setAppData(prev => ({
          ...prev,
          healthRoutines: [...(prev.healthRoutines || []), newEntry]
        }));
        setNewRoutineTitle('');
        setShowAddRoutineModal(false);
      };

      const handleDeleteRoutine = (id) => {
        if (!confirm('항목을 삭제하시겠습니까?')) return;
        setAppData(prev => ({
          ...prev,
          healthRoutines: (prev.healthRoutines || []).filter(r => r.id !== id)
        }));
      };

      // 쪽잠 카운트다운 인터벌
      useEffect(() => {
        let interval = null;
        if (isNapTimerActive && napTimerSeconds > 0) {
          interval = setInterval(() => setNapTimerSeconds(prev => prev - 1), 1000);
        } else if (isNapTimerActive && napTimerSeconds === 0) {
          setIsNapTimerActive(false);
          playNavigationChime('warning');
          if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 1000]);
          alert('🔔 쪽잠이 종료되었습니다! 안전 운행을 시작하세요.');
        }
        return () => clearInterval(interval);
      }, [isNapTimerActive, napTimerSeconds]);

      const startNapWithDuration = (mins) => {
        setNapTotalMinutes(mins);
        setNapTimerSeconds(mins * 60);
        setIsNapTimerActive(true);
      };

      const handleSaveRecord = (dateKey, recordData) => {
        setAppData(prev => ({
          ...prev,
          [activeType]: {
            ...prev[activeType],
            records: { ...(prev[activeType]?.records || {}), [dateKey]: recordData }
          }
        }));
        setShowDailyModal(false);
      };

      const totalFixedAllowances = useMemo(() => (appData?.corporate?.fixedAllowanceItems || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0), [appData?.corporate?.fixedAllowanceItems]);
      const totalFixedExpenses = useMemo(() => (appData?.corporate?.fixedExpenseItems || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0), [appData?.corporate?.fixedExpenseItems]);

      const currentMonthStats = useMemo(() => {
        const records = appData[activeType]?.records || {};
        const entries = Object.entries(records).filter(([date]) => date && String(date).startsWith(currentYearMonth));
        let workDays = 0, holidayDays = 0, totalWorkMinutes = 0;

        if (activeType === 'corporate') {
          const dailyDeposit = Number(appData.corporate?.dailyDeposit || 201000);
          const deductionRate = Number(appData.corporate?.deductionRate !== undefined ? appData.corporate.deductionRate : 9.0) / 100;
          let totalRevenue = 0, totalGasCompany = 0, totalDriverExpense = 0, totalIncentive = 0;

          entries.forEach(([_, r]) => {
            if (r?.isHoliday) { holidayDays++; }
            else {
              workDays++;
              const rev = Number(r?.revenue || 0);
              totalRevenue += rev;
              totalGasCompany += Number(r?.gas || 0);
              totalDriverExpense += Number(r?.driverExpense || 0);
              totalWorkMinutes += Number(r?.workMinutes || 0);
              totalIncentive += Math.round(Math.max(0, rev - dailyDeposit) * 0.7);
            }
          });

          const grossSalary = totalFixedAllowances + totalIncentive;
          const taxAndInsurance = Math.round(grossSalary * deductionRate);
          const totalDeductions = taxAndInsurance + totalFixedExpenses;
          return { workDays, holidayDays, totalWorkMinutes, totalRevenue, totalGasCompany, totalIncentive, grossSalary, taxAndInsurance, totalFixedExpenses, totalDeductions, netSalaryFromCompany: grossSalary - totalDeductions, totalDriverExpense, finalNetIncome: grossSalary - totalDeductions - totalDriverExpense };
        } else {

              maintTotal += Number(r?.maint || 0);
              otherTotal += Number(r?.other || 0);
              totalWorkMinutes += Number(r?.workMinutes || 0);
            }
          });

          const totalExpense = gasTotal + tollTotal + maintTotal + otherTotal;
          return { workDays, holidayDays, totalWorkMinutes, cardTotal, cashTotal, totalRevenue, gasTotal, tollTotal, maintTotal, otherTotal, totalExpense, netIncome: totalRevenue - totalExpense };

                    <span className="text-xl">🛡️</span>
                    <h3 className="text-sm font-black text-emerald-400">단속 방어 & 적발 상세 내역</h3>
                  </div>
                  <button onClick={() => setShowDefenseListModal(false)} className="text-slate-400 font-bold text-base hover:text-white">✕</button>
                </div>

                <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 grid grid-cols-3 gap-1 text-center">
                  <div>
                    <span className="text-[9px] text-slate-400 block font-semibold">방어 성공</span>
                    <span className="text-sm font-black text-emerald-400">{passCount}회 (+{formatShortMoney(totalSaved)})</span>
                  </div>
                  <div className="border-x border-slate-800">
                    <span className="text-[9px] text-slate-400 block font-semibold">적발 의심</span>
                    <span className="text-sm font-black text-red-400">{failCount}회 (-{formatShortMoney(totalFines)})</span>
                  </div>
                  <div>
                    <span className="text-[9px] text-slate-400 block font-semibold">순방어액</span>
                    <span className={`text-sm font-black ${netSaved >= 0 ? 'text-yellow-400' : 'text-red-400'}`}>
                      {formatShortMoney(netSaved)}
                    </span>
                  </div>
                </div>

                <div className="max-h-60 overflow-y-auto space-y-2 pr-1">
                  {defenseHistory.length === 0 ? (
                    <div className="text-center py-6 text-xs text-slate-500">기록된 단속 내역이 없습니다.</div>
                  ) : (
                    defenseHistory.map((item) => (
                      <div key={item.id} className="p-2.5 rounded-xl border border-slate-800 bg-slate-950 flex items-center justify-between text-xs">
                        <div>
                          <div className="font-bold text-slate-200">{item.name}</div>
                          <div className="text-[10px] text-slate-400 font-medium">
                            {item.time} 통과 ({item.type === 'parking' ? '주정차' : `제한 ${item.limit} | 주행 ${item.speed}km/h`})
                          </div>
                        </div>
                        <div className="flex items-center gap-1.5">
                          <span className={`text-xs font-black px-2 py-1 rounded-lg border ${
                            item.status === 'pass'
                              ? 'text-emerald-400 bg-emerald-950 border-emerald-500/40'
                              : 'text-red-400 bg-red-950 border-red-500/40'
                          }`}>
                            {item.amount > 0 ? `+${formatMoney(item.amount)}` : `${formatMoney(item.amount)}`}원
                          </span>
                          <button onClick={() => handleDeleteDefenseItem(item.id)} className="text-slate-500 hover:text-red-400 px-1 font-bold text-xs">✕</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={handleResetDefenseHistory}
                    className="flex-1 py-2.5 bg-slate-800 hover:bg-red-950 text-slate-300 hover:text-red-300 font-bold rounded-xl text-xs border border-slate-700"
                  >
                    🔄 내역 초기화
                  </button>
                  <button
                    onClick={() => setShowDefenseListModal(false)}
                    className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl text-xs shadow-lg"
                  >
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 7. 일별 장부 입력 모달 */}
          {showDailyModal && (
            <DailyRecordModal
              activeType={activeType}
              dateKey={selectedDate}
              existingData={appData[activeType]?.records?.[selectedDate] || {}}
              onSave={(data) => handleSaveRecord(selectedDate, data)}
              onClose={() => setShowDailyModal(false)}
            />
          )}

          {/* 8. 세무서 양식 모달 */}
          {showTaxModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="text-xs font-bold text-yellow-400">세무서 제출 양식</h3>
                  <button onClick={() => setShowTaxModal(false)} className="text-slate-400 text-base font-bold">✕</button>
                </div>
                <textarea readOnly value={`[세무서 제출용 소득 요약서]\n귀속기간: ${currentYearMonth}\n차량번호: ${appData.private?.carNumber || '미등록'}\n매출합계: ${formatMoney(currentMonthStats.totalRevenue)}\n경비합계: ${formatMoney(currentMonthStats.totalExpense)}\n과세소득: ${formatMoney(currentMonthStats.netIncome)}`} className="w-full h-44 bg-slate-950 text-slate-200 text-xs font-mono p-2.5 rounded-xl border border-slate-800 resize-none" />
                <button onClick={() => {
                  navigator.clipboard.writeText(`[세무서 제출용 소득 요약서]\n귀속기간: ${currentYearMonth}\n차량번호: ${appData.private?.carNumber || '미등록'}\n매출합계: ${formatMoney(currentMonthStats.totalRevenue)}\n경비합계: ${formatMoney(currentMonthStats.totalExpense)}\n과세소득: ${formatMoney(currentMonthStats.netIncome)}`);
                  alert('복사되었습니다.');
                }} className="w-full py-2.5 bg-yellow-500 text-black font-bold rounded-xl text-xs">내용 전체 복사</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function DailyRecordModal({ activeType, dateKey, existingData, onSave, onClose }) {
      const [isHoliday, setIsHoliday] = useState(existingData?.isHoliday || false);
      const [memo, setMemo] = useState(existingData?.memo || '');
      const [startTime, setStartTime] = useState(existingData?.startTime || '');
      const [endTime, setEndTime] = useState(existingData?.endTime || '');
      const [revenue, setRevenue] = useState(existingData?.revenue || 0);
      const [gas, setGas] = useState(existingData?.gas || 0);
      const [driverExpense, setDriverExpense] = useState(existingData?.driverExpense || 0);
      const [cardRev, setCardRev] = useState(existingData?.cardRev || 0);
      const [cashRev, setCashRev] = useState(existingData?.cashRev || 0);
      const [privGas, setPrivGas] = useState(existingData?.gas || 0);
      const [toll, setToll] = useState(existingData?.toll || 0);
      const [maint, setMaint] = useState(existingData?.maint || 0);
      const [other, setOther] = useState(existingData?.other || 0);

      const calculatedMins = calculateMinutes(startTime, endTime);

      const handleSave = () => {
        const base = { isHoliday, memo, startTime, endTime, workMinutes: calculatedMins };
        if (activeType === 'corporate') {
          onSave({ ...base, revenue: Number(revenue) || 0, gas: Number(gas) || 0, driverExpense: Number(driverExpense) || 0 });
        } else {
          onSave({ ...base, cardRev: Number(cardRev) || 0, cashRev: Number(cashRev) || 0, gas: Number(privGas) || 0, toll: Number(toll) || 0, maint: Number(maint) || 0, other: Number(other) || 0 });
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center pb-2 border-b border-slate-800">
              <h3 className="text-xs font-bold text-yellow-400">{dateKey} 운행 기록</h3>
              <button onClick={onClose} className="text-slate-400 font-bold text-base">✕</button>
            </div>
            <label className="flex items-center gap-2 bg-slate-950 p-2.5 rounded-xl border border-slate-800 cursor-pointer">
              <input type="checkbox" checked={isHoliday} onChange={(e) => setIsHoliday(e.target.checked)} className="w-4 h-4 rounded text-yellow-500" />
              <span className="text-xs font-bold text-slate-300">이 날은 휴무했습니다 (미운행)</span>
            </label>
            {!isHoliday && (
              <div className="space-y-2.5">
                <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 space-y-1.5">
                  <div className="flex justify-between items-center">
                    <span className="text-[11px] font-bold text-slate-300">근무 시간 (출·퇴근)</span>
                    {calculatedMins > 0 && <span className="text-[11px] font-bold text-blue-400">{formatMinutesToHours(calculatedMins)}</span>}
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] text-slate-400 block mb-0.5">출근 시간</label>
                      <input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} className="w-full bg-slate-900 border border-slate-700 p-1.5 rounded-lg text-xs text-white text-center font-bold" />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-400 block mb-0.5">퇴근 시간</label>
                      <input type="time" value={endTime} onChange={(e) => setEndTime(e.target.value)} className="w-full bg-slate-900 border border-slate-700 p-1.5 rounded-lg text-xs text-white text-center font-bold" />
                    </div>
                  </div>
                </div>
                {activeType === 'corporate' ? (
                  <>
                    <div><label className="text-[11px] text-slate-400 block mb-1">당일 총매출</label><SmartMoneyInput value={revenue} onChange={setRevenue} colorClass="text-yellow-400" /></div>
                    <div><label className="text-[11px] text-blue-400 block mb-1">가스비</label><SmartMoneyInput value={gas} onChange={setGas} colorClass="text-blue-300" /></div>
                    <div><label className="text-[11px] text-orange-400 block mb-1">기타 기사경비</label><SmartMoneyInput value={driverExpense} onChange={setDriverExpense} colorClass="text-orange-300" /></div>
                  </>
                ) : (
                  <>
                    <div className="grid grid-cols-2 gap-2">
                      <div><label className="text-[10px] text-slate-400 block mb-1">카드 수입</label><SmartMoneyInput value={cardRev} onChange={setCardRev} /></div>
                      <div><label className="text-[10px] text-slate-400 block mb-1">현금 수입</label><SmartMoneyInput value={cashRev} onChange={setCashRev} /></div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div><label className="text-[10px] text-slate-400 block mb-1">가스비</label><SmartMoneyInput value={privGas} onChange={setPrivGas} /></div>
                      <div><label className="text-[10px] text-slate-400 block mb-1">통행료</label><SmartMoneyInput value={toll} onChange={setToll} /></div>
                    </div>
                  </>
                )}
                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">운행 메모</label>
                  <input type="text" placeholder="특이사항 메모" value={memo} onChange={(e) => setMemo(e.target.value)} className="w-full bg-slate-950 border border-slate-700 p-2 text-xs rounded-xl text-white" />
                </div>
              </div>
            )}
            <div className="flex gap-2 pt-2">
              <button onClick={handleSave} className="flex-1 py-2.5 bg-yellow-500 text-black font-bold rounded-xl text-xs">저장 완료</button>
              <button onClick={onClose} className="px-4 py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">취소</button>
            </div>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
