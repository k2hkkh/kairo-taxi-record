<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  
  <title>K-TAXI 스마트 속도계 & 운행기록</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #000000;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .font-speed-neon {
      color: #00f5ff;
      -webkit-text-stroke: 3px #ffffff;
      text-shadow: 0 0 45px rgba(0, 245, 255, 0.95), 0 0 15px rgba(255, 255, 255, 0.9);
    }
    .font-speed-zero {
      color: rgba(255, 255, 255, 0.25);
      -webkit-text-stroke: 2px rgba(255, 255, 255, 0.6);
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="select-none antialiased bg-black">
  <div id="root">
    <div class="h-full flex items-center justify-center text-yellow-400 font-bold text-base bg-black">
      K-TAXI 시스템 로딩 중...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const APP_VERSION = 'v5.3.0';
    const CURRENT_STORAGE_KEY = 'K_TAXI_RECORD_DATA_V23';

    const CLOSING_MESSAGES = [
      "오늘 하루도 정말 수고하셨습니다. 편안한 휴식을 푹 취하세요!",
      "즐거운 마음으로 내일 다시 만나요! 푹 쉬세요.",
      "내일을 위하여 오늘은 충분하고 편안한 휴식을 취하세요.",
      "오늘도 안전하게 무사고 완주하셨습니다. 고생 많으셨습니다!"
    ];

    const formatMoney = (val) => Number(String(val).replace(/[^0-9]/g, '') || 0).toLocaleString('ko-KR');
    const formatShortMoney = (val) => {
      const num = Number(val) || 0;
      if (num === 0) return '0';
      if (num >= 10000) return (num / 10000).toFixed(num % 10000 === 0 ? 0 : 1) + '만';
      return (num / 1000).toFixed(0) + '천';
    };
    const getTodayKey = () => {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    };
    const getCurrentTimeStr = () => {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    };
    const calculateMinutes = (start, end) => {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let sMin = sh * 60 + sm;
      let eMin = eh * 60 + em;
      if (eMin < sMin) eMin += 24 * 60;
      return Math.max(0, eMin - sMin);
    };
    const formatMinutesToHours = (totalMins) => {
      if (!totalMins || totalMins <= 0) return '0시간';
      const hours = Math.floor(totalMins / 60);
      const mins = totalMins % 60;
      return mins === 0 ? `${hours}시간` : `${hours}시간 ${mins}분`;
    };

    const playAlarmSound = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.5);
      } catch (e) {
        console.warn('Audio play failed', e);
      }
    };

    const DEFAULT_STORAGE = {
      isShiftActive: false,
      activeType: 'corporate',
      defaultOffDay: 1,
      googleSheetUrl: '',
      healthRoutines: [
        { id: 1, time: '18:00', title: '저녁 혈압/당뇨 약 복용', done: false },
        { id: 2, time: '20:30', title: '간편 건강식 (감자/계란/샐러드)', done: false },
        { id: 3, time: '23:00', title: '충전 시 허리 스트레칭', done: false },
        { id: 4, time: '01:30', title: '새벽 20분 파워 쪽잠', done: false }
      ],
      corporate: {
        carNumber: '충남31바3238',
        dailyDeposit: 201000,
        deductionRate: 9.0,
        fixedAllowanceItems: [
          { id: 1, name: '기본급', amount: 1181700 },
          { id: 2, name: '승무수당', amount: 130000 },
          { id: 3, name: '교육수당', amount: 21000 },
          { id: 4, name: '법정휴일수당', amount: 35000 }
        ],
        fixedExpenseItems: [
          { id: 1, name: '노조비', amount: 25000 },
          { id: 2, name: '상조회비', amount: 0 }
        ],
        records: {}
      },
      private: {
        carNumber: '충남31바3238',
        records: {}
      }
    };

    const loadSafeData = () => {
      try {
        let bestCandidate = null;
        let mostRecordsCount = -1;
        const keysToScan = [];
        for (let i = 28; i >= 1; i--) keysToScan.push(`K_TAXI_RECORD_DATA_V${i}`);
        keysToScan.push('K_TAXI_RECORD_DATA', 'k_taxi_data');

        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && (k.includes('TAXI') || k.includes('RECORD')) && !keysToScan.includes(k)) {
            keysToScan.push(k);
          }
        }

        for (const k of keysToScan) {
          const raw = localStorage.getItem(k);
          if (raw) {
            try {
              const p = JSON.parse(raw);
              if (p) {
                const corpRecs = Object.keys(p.corporate?.records || {}).length;
                const privRecs = Object.keys(p.private?.records || {}).length;
                const totalRecs = corpRecs + privRecs;
                if (totalRecs > mostRecordsCount) {
                  mostRecordsCount = totalRecs;
                  bestCandidate = p;
                }
              }
            } catch(e) {}
          }
        }

        if (bestCandidate) {
          const p = bestCandidate;
          return {
            isShiftActive: Boolean(p.isShiftActive),
            activeType: (p.activeType || p.activeTab || 'corporate') === 'private' ? 'private' : 'corporate',
            defaultOffDay: Number(p.defaultOffDay !== undefined ? p.defaultOffDay : 1),
            googleSheetUrl: p.googleSheetUrl || '',
            healthRoutines: Array.isArray(p.healthRoutines) && p.healthRoutines.length > 0 ? p.healthRoutines : DEFAULT_STORAGE.healthRoutines,
            corporate: {
              carNumber: p.corporate?.carNumber || '충남31바3238',
              dailyDeposit: Number(p.corporate?.dailyDeposit || p.corporate?.baseDeposit || 201000),
              deductionRate: Number(p.corporate?.deductionRate !== undefined ? p.corporate.deductionRate : 9.0),
              fixedAllowanceItems: Array.isArray(p.corporate?.fixedAllowanceItems) && p.corporate.fixedAllowanceItems.length > 0 ? p.corporate.fixedAllowanceItems : DEFAULT_STORAGE.corporate.fixedAllowanceItems,
              fixedExpenseItems: Array.isArray(p.corporate?.fixedExpenseItems) ? p.corporate.fixedExpenseItems : DEFAULT_STORAGE.corporate.fixedExpenseItems,
              records: p.corporate?.records || {}
            },
            private: {
              carNumber: p.private?.carNumber || '충남31바3238',
              records: p.private?.records || {}
            }
          };
        }
      } catch (e) {
        console.warn('Storage Load Fallback', e);
      }
      return DEFAULT_STORAGE;
    };

    function SlideToUnlock({ onUnlock, text = "오른쪽으로 밀어서 퇴근하기" }) {
      const [dragX, setDragX] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const containerRef = useRef(null);
      const startXRef = useRef(0);

      const handleStart = (clientX) => {
        setIsDragging(true);
        startXRef.current = clientX;
      };

      const handleMove = (clientX) => {
        if (!isDragging || !containerRef.current) return;
        const maxDrag = containerRef.current.clientWidth - 62;
        const delta = clientX - startXRef.current;
        const bounded = Math.max(0, Math.min(delta, maxDrag));
        setDragX(bounded);
      };

      const handleEnd = () => {
        if (!isDragging || !containerRef.current) return;
        setIsDragging(false);
        const maxDrag = containerRef.current.clientWidth - 62;
        if (dragX >= maxDrag * 0.82) {
          setDragX(maxDrag);
          onUnlock();
          setTimeout(() => setDragX(0), 800);
        } else {
          setDragX(0);
        }
      };

      return (
        <div
          ref={containerRef}
          className="relative w-full h-16 bg-slate-900 border-2 border-orange-500/80 rounded-2xl overflow-hidden flex items-center justify-center select-none shadow-2xl"
          onTouchStart={(e) => handleStart(e.touches[0].clientX)}
          onTouchMove={(e) => handleMove(e.touches[0].clientX)}
          onTouchEnd={handleEnd}
          onMouseDown={(e) => handleStart(e.clientX)}
          onMouseMove={(e) => handleMove(e.clientX)}
          onMouseUp={handleEnd}
          onMouseLeave={handleEnd}
        >
          <div
            className="absolute left-0 top-0 bottom-0 bg-gradient-to-r from-orange-600/30 to-red-600/50"
            style={{ width: `${dragX + 32}px` }}
          />
          <span className="text-sm font-black text-slate-200 tracking-wider flex items-center gap-2 pointer-events-none">
            <span>{text}</span>
            <span className="text-orange-400 font-bold">➔➔</span>
          </span>
          <div
            className="absolute left-1.5 top-1.5 bottom-1.5 w-14 bg-gradient-to-tr from-orange-500 to-red-600 text-white font-black text-base rounded-xl flex items-center justify-center shadow-lg cursor-grab active:cursor-grabbing transition-transform duration-75"
            style={{ transform: `translateX(${dragX}px)` }}
          >
            퇴근
          </div>
        </div>
      );
    }

    function SmartMoneyInput({ value, onChange, placeholder = "0", className = "", colorClass = "text-white" }) {
      const numVal = Number(value) || 0;
      const displayVal = numVal > 0 ? numVal.toLocaleString('ko-KR') : '';

      return (
        <div className="relative flex items-center w-full">
          {numVal > 0 && (
            <button
              type="button"
              onClick={() => onChange(0)}
              className="absolute left-2 z-10 text-slate-400 hover:text-red-400 bg-slate-800 active:bg-slate-700 rounded-full w-6 h-6 flex items-center justify-center text-xs font-black"
              tabIndex={-1}
            >
              ✕
            </button>
          )}
          <input
            type="text"
            inputMode="numeric"
            value={displayVal}
            placeholder={placeholder}
            onFocus={(e) => e.target.select()}
            onChange={(e) => {
              const raw = e.target.value.replace(/[^0-9]/g, '');
              onChange(raw ? Number(raw) : 0);
            }}
            className={`w-full bg-slate-900 border border-slate-700 p-2.5 text-base rounded-xl text-right font-bold ${colorClass} focus:border-yellow-500 focus:outline-none ${className}`}
          />
        </div>
      );
    }

    function App() {
      const [appData, setAppData] = useState(loadSafeData);
      
      // 요청 반영: 앱 실행 시 첫 화면을 '운행기록 달력(calendar)'으로 지정
      const [currentTab, setCurrentTab] = useState('calendar');
      
      const [selectedDate, setSelectedDate] = useState(getTodayKey());
      const [currentYearMonth, setCurrentYearMonth] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      });

      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [isHudToolbarVisible, setIsHudToolbarVisible] = useState(false);
      const hudToolbarTimer = useRef(null);

      const [hudToastText, setHudToastText] = useState('');
      const hudToastTimer = useRef(null);

      // 6대 HUD 모드 순환:
      // 1: 일반 세로
      // 2: 일반 가로 (좌)
      // 3: 일반 가로 (우)
      // 4: 유리 반사 (거울 세로)
      // 5: 유리 반사 (거울 가로 좌)
      // 6: 유리 반사 (거울 가로 우)
      const [hudCycleStep, setHudCycleStep] = useState(1);

      const hudAreaRef = useRef(null);
      const [hudDims, setHudDims] = useState({ w: 360, h: 600 });

      // 더블탭(2회) 및 롱프레스(1초 꾹 누르기) 제어
      const lastTapTimeRef = useRef(0);
      const longPressTimerRef = useRef(null);
      const isLongPressTriggered = useRef(false);

      const [isSheetUrlLocked, setIsSheetUrlLocked] = useState(true);

      const [closingMsg, setClosingMsg] = useState('');
      const [showClosingModal, setShowClosingModal] = useState(false);

      const [showNavModal, setShowNavModal] = useState(false);
      const [showDailyModal, setShowDailyModal] = useState(false);
      const [showTaxModal, setShowTaxModal] = useState(false);
      const [showAddRoutineModal, setShowAddRoutineModal] = useState(false);
      const [editingRoutine, setEditingRoutine] = useState(null);
      const [showEditStartTimeModal, setShowEditStartTimeModal] = useState(false);
      const [showNapVisualModal, setShowNapVisualModal] = useState(false);

      const [tempStartTime, setTempStartTime] = useState('16:30');
      const [routineTitleInput, setRoutineTitleInput] = useState('');
      const [routineTimeInput, setRoutineTimeInput] = useState('12:00');

      const [gpsSpeed, setGpsSpeed] = useState(0);

      const [napTotalMinutes, setNapTotalMinutes] = useState(20);
      const [napTimerSeconds, setNapTimerSeconds] = useState(20 * 60);
      const [isNapTimerActive, setIsNapTimerActive] = useState(false);

      const activeType = appData?.activeType === 'private' ? 'private' : 'corporate';
      const todayKey = getTodayKey();
      const todayRecord = appData[activeType]?.records?.[todayKey] || {};

      useEffect(() => {
        try {
          localStorage.setItem(CURRENT_STORAGE_KEY, JSON.stringify(appData));
        } catch (e) {
          console.warn('Storage Save Warning', e);
        }
      }, [appData]);

      useEffect(() => {
        const updateDims = () => {
          if (hudAreaRef.current) {
            const rect = hudAreaRef.current.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
              setHudDims({ w: rect.width, h: rect.height });
            }
          }
        };
        updateDims();
        window.addEventListener('resize', updateDims);
        return () => window.removeEventListener('resize', updateDims);
      }, [currentTab]);

      useEffect(() => {
        let wakeLockSentinel = null;
        const requestWakeLock = async () => {
          try {
            if ('wakeLock' in navigator) {
              wakeLockSentinel = await navigator.wakeLock.request('screen');
            }
          } catch (err) {
            console.warn('Wake Lock Error:', err);
          }
        };

        if (currentTab === 'hud') requestWakeLock();

        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible' && currentTab === 'hud') {
            requestWakeLock();
          }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          if (wakeLockSentinel) wakeLockSentinel.release().catch(() => {});
        };
      }, [currentTab]);

      useEffect(() => {
        if (!navigator.geolocation) return;

        const watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
            setGpsSpeed(Math.max(0, speedKmh));
          },
          (err) => console.warn('GPS Error:', err.message),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
        );

        return () => navigator.geolocation.clearWatch(watchId);
      }, []);

      const handleStartShift = () => {
        const nowTime = getCurrentTimeStr();
        const updatedRec = {
          ...todayRecord,
          startTime: todayRecord.startTime || nowTime,
          endTime: '',
          workMinutes: 0
        };

        setAppData(prev => ({
          ...prev,
          isShiftActive: true,
          [activeType]: {
            ...prev[activeType],
            records: { ...(prev[activeType]?.records || {}), [todayKey]: updatedRec }
          }
        }));

        setCurrentTab('hud');
        setIsHudToolbarVisible(false);
      };

      const handleResetShift = () => {
        if (!confirm('오늘의 출근 기록을 초기화하시겠습니까?')) return;
        const updatedRec = { ...todayRecord, startTime: '', endTime: '', workMinutes: 0 };
        setAppData(prev => ({
          ...prev,
          isShiftActive: false,
          [activeType]: {
            ...prev[activeType],
            records: { ...(prev[activeType]?.records || {}), [todayKey]: updatedRec }
          }
        }));
      };

      const handleSaveCustomStartTime = () => {
        const updatedRec = {
          ...todayRecord,
          startTime: tempStartTime,
          workMinutes: todayRecord.endTime ? calculateMinutes(tempStartTime, todayRecord.endTime) : 0
        };
        setAppData(prev => ({
          ...prev,
          [activeType]: {
            ...prev[activeType],
            records: { ...(prev[activeType]?.records || {}), [todayKey]: updatedRec }
          }
        }));
        setShowEditStartTimeModal(false);
      };

      const handleEndShift = () => {
        const nowTime = getCurrentTimeStr();
        const sTime = todayRecord.startTime || nowTime;
        const workMins = calculateMinutes(sTime, nowTime);

        const updatedRec = {
          ...todayRecord,
          startTime: sTime,
          endTime: nowTime,
          workMinutes: workMins
        };

        const newAppData = {
          ...appData,
          isShiftActive: false,
          [activeType]: {
            ...appData[activeType],
            records: { ...(appData[activeType]?.records || {}), [todayKey]: updatedRec }
          }
        };

        setAppData(newAppData);

        if (appData.googleSheetUrl && appData.googleSheetUrl.startsWith('http')) {
          try {
            fetch(appData.googleSheetUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                date: todayKey,
                carNumber: appData[activeType]?.carNumber || '충남31바3238',
                activeType: activeType === 'corporate' ? '법인' : '개인',
                startTime: sTime,
                endTime: nowTime,
                workHours: formatMinutesToHours(workMins),
                revenue: updatedRec.revenue || (Number(updatedRec.cardRev || 0) + Number(updatedRec.cashRev || 0)),
                gas: updatedRec.gas || 0,
                driverExpense: updatedRec.driverExpense || 0,
                memo: updatedRec.memo || ''
              })
            }).catch(err => console.warn('Google Sheet Sync Error:', err));
          } catch(e) {
            console.warn('Google Sheet Send Error:', e);
          }
        }

        const randomClosing = CLOSING_MESSAGES[Math.floor(Math.random() * CLOSING_MESSAGES.length)];
        setClosingMsg(randomClosing);
        setShowClosingModal(true);
      };

      const openExternalNav = (navType) => {
        const isAndroid = /Android/i.test(navigator.userAgent);
        const encoded = encodeURIComponent('가스충전소');

        if (navType === 'tmap') {
          window.location.href = isAndroid
            ? `intent://search?name=${encoded}#Intent;scheme=tmap;package=com.skt.tmap.ku;end`
            : `tmap://search?name=${encoded}`;
        } else if (navType === 'kakao') {
          window.location.href = isAndroid
            ? `intent://search?q=${encoded}#Intent;scheme=kakaomap;package=net.daum.android.map;end`
            : `https://map.kakao.com/link/search/${encoded}`;
        } else if (navType === 'naver') {
          window.location.href = isAndroid
            ? `intent://search?query=${encoded}&appname=k-taxi#Intent;scheme=nmap;package=com.nhn.android.nmap;end`
            : `https://m.map.naver.com/search2/search.naver?query=${encoded}`;
        }
        setShowNavModal(false);
      };

      const toggleRoutineDone = (id) => {
        setAppData(prev => ({
          ...prev,
          healthRoutines: (prev.healthRoutines || []).map(r => r.id === id ? { ...r, done: !r.done } : r)
        }));
      };

      const handleSaveRoutine = () => {
        if (!routineTitleInput.trim()) return;

        if (editingRoutine) {
          setAppData(prev => ({
            ...prev,
            healthRoutines: (prev.healthRoutines || []).map(r => r.id === editingRoutine.id ? { ...r, time: routineTimeInput, title: routineTitleInput.trim() } : r)
          }));
        } else {
          const newEntry = {
            id: Date.now(),
            time: routineTimeInput,
            title: routineTitleInput.trim(),
            done: false
          };
          setAppData(prev => ({
            ...prev,
            healthRoutines: [...(prev.healthRoutines || []), newEntry]
          }));
        }

        setEditingRoutine(null);
        setRoutineTitleInput('');
        setShowAddRoutineModal(false);
      };

      const handleDeleteRoutine = (id) => {
        if (!confirm('항목을 삭제하시겠습니까?')) return;
        setAppData(prev => ({
          ...prev,
          healthRoutines: (prev.healthRoutines || []).filter(r => r.id !== id)
        }));
      };

      useEffect(() => {
        let interval = null;
        if (isNapTimerActive && napTimerSeconds > 0) {
          interval = setInterval(() => setNapTimerSeconds(prev => prev - 1), 1000);
        } else if (isNapTimerActive && napTimerSeconds === 0) {
          setIsNapTimerActive(false);
          playAlarmSound();
          if (navigator.vibrate) navigator.vibrate([500, 250, 500, 250, 1000]);
          alert('쪽잠이 종료되었습니다! 편안한 상태에서 운행을 시작하세요.');
        }
        return () => clearInterval(interval);
      }, [isNapTimerActive, napTimerSeconds]);

      const startNapWithDuration = (mins) => {
        setNapTotalMinutes(mins);

      const handleSaveRecord = (dateKey, recordData) => {
        setAppData(prev => ({
          ...prev,
          [activeType]: {
            ...prev[activeType],
            records: { ...(prev[activeType]?.records || {}), [dateKey]: recordData }
          }

      const totalFixedAllowances = useMemo(() => (appData?.corporate?.fixedAllowanceItems || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0), [appData?.corporate?.fixedAllowanceItems]);
      const totalFixedExpenses = useMemo(() => (appData?.corporate?.fixedExpenseItems || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0), [appData?.corporate?.fixedExpenseItems]);

      const currentMonthStats = useMemo(() => {
        const records = appData[activeType]?.records || {};
        const entries = Object.entries(records).filter(([date]) => date && String(date).startsWith(currentYearMonth));
        let workDays = 0, holidayDays = 0, totalWorkMinutes = 0;

        if (activeType === 'corporate') {
          const dailyDeposit = Number(appData.corporate?.dailyDeposit || 201000);
          const deductionRate = Number(appData.corporate?.deductionRate !== undefined ? appData.corporate.deductionRate : 9.0) / 100;
          let totalRevenue = 0, totalGasCompany = 0, totalDriverExpense = 0, totalIncentive = 0;

          entries.forEach(([_, r]) => {
            if (r?.isHoliday) { holidayDays++; }
            else {
              workDays++;
              const rev = Number(r?.revenue || 0);
              totalRevenue += rev;
              totalGasCompany += Number(r?.gas || 0);
              totalDriverExpense += Number(r?.driverExpense || 0);
              totalWorkMinutes += Number(r?.workMinutes || 0);
              totalIncentive += Math.round(Math.max(0, rev - dailyDeposit) * 0.7);
            }
          });

          const grossSalary = totalFixedAllowances + totalIncentive;
          const taxAndInsurance = Math.round(grossSalary * deductionRate);
          const totalDeductions = taxAndInsurance + totalFixedExpenses;
          const netSalary = grossSalary - totalDeductions;
          const finalNet = netSalary - totalDriverExpense;

          const avgDailyMinutes = workDays > 0 ? Math.round(totalWorkMinutes / workDays) : 0;
          const avgDailyRevenue = workDays > 0 ? Math.round(totalRevenue / workDays) : 0;
          const totalWorkHours = totalWorkMinutes / 60;
          const avgHourlyWage = totalWorkHours > 0 ? Math.round(finalNet / totalWorkHours) : 0;

          return {
            workDays, holidayDays, totalWorkMinutes, totalRevenue, totalGasCompany, totalIncentive,
            grossSalary, taxAndInsurance, totalFixedExpenses, totalDeductions,
            netSalaryFromCompany: netSalary, totalDriverExpense, finalNetIncome: finalNet,
            avgDailyMinutes, avgDailyRevenue, avgHourlyWage
          };
        } else {
          let cardTotal = 0, cashTotal = 0, gasTotal = 0, tollTotal = 0, maintTotal = 0, otherTotal = 0;
          entries.forEach(([_, r]) => {
            if (r?.isHoliday) { holidayDays++; }
            else {
              workDays++;
              cardTotal += Number(r?.cardRev || 0);
              cashTotal += Number(r?.cashRev || 0);
              gasTotal += Number(r?.gas || 0);
              tollTotal += Number(r?.toll || 0);
              maintTotal += Number(r?.maint || 0);
              otherTotal += Number(r?.other || 0);
              totalWorkMinutes += Number(r?.workMinutes || 0);
            }
          });
          const totalRevenue = cardTotal + cashTotal;
          const totalExpense = gasTotal + tollTotal + maintTotal + otherTotal;
          const netIncome = totalRevenue - totalExpense;

          const avgDailyMinutes = workDays > 0 ? Math.round(totalWorkMinutes / workDays) : 0;
          const avgDailyRevenue = workDays > 0 ? Math.round(totalRevenue / workDays) : 0;
          const totalWorkHours = totalWorkMinutes / 60;
          const avgHourlyWage = totalWorkHours > 0 ? Math.round(netIncome / totalWorkHours) : 0;

          return {
            workDays, holidayDays, totalWorkMinutes, cardTotal, cashTotal, totalRevenue,
            gasTotal, tollTotal, maintTotal, otherTotal, totalExpense, netIncome,
            avgDailyMinutes, avgDailyRevenue, avgHourlyWage
          };
        }
      }, [appData, activeType, currentYearMonth, totalFixedAllowances, totalFixedExpenses]);

      const calendarCells = useMemo(() => {
        const [y, m] = currentYearMonth.split('-').map(Number);
        const firstDayWeekIndex = new Date(y, m - 1, 1).getDay();
        const totalDaysInMonth = new Date(y, m, 0).getDate();
        const cells = [];
        for (let i = 0; i < firstDayWeekIndex; i++) cells.push(null);
        for (let d = 1; d <= totalDaysInMonth; d++) cells.push(`${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
        return cells;

      // 터치 제어: 1초 꾹 누르면 메뉴 표시 / 톡톡 더블탭 시 6대 모드 순환
      const handleTouchStart = () => {
        isLongPressTriggered.current = false;
        longPressTimerRef.current = setTimeout(() => {
          isLongPressTriggered.current = true;
          setIsHudToolbarVisible(true);
          if (navigator.vibrate) navigator.vibrate(60);
          if (hudToolbarTimer.current) clearTimeout(hudToolbarTimer.current);
          hudToolbarTimer.current = setTimeout(() => {
            setIsHudToolbarVisible(false);

        }, 850);
      };

      const handleTouchEnd = () => {
        if (longPressTimerRef.current) {

        }
      };

      const handleHudClick = () => {
        if (isLongPressTriggered.current) {
          isLongPressTriggered.current = false;
          return;
        }

        const now = Date.now();
        const timeSinceLast = now - lastTapTimeRef.current;

        // 더블 탭(400ms 이내 2회 탭) 감지 시 모드 변경
        if (timeSinceLast < 400 && timeSinceLast > 50) {
          const nextStep = (hudCycleStep % 6) + 1;
          setHudCycleStep(nextStep);

          const modeLabels = {
            1: '1. 일반 세로 모드',
            2: '2. 일반 가로 모드 (좌)',
            3: '3. 일반 가로 모드 (우)',
            4: '4. 유리 반사 (거울 세로)',
            5: '5. 유리 반사 (거울 가로 좌)',
            6: '6. 유리 반사 (거울 가로 우)'
          };

          setHudToastText(modeLabels[nextStep]);
          if (hudToastTimer.current) clearTimeout(hudToastTimer.current);
          hudToastTimer.current = setTimeout(() => {
            setHudToastText('');

          lastTapTimeRef.current = 0;
        } else {
          lastTapTimeRef.current = now;
        }

        const str = String(speed);
        if (str.length === 1) return 'min(58vw, 65vh)';
        if (str.length === 2) return 'min(44vw, 50vh)';
        return 'min(32vw, 36vh)';

      const hudNumberTransformStyle = useMemo(() => {
        if (hudCycleStep === 1) {
          return { transform: 'none' };

        if (hudCycleStep === 2) {

          return {
            width: `${hudDims.h}px`,
            height: `${hudDims.w}px`,
            position: 'absolute',
            top: '50%',
            left: '50%',
            transform: 'translate(-50%, -50%) rotate(90deg)'
          };
        }
        if (hudCycleStep === 3) {
          // 일반 가로 우 (-90도 정방향)
          return {
            width: `${hudDims.h}px`,
            height: `${hudDims.w}px`,
            position: 'absolute',
            top: '50%',
            left: '50%',
            transform: 'translate(-50%, -50%) rotate(-90deg)'
          };
        }
        if (hudCycleStep === 4) {
          // 유리 반사 세로 (상하 반전)
          return { transform: 'scaleY(-1)' };
        }
        if (hudCycleStep === 5) {
          // 유리 반사 가로 좌 (90도 회전 + 상하 반전)
          return {
            width: `${hudDims.h}px`,
            height: `${hudDims.w}px`,
            position: 'absolute',
            top: '50%',
            left: '50%',
            transform: 'translate(-50%, -50%) rotate(90deg) scaleY(-1)'
          };
        }
        if (hudCycleStep === 6) {
          // 유리 반사 가로 우 (-90도 회전 + 상하 반전)
          return {
            width: `${hudDims.h}px`,
            height: `${hudDims.w}px`,
            position: 'absolute',
            top: '50%',
            left: '50%',
            transform: 'translate(-50%, -50%) rotate(-90deg) scaleY(-1)'
          };
        }
        return { transform: 'none' };
      }, [hudCycleStep, hudDims]);

                <button

                      : 'bg-slate-950 text-slate-200 border-slate-800 hover:border-slate-700'

          <main className={`flex-1 relative w-full overflow-hidden ${currentTab === 'hud' ? 'p-0' : 'p-3.5 md:p-6 overflow-y-auto max-w-4xl mx-auto w-full'}`}>
            
            {/* 1. 운행 기록 달력 탭 (첫 메인 화면) */}
            {currentTab === 'calendar' && (
              <div className="space-y-3 pb-6 flex flex-col justify-between min-h-full">
                <div className="space-y-3">
                  
                  {/* 상단 운행 상태 배너: 출근 전/출근 완료 전환 */}
                  <div className="bg-slate-900 p-3.5 rounded-2xl border border-slate-800 flex items-center justify-between shadow">
                    <div>
                      <span className="text-xs text-slate-400 font-bold block">오늘 운행 상태</span>
                      <div className="text-base font-black text-yellow-400 mt-0.5">
                        {todayRecord.startTime ? `${todayRecord.startTime} 출근 완료` : '출근 전 (대기 중)'}
                      </div>
                    </div>
                    <div>
                      {!todayRecord.startTime ? (
                        <button

                        >

                  <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800 flex items-center justify-between">
                    <button onClick={() => {

                      const prevDate = new Date(y, m - 2, 1);
                      setCurrentYearMonth(`${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`);
                    }} className="w-9 h-9 flex items-center justify-center bg-slate-800 rounded-xl text-slate-300 font-bold">◀</button>
                    <div className="text-center">

                        {currentMonthStats.workDays}일 운행 / {formatMinutesToHours(currentMonthStats.totalWorkMinutes)}
                      </div>

                    <button onClick={() => {

                    }} className="w-9 h-9 flex items-center justify-center bg-slate-800 rounded-xl text-slate-300 font-bold">▶</button>

                  <div className="grid grid-cols-2 gap-2">
                    <div className="bg-slate-900 p-3.5 rounded-2xl border border-slate-800">

                      <span className="text-xs text-green-400 block font-semibold">{activeType === 'corporate' ? '통장 예상 월급' : '과세 소득금액'}</span>
                      <span className="text-lg font-black text-green-400 block mt-0.5">

                    <div>

                    </div>
                    <div>
                      <span className="text-[10px] text-slate-400 block font-bold">일 평균 수입</span>
                      <span className="text-xs font-black text-yellow-400 mt-1 block">
                        {formatMoney(currentMonthStats.avgDailyRevenue)}원
                      </span>
                    </div>
                    <div>
                      <span className="text-[10px] text-emerald-400 block font-bold">평균 시급</span>
                      <span className="text-xs font-black text-emerald-300 mt-1 block">

                      </span>

                  <div className="bg-slate-900 p-3.5 rounded-2xl border border-slate-800">
                    <div className="grid grid-cols-7 text-center text-xs font-bold text-slate-400 pb-2 border-b border-slate-800 mb-2">
                      {DAYS_NAME.map((dName, idx) => (
                        <span key={dName} className={`${idx === 0 ? 'text-red-400' : idx === 6 ? 'text-blue-400' : idx === (appData.defaultOffDay || 1) ? 'text-emerald-400' : 'text-slate-300'}`}>

                    <div className="grid grid-cols-7 gap-1">
                      {calendarCells.map((dateStr, idx) => {

      const handleSave = () => {
        const base = { isHoliday, memo, startTime, endTime, workMinutes: calculatedMins };
        if (activeType === 'corporate') {
          onSave({ ...base, revenue: Number(revenue) || 0, gas: Number(gas) || 0, driverExpense: Number(driverExpense) || 0 });
        } else {
          onSave({ ...base, cardRev: Number(cardRev) || 0, cashRev: Number(cashRev) || 0, gas: Number(privGas) || 0, toll: Number(toll) || 0, maint: Number(maint) || 0, other: Number(other) || 0 });
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3.5 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center pb-2 border-b border-slate-800">
              <h3 className="text-sm font-bold text-yellow-400">{dateKey} 운행 기록</h3>
              <button onClick={onClose} className="text-slate-400 font-bold text-base">✕</button>
            </div>
            <label className="flex items-center gap-2.5 bg-slate-950 p-3 rounded-xl border border-slate-800 cursor-pointer">
              <input type="checkbox" checked={isHoliday} onChange={(e) => setIsHoliday(e.target.checked)} className="w-5 h-5 rounded text-yellow-500" />
              <span className="text-xs font-bold text-slate-300">이 날은 휴무했습니다 (미운행)</span>
            </label>
            {!isHoliday && (
              <div className="space-y-3">
                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-slate-300">근무 시간 (출·퇴근)</span>
                    {calculatedMins > 0 && <span className="text-xs font-bold text-blue-400">{formatMinutesToHours(calculatedMins)}</span>}
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">출근 시간</label>
                      <input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} className="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-xs text-white text-center font-bold" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">퇴근 시간</label>
                      <input type="time" value={endTime} onChange={(e) => setEndTime(e.target.value)} className="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-xs text-white text-center font-bold" />
                    </div>
                  </div>
                </div>
                {activeType === 'corporate' ? (
                  <>
                    <div><label className="text-xs text-slate-300 block mb-1">당일 총매출</label><SmartMoneyInput value={revenue} onChange={setRevenue} colorClass="text-yellow-400" /></div>
                    <div><label className="text-xs text-blue-400 block mb-1">가스비</label><SmartMoneyInput value={gas} onChange={setGas} colorClass="text-blue-300" /></div>
                    <div><label className="text-xs text-orange-400 block mb-1">기타 기사경비</label><SmartMoneyInput value={driverExpense} onChange={setDriverExpense} colorClass="text-orange-300" /></div>
                  </>
                ) : (
                  <>
                    <div className="grid grid-cols-2 gap-2">
                      <div><label className="text-xs text-slate-300 block mb-1">카드 수입</label><SmartMoneyInput value={cardRev} onChange={setCardRev} /></div>
                      <div><label className="text-xs text-slate-300 block mb-1">현금 수입</label><SmartMoneyInput value={cashRev} onChange={setCashRev} /></div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div><label className="text-xs text-slate-300 block mb-1">가스비</label><SmartMoneyInput value={privGas} onChange={setPrivGas} /></div>
                      <div><label className="text-xs text-slate-300 block mb-1">통행료</label><SmartMoneyInput value={toll} onChange={setToll} /></div>
                    </div>
                  </>
                )}
                <div>
                  <label className="text-xs text-slate-300 block mb-1">운행 메모</label>
                  <input type="text" placeholder="특이사항 메모" value={memo} onChange={(e) => setMemo(e.target.value)} className="w-full bg-slate-950 border border-slate-700 p-2.5 text-xs rounded-xl text-white" />
                </div>
              </div>
            )}
            <div className="flex gap-2 pt-2">
              <button onClick={handleSave} className="flex-1 py-3 bg-yellow-500 text-black font-bold rounded-xl text-xs">저장 완료</button>
              <button onClick={onClose} className="px-4 py-3 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">취소</button>
            </div>
          </div>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("K-TAXI Error Caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="h-full bg-black text-slate-100 flex flex-col items-center justify-center p-6 text-center">
              <div className="bg-slate-900 border border-red-500/40 p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl">
                <div>
                  <h2 className="text-base font-bold text-red-400">데이터 안전 보호 모드</h2>
                  <p className="text-xs text-slate-400 mt-1.5 leading-relaxed">화면을 새로고침하여 시스템을 복구합니다.</p>
                </div>
                <button onClick={() => window.location.reload()} className="w-full py-3 bg-yellow-500 text-black font-bold text-xs rounded-xl shadow">화면 새로고침</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
