    const calculateDistanceMeters = (lat1, lon1, lat2, lon2) => {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    };

    let activeAudioSources = [];
    const getAudioContext = () => {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!window._kTaxiAudioCtx) {
        window._kTaxiAudioCtx = new AudioCtx();
      }
      if (window._kTaxiAudioCtx.state === 'suspended') {
        window._kTaxiAudioCtx.resume();
      }
      return window._kTaxiAudioCtx;
    };

    const stopAllAudio = () => {
      activeAudioSources.forEach((src) => {
        try {
          if (src.stop) src.stop();
          if (src.disconnect) src.disconnect();
        } catch (e) {}
      });
      activeAudioSources = [];
    };

    const playNavigationChime = (type = 'chime') => {
      try {
        stopAllAudio();
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'chime') {
          [0, 0.16].forEach((delay, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(idx === 0 ? 880 : 1174, now + delay);
            gain.gain.setValueAtTime(0.4, now + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + delay);
            osc.stop(now + delay + 0.35);
            activeAudioSources.push(osc);
          });
        } else if (type === 'warning') {
          [0, 0.12].forEach((delay) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1318, now + delay);
            gain.gain.setValueAtTime(0.55, now + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + delay);
            osc.stop(now + delay + 0.1);
            activeAudioSources.push(osc);
          });
        }
      } catch (e) {
        console.warn('Audio Error:', e);
      }
    };

    const formatShortMoney = (val) => {
      const num = Number(val) || 0;
      if (num === 0) return '0';
      if (num >= 10000) return (num / 10000).toFixed(num % 10000 === 0 ? 0 : 1) + '만';
      return (num / 1000).toFixed(0) + '천';
    };
    const getTodayKey = () => {
      const now = new Date();

    };
    const getCurrentTimeStr = () => {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    };
    const calculateMinutes = (start, end) => {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let sMin = sh * 60 + sm;
      let eMin = eh * 60 + em;
      if (eMin < sMin) eMin += 24 * 60;
      return Math.max(0, eMin - sMin);
    };
    const formatMinutesToHours = (totalMins) => {
      if (!totalMins || totalMins <= 0) return '0시간';
      const hours = Math.floor(totalMins / 60);
      const mins = totalMins % 60;
      return mins === 0 ? `${hours}시간` : `${hours}시간 ${mins}분`;
    };

    const DEFAULT_STORAGE = {

        { id: 4, type: 'nap', time: '01:30', title: '새벽 20분 파워 쪽잠', done: false }
      ],

        ],
        fixedExpenseItems: [
          { id: 1, name: '노조비', amount: 25000 },

        ],

      }
    };

    const loadSafeData = () => {
      try {
        let bestCandidate = null;
        let mostRecordsCount = -1;

        const keysToScan = [];
        for (let i = 26; i >= 1; i--) keysToScan.push(`K_TAXI_RECORD_DATA_V${i}`);
        keysToScan.push('K_TAXI_RECORD_DATA', 'k_taxi_data');

        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && (k.includes('TAXI') || k.includes('RECORD')) && !keysToScan.includes(k)) {
            keysToScan.push(k);
          }
        }

        for (const k of keysToScan) {
          const raw = localStorage.getItem(k);
          if (raw) {
            try {
              const p = JSON.parse(raw);
              if (p) {
                const corpRecs = Object.keys(p.corporate?.records || {}).length;
                const privRecs = Object.keys(p.private?.records || {}).length;
                const totalRecs = corpRecs + privRecs;

                if (totalRecs > mostRecordsCount) {
                  mostRecordsCount = totalRecs;
                  bestCandidate = p;
                }
              }
            } catch(e) {}
          }
        }

        if (bestCandidate) {
          const p = bestCandidate;
          return {
            hasSelectedType: true,
            isShiftActive: Boolean(p.isShiftActive),
            activeType: (p.activeType || p.activeTab || 'corporate') === 'private' ? 'private' : 'corporate',
            hudSpeedLimit: Number(p.hudSpeedLimit || 50),
            defaultOffDay: Number(p.defaultOffDay !== undefined ? p.defaultOffDay : 1),
            googleSheetUrl: p.googleSheetUrl || '',
            defenseHistory: Array.isArray(p.defenseHistory) ? p.defenseHistory : DEFAULT_STORAGE.defenseHistory,
            healthRoutines: Array.isArray(p.healthRoutines) && p.healthRoutines.length > 0 ? p.healthRoutines : DEFAULT_STORAGE.healthRoutines,
            corporate: {
              carNumber: p.corporate?.carNumber || '충남31바3238',

            private: {

              records: p.private?.records || {}
            }
          };
        }
      } catch (e) {
        console.warn('Storage Load Fallback', e);
      }
      return DEFAULT_STORAGE;
    };

    function SlideToUnlock({ onUnlock, text = "오른쪽으로 밀어서 퇴근하기" }) {
      const [dragX, setDragX] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const containerRef = useRef(null);
      const startXRef = useRef(0);

      const handleStart = (clientX) => {
        setIsDragging(true);
        startXRef.current = clientX;
      };

      const handleMove = (clientX) => {
        if (!isDragging || !containerRef.current) return;
        const maxDrag = containerRef.current.clientWidth - 62;
        const delta = clientX - startXRef.current;
        const bounded = Math.max(0, Math.min(delta, maxDrag));
        setDragX(bounded);
      };

      const handleEnd = () => {
        if (!isDragging || !containerRef.current) return;
        setIsDragging(false);
        const maxDrag = containerRef.current.clientWidth - 62;
        if (dragX >= maxDrag * 0.82) {
          setDragX(maxDrag);
          onUnlock();
          setTimeout(() => setDragX(0), 800);
        } else {
          setDragX(0);
        }
      };

      return (
        <div
          ref={containerRef}
          className="relative w-full h-16 bg-slate-900 border-2 border-orange-500/80 rounded-2xl overflow-hidden flex items-center justify-center select-none shadow-2xl"
          onTouchStart={(e) => handleStart(e.touches[0].clientX)}
          onTouchMove={(e) => handleMove(e.touches[0].clientX)}
          onTouchEnd={handleEnd}
          onMouseDown={(e) => handleStart(e.clientX)}
          onMouseMove={(e) => handleMove(e.clientX)}
          onMouseUp={handleEnd}
          onMouseLeave={handleEnd}
        >
          <div
            className="absolute left-0 top-0 bottom-0 bg-gradient-to-r from-orange-600/30 to-red-600/50"
            style={{ width: `${dragX + 32}px` }}
          />

          <span className="text-sm font-black text-slate-200 tracking-wider flex items-center gap-2 pointer-events-none">
            <span>{text}</span>
            <span className="text-orange-400 font-bold">➔➔</span>
          </span>

          <div
            className="absolute left-1.5 top-1.5 bottom-1.5 w-14 bg-gradient-to-tr from-orange-500 to-red-600 text-white font-black text-base rounded-xl flex items-center justify-center shadow-lg cursor-grab active:cursor-grabbing transition-transform duration-75"
            style={{ transform: `translateX(${dragX}px)` }}
          >
            퇴근
          </div>
        </div>
      );
    }

    function SmartMoneyInput({ value, onChange, placeholder = "0", className = "", colorClass = "text-white" }) {
      const numVal = Number(value) || 0;
      const displayVal = numVal > 0 ? numVal.toLocaleString('ko-KR') : '';

      return (
        <div className="relative flex items-center w-full">
          {numVal > 0 && (
            <button
              type="button"
              onClick={() => onChange(0)}
              className="absolute left-2 z-10 text-slate-400 hover:text-red-400 bg-slate-800 active:bg-slate-700 rounded-full w-6 h-6 flex items-center justify-center text-xs font-black"
              tabIndex={-1}
            >
              ✕
            </button>
          )}
          <input
            type="text"
            inputMode="numeric"
            value={displayVal}
            placeholder={placeholder}
            onFocus={(e) => e.target.select()}
            onChange={(e) => {
              const raw = e.target.value.replace(/[^0-9]/g, '');
              onChange(raw ? Number(raw) : 0);
            }}
            className={`w-full bg-slate-900 border border-slate-700 p-2.5 text-base rounded-xl text-right font-bold ${colorClass} focus:border-yellow-500 focus:outline-none ${className}`}
          />
        </div>
      );
    }

      // 단속 방어 / 적발 이력

        const ctx = canvas.getContext('2d');
        let animId = null;

        const renderPip = (time) => {
          const tSec = time / 1000;
          const cycleRatio = (tSec % 0.85) / 0.85;
          const isTopPumping = Math.sin(cycleRatio * Math.PI * 2) > 0;

          if (isNearCamera && isOverSpeed) {
            const strobeColors = ['#450a0a', '#713f12', '#083344', '#3b0764'];
            ctx.fillStyle = strobeColors[Math.floor((time / 125) % strobeColors.length)];
          } else {
            ctx.fillStyle = '#020617';
          }
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.lineWidth = 6;
          if (isNearCamera && isOverSpeed) {
            const borderColors = ['#ef4444', '#eab308', '#06b6d4', '#a855f7'];
            ctx.strokeStyle = borderColors[Math.floor((time / 125) % borderColors.length)];
          } else if (isNearCamera) {
            ctx.strokeStyle = '#00f5ff';
          } else {
            ctx.strokeStyle = '#334155';
          }
          ctx.strokeRect(3, 3, canvas.width - 6, canvas.height - 6);

          // 상단 미터기 상태
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(6, 6, canvas.width - 12, 28);
          ctx.font = 'bold 14px sans-serif';
          if (meterStatus === 'empty') {
            ctx.fillStyle = '#facc15';
            ctx.fillText('빈차 대기 중', 14, 25);
          } else if (meterStatus === 'driving') {
            ctx.fillStyle = '#4ade80';
            ctx.fillText(`주행 중 (${(meterDistanceM / 1000).toFixed(1)}km)`, 14, 25);
            ctx.fillStyle = '#f8fafc';
            ctx.textAlign = 'right';
            ctx.fillText(`${formatMoney(meterFare)}원`, canvas.width - 16, 25);
            ctx.textAlign = 'left';
          } else {
            ctx.fillStyle = '#f87171';
            ctx.fillText(`정산 대기: ${formatMoney(meterFare)}원`, 14, 25);
          }

          // 좌측 제한 표지판 (5:5 교대 펌핑)
          const topScale = isNearCamera ? (isTopPumping ? 1.06 : 0.95) : 1.0;
          ctx.save();
          ctx.translate(65, 95);
          ctx.scale(topScale, topScale);
          ctx.beginPath();
          ctx.arc(0, 0, 36, 0, Math.PI * 2);
          ctx.fillStyle = isNearCamera ? '#ffffff' : 'rgba(255,255,255,0.15)';
          ctx.fill();
          ctx.lineWidth = 7;
          ctx.strokeStyle = isNearCamera ? '#dc2626' : 'rgba(220,38,38,0.4)';
          ctx.stroke();

          ctx.fillStyle = isNearCamera ? '#000000' : 'rgba(255,255,255,0.4)';
          ctx.font = '900 32px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(effectiveLimit), 0, 0);
          ctx.restore();

          // 우측 실시간 속도계 (5:5 교대 펌핑)
          const bottomScale = isNearCamera ? (!isTopPumping ? 1.06 : 0.95) : 1.0;
          ctx.save();
          ctx.translate(200, 95);
          ctx.scale(bottomScale, bottomScale);
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          if (isOverSpeed) {
            ctx.fillStyle = '#ff1e44';
            ctx.shadowColor = 'rgba(255,30,68,1)';
            ctx.shadowBlur = 20;
          } else if (isNearCamera) {
            ctx.fillStyle = '#00f5ff';
            ctx.shadowColor = 'rgba(0,245,255,1)';
            ctx.shadowBlur = 18;
          } else {
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.shadowBlur = 0;
          }

          ctx.font = '900 70px monospace';
          ctx.fillText(String(gpsSpeed), 0, -4);

          ctx.font = '700 13px sans-serif';
          ctx.fillStyle = '#94a3b8';
          ctx.shadowBlur = 0;
          ctx.fillText('KM/H', 0, 30);

          // 하단 단속바

            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';

          }

          animId = requestAnimationFrame(renderPip);
        };

          const taxAndInsurance = Math.round(grossSalary * deductionRate);
          const totalDeductions = taxAndInsurance + totalFixedExpenses;
          return { workDays, holidayDays, totalWorkMinutes, totalRevenue, totalGasCompany, totalIncentive, grossSalary, taxAndInsurance, totalFixedExpenses, totalDeductions, netSalaryFromCompany: grossSalary - totalDeductions, totalDriverExpense, finalNetIncome: grossSalary - totalDeductions - totalDriverExpense };
        } else {

              maintTotal += Number(r?.maint || 0);
              otherTotal += Number(r?.other || 0);
              totalWorkMinutes += Number(r?.workMinutes || 0);

          const totalExpense = gasTotal + tollTotal + maintTotal + otherTotal;
          return { workDays, holidayDays, totalWorkMinutes, cardTotal, cashTotal, totalRevenue, gasTotal, tollTotal, maintTotal, otherTotal, totalExpense, netIncome: totalRevenue - totalExpense };

          {showDefenseListModal && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border-2 border-emerald-500/50 rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 className="text-sm font-black text-emerald-400">단속 방어 & 적발 상세 내역</h3>
                  <button onClick={() => setShowDefenseListModal(false)} className="text-slate-400 font-bold text-base hover:text-white">✕</button>
                </div>

                <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 grid grid-cols-3 gap-1 text-center">
                  <div>
                    <span className="text-[10px] text-slate-400 block font-semibold">방어 성공</span>
                    <span className="text-sm font-black text-emerald-400">{passCount}회 (+{formatShortMoney(totalSaved)})</span>
                  </div>
                  <div className="border-x border-slate-800">
                    <span className="text-[10px] text-slate-400 block font-semibold">적발 의심</span>
                    <span className="text-sm font-black text-red-400">{failCount}회 (-{formatShortMoney(totalFines)})</span>
                  </div>
                  <div>
                    <span className="text-[10px] text-slate-400 block font-semibold">순방어액</span>
                    <span className={`text-sm font-black ${netSaved >= 0 ? 'text-yellow-400' : 'text-red-400'}`}>
                      {formatShortMoney(netSaved)}
                    </span>
                  </div>
                </div>

                <div className="max-h-60 overflow-y-auto space-y-2 pr-1">
                  {defenseHistory.length === 0 ? (
                    <div className="text-center py-6 text-xs text-slate-500">기록된 단속 내역이 없습니다.</div>
                  ) : (
                    defenseHistory.map((item) => (
                      <div key={item.id} className="p-3 rounded-xl border border-slate-800 bg-slate-950 flex items-center justify-between text-xs">
                        <div>
                          <div className="font-bold text-slate-200 text-sm">{item.name}</div>
                          <div className="text-xs text-slate-400 font-medium mt-0.5">
                            {item.time} 통과 ({item.type === 'parking' ? '주정차' : `제한 ${item.limit} | 주행 ${item.speed}km/h`})
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className={`text-xs font-black px-2 py-1 rounded-lg border ${
                            item.status === 'pass'
                              ? 'text-emerald-400 bg-emerald-950 border-emerald-500/40'
                              : 'text-red-400 bg-red-950 border-red-500/40'
                          }`}>
                            {item.amount > 0 ? `+${formatMoney(item.amount)}` : `${formatMoney(item.amount)}`}원
                          </span>
                          <button onClick={() => handleDeleteDefenseItem(item.id)} className="text-slate-500 hover:text-red-400 px-1 font-bold text-sm">✕</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={handleResetDefenseHistory}
                    className="flex-1 py-3 bg-slate-800 hover:bg-red-950 text-slate-300 hover:text-red-300 font-bold rounded-xl text-xs border border-slate-700"
                  >
                    내역 초기화
                  </button>
                  <button
                    onClick={() => setShowDefenseListModal(false)}
                    className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl text-xs shadow-lg"
                  >
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 8. 일별 장부 입력 모달 */}
          {showDailyModal && (
            <DailyRecordModal
              activeType={activeType}
              dateKey={selectedDate}
              existingData={appData[activeType]?.records?.[selectedDate] || {}}
              onSave={(data) => handleSaveRecord(selectedDate, data)}
              onClose={() => setShowDailyModal(false)}
            />
          )}

          {/* 9. 세무서 양식 모달 */}
          {showTaxModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold text-yellow-400">세무서 제출 양식</h3>
                  <button onClick={() => setShowTaxModal(false)} className="text-slate-400 text-base font-bold">✕</button>
                </div>
                <textarea readOnly value={`[세무서 제출용 소득 요약서]\n귀속기간: ${currentYearMonth}\n차량번호: ${appData.private?.carNumber || '미등록'}\n매출합계: ${formatMoney(currentMonthStats.totalRevenue)}\n경비합계: ${formatMoney(currentMonthStats.totalExpense)}\n과세소득: ${formatMoney(currentMonthStats.netIncome)}`} className="w-full h-44 bg-slate-950 text-slate-200 text-xs font-mono p-2.5 rounded-xl border border-slate-800 resize-none" />
                <button onClick={() => {
                  navigator.clipboard.writeText(`[세무서 제출용 소득 요약서]\n귀속기간: ${currentYearMonth}\n차량번호: ${appData.private?.carNumber || '미등록'}\n매출합계: ${formatMoney(currentMonthStats.totalRevenue)}\n경비합계: ${formatMoney(currentMonthStats.totalExpense)}\n과세소득: ${formatMoney(currentMonthStats.netIncome)}`);
                  alert('복사되었습니다.');
                }} className="w-full py-3 bg-yellow-500 text-black font-bold rounded-xl text-xs">내용 전체 복사</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function DailyRecordModal({ activeType, dateKey, existingData, onSave, onClose }) {
      const [isHoliday, setIsHoliday] = useState(existingData?.isHoliday || false);
      const [memo, setMemo] = useState(existingData?.memo || '');
      const [startTime, setStartTime] = useState(existingData?.startTime || '');
      const [endTime, setEndTime] = useState(existingData?.endTime || '');
      const [revenue, setRevenue] = useState(existingData?.revenue || 0);
      const [gas, setGas] = useState(existingData?.gas || 0);
      const [driverExpense, setDriverExpense] = useState(existingData?.driverExpense || 0);
      const [cardRev, setCardRev] = useState(existingData?.cardRev || 0);
      const [cashRev, setCashRev] = useState(existingData?.cashRev || 0);
      const [privGas, setPrivGas] = useState(existingData?.gas || 0);
      const [toll, setToll] = useState(existingData?.toll || 0);
      const [maint, setMaint] = useState(existingData?.maint || 0);
      const [other, setOther] = useState(existingData?.other || 0);

      const calculatedMins = calculateMinutes(startTime, endTime);

      const handleSave = () => {
        const base = { isHoliday, memo, startTime, endTime, workMinutes: calculatedMins };
        if (activeType === 'corporate') {
          onSave({ ...base, revenue: Number(revenue) || 0, gas: Number(gas) || 0, driverExpense: Number(driverExpense) || 0 });
        } else {
          onSave({ ...base, cardRev: Number(cardRev) || 0, cashRev: Number(cashRev) || 0, gas: Number(privGas) || 0, toll: Number(toll) || 0, maint: Number(maint) || 0, other: Number(other) || 0 });
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3.5 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center pb-2 border-b border-slate-800">
              <h3 className="text-sm font-bold text-yellow-400">{dateKey} 운행 기록</h3>
              <button onClick={onClose} className="text-slate-400 font-bold text-base">✕</button>
            </div>
            <label className="flex items-center gap-2.5 bg-slate-950 p-3 rounded-xl border border-slate-800 cursor-pointer">
              <input type="checkbox" checked={isHoliday} onChange={(e) => setIsHoliday(e.target.checked)} className="w-5 h-5 rounded text-yellow-500" />
              <span className="text-xs font-bold text-slate-300">이 날은 휴무했습니다 (미운행)</span>
            </label>
            {!isHoliday && (
              <div className="space-y-3">
                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-slate-300">근무 시간 (출·퇴근)</span>
                    {calculatedMins > 0 && <span className="text-xs font-bold text-blue-400">{formatMinutesToHours(calculatedMins)}</span>}
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">출근 시간</label>
                      <input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} className="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-xs text-white text-center font-bold" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">퇴근 시간</label>
                      <input type="time" value={endTime} onChange={(e) => setEndTime(e.target.value)} className="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-xs text-white text-center font-bold" />
                    </div>
                  </div>
                </div>
                {activeType === 'corporate' ? (
                  <>
                    <div><label className="text-xs text-slate-300 block mb-1">당일 총매출</label><SmartMoneyInput value={revenue} onChange={setRevenue} colorClass="text-yellow-400" /></div>
                    <div><label className="text-xs text-blue-400 block mb-1">가스비</label><SmartMoneyInput value={gas} onChange={setGas} colorClass="text-blue-300" /></div>
                    <div><label className="text-xs text-orange-400 block mb-1">기타 기사경비</label><SmartMoneyInput value={driverExpense} onChange={setDriverExpense} colorClass="text-orange-300" /></div>
                  </>
                ) : (
                  <>
                    <div className="grid grid-cols-2 gap-2">
                      <div><label className="text-xs text-slate-300 block mb-1">카드 수입</label><SmartMoneyInput value={cardRev} onChange={setCardRev} /></div>
                      <div><label className="text-xs text-slate-300 block mb-1">현금 수입</label><SmartMoneyInput value={cashRev} onChange={setCashRev} /></div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div><label className="text-xs text-slate-300 block mb-1">가스비</label><SmartMoneyInput value={privGas} onChange={setPrivGas} /></div>
                      <div><label className="text-xs text-slate-300 block mb-1">통행료</label><SmartMoneyInput value={toll} onChange={setToll} /></div>
                    </div>
                  </>
                )}
                <div>
                  <label className="text-xs text-slate-300 block mb-1">운행 메모</label>
                  <input type="text" placeholder="특이사항 메모" value={memo} onChange={(e) => setMemo(e.target.value)} className="w-full bg-slate-950 border border-slate-700 p-2.5 text-xs rounded-xl text-white" />
                </div>
              </div>
            )}
            <div className="flex gap-2 pt-2">
              <button onClick={handleSave} className="flex-1 py-3 bg-yellow-500 text-black font-bold rounded-xl text-xs">저장 완료</button>
              <button onClick={onClose} className="px-4 py-3 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">취소</button>
            </div>
          </div>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("K-TAXI Error Caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="h-full bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-6 text-center">
              <div className="bg-slate-900 border border-red-500/40 p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl">
                <div>
                  <h2 className="text-base font-bold text-red-400">데이터 안전 보호 모드</h2>
                  <p className="text-xs text-slate-400 mt-1.5 leading-relaxed">화면을 새로고침하여 시스템을 복구합니다.</p>
                </div>
                <button onClick={() => window.location.reload()} className="w-full py-3 bg-yellow-500 text-black font-bold text-xs rounded-xl shadow">화면 새로고침</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
