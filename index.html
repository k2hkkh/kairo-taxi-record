<body class="select-none antialiased bg-black">
  <div id="root">
    <div class="h-full flex items-center justify-center text-yellow-400 font-bold text-base bg-black">
      K-TAXI 시스템 로딩 중...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const APP_VERSION = 'v6.0.0';
    const CURRENT_STORAGE_KEY = 'K_TAXI_RECORD_DATA_V24';
    const BACKUP_SLOT_KEY = 'K_TAXI_EMERGENCY_BACKUP_SLOT';

    const WELCOME_MESSAGES = [
      "오늘도 안전운전 하실 거죠? 안전이 가장 큰 수입입니다!",
      "즐거운 마음으로 오늘도 기분 좋게 달려봐요!",
      "승객에게는 친절한 미소, 기사님에게는 무사고 완주!",
      "조급할수록 천천히! 오늘도 안전하게 완주해요.",
      "오늘도 매너 좋은 손님들과 함께하는 행복한 하루 되세요!"
    ];

    const CLOSING_MESSAGES = [
      "오늘 하루도 정말 수고하셨습니다. 편안한 휴식을 푹 취하세요!",
      "즐거운 마음으로 내일 다시 만나요! 푹 쉬세요.",
      "내일을 위하여 오늘은 충분하고 편안한 휴식을 취하세요.",
      "오늘도 안전하게 무사고 완주하셨습니다. 고생 많으셨습니다!"
    ];

    const formatMoney = (val) => Number(String(val).replace(/[^0-9]/g, '') || 0).toLocaleString('ko-KR');
    const formatShortMoney = (val) => {
      const num = Number(val) || 0;
      if (num === 0) return '0';
      if (num >= 10000) return (num / 10000).toFixed(num % 10000 === 0 ? 0 : 1) + '만';
      return (num / 1000).toFixed(0) + '천';
    };
    
    const getTodayKey = () => {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    };
    const getYesterdayKey = () => {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const getCurrentTimeStr = () => {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    };
    const calculateMinutes = (start, end) => {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let sMin = sh * 60 + sm;
      let eMin = eh * 60 + em;
      if (eMin < sMin) eMin += 24 * 60;
      return Math.max(0, eMin - sMin);
    };
    const formatMinutesToHours = (totalMins) => {
      if (!totalMins || totalMins <= 0) return '0시간';
      const hours = Math.floor(totalMins / 60);
      const mins = totalMins % 60;
      return mins === 0 ? `${hours}시간` : `${hours}시간 ${mins}분`;
    };

    const isLastDayOfMonth = (yearMonthStr) => {
      const today = new Date();
      const [y, m] = yearMonthStr.split('-').map(Number);
      const lastDay = new Date(y, m, 0).getDate();
      return today.getFullYear() === y && (today.getMonth() + 1) === m && today.getDate() === lastDay;
    };

    const playAlarmSound = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.5);
      } catch (e) {
        console.warn('Audio play failed', e);
      }
    };

    const DEFAULT_STORAGE = {
      isShiftActive: false,
      activeType: 'corporate',
      activeShiftDate: '',
      googleSheetUrl: '',
      healthRoutines: [
        { id: 1, time: '18:00', title: '저녁 혈압/당뇨 약 복용', alarmEnabled: true },
        { id: 2, time: '20:30', title: '간편 건강식 (감자/계란/샐러드)', alarmEnabled: false },
        { id: 3, time: '23:00', title: '충전 시 허리 스트레칭', alarmEnabled: true },
        { id: 4, time: '01:30', title: '새벽 20분 파워 쪽잠', alarmEnabled: true }
      ],
      corporate: {
        carNumber: '충남31바3238',
        shiftType: 'single',
        dailyDeposit: 201000,
        deductionRate: 9.0,
        fixedAllowanceItems: [
          { id: 1, name: '기본급', amount: 1181700 },
          { id: 2, name: '승무수당', amount: 130000 },
          { id: 3, name: '교육수당', amount: 21000 },
          { id: 4, name: '법정휴일수당', amount: 35000 }
        ],
        fixedExpenseItems: [
          { id: 1, name: '노조비', amount: 25000 },
          { id: 2, name: '상조회비', amount: 0 }
        ],
        records: {}
      },
      private: {
        carNumber: '충남31바3238',
        records: {}
      }
    };

    const loadSafeData = () => {
      try {
        let bestCandidate = null;
        let mostRecordsCount = -1;
        const keysToScan = [];
        for (let i = 28; i >= 1; i--) keysToScan.push(`K_TAXI_RECORD_DATA_V${i}`);
        keysToScan.push('K_TAXI_RECORD_DATA', 'k_taxi_data', BACKUP_SLOT_KEY);

        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && (k.includes('TAXI') || k.includes('RECORD')) && !keysToScan.includes(k)) {
            keysToScan.push(k);
          }
        }

        for (const k of keysToScan) {
          const raw = localStorage.getItem(k);
          if (raw) {
            try {
              const p = JSON.parse(raw);
              if (p) {
                const corpRecs = Object.keys(p.corporate?.records || {}).length;
                const privRecs = Object.keys(p.private?.records || {}).length;
                const totalRecs = corpRecs + privRecs;
                if (totalRecs > mostRecordsCount) {
                  mostRecordsCount = totalRecs;
                  bestCandidate = p;
                }
              }
            } catch(e) {}
          }
        }

        if (bestCandidate) {
          const p = bestCandidate;
          return {
            isShiftActive: Boolean(p.isShiftActive),
            activeType: (p.activeType || p.activeTab || 'corporate') === 'private' ? 'private' : 'corporate',
            activeShiftDate: p.activeShiftDate || '',
            googleSheetUrl: p.googleSheetUrl || '',
            healthRoutines: Array.isArray(p.healthRoutines) && p.healthRoutines.length > 0
              ? p.healthRoutines.map(r => ({ ...r, alarmEnabled: r.alarmEnabled !== undefined ? r.alarmEnabled : true }))
              : DEFAULT_STORAGE.healthRoutines,
            corporate: {
              carNumber: p.corporate?.carNumber || '충남31바3238',
              shiftType: p.corporate?.shiftType || 'single',
              dailyDeposit: Number(p.corporate?.dailyDeposit || p.corporate?.baseDeposit || 201000),
              deductionRate: Number(p.corporate?.deductionRate !== undefined ? p.corporate.deductionRate : 9.0),
              fixedAllowanceItems: Array.isArray(p.corporate?.fixedAllowanceItems) && p.corporate.fixedAllowanceItems.length > 0 ? p.corporate.fixedAllowanceItems : DEFAULT_STORAGE.corporate.fixedAllowanceItems,
              fixedExpenseItems: Array.isArray(p.corporate?.fixedExpenseItems) ? p.corporate.fixedExpenseItems : DEFAULT_STORAGE.corporate.fixedExpenseItems,
              records: p.corporate?.records || {}
            },
            private: {
              carNumber: p.private?.carNumber || '충남31바3238',
              records: p.private?.records || {}
            }
          };
        }
      } catch (e) {
        console.warn('Storage Load Fallback', e);
      }
      return DEFAULT_STORAGE;
    };

    // 카카오 스타일 초대형 금액 입력 컴포넌트
    function KakaoLargeMoneyInput({ label, value, onChange, colorClass = "text-yellow-400" }) {
      const numVal = Number(value) || 0;
      const displayVal = numVal > 0 ? numVal.toLocaleString('ko-KR') : '';

      return (
        <div className="bg-slate-900 border-2 border-slate-800 rounded-3xl p-5 shadow-sm space-y-2">
          <div className="flex justify-between items-center">
            <span className="text-sm font-bold text-slate-400">{label}</span>
            {numVal > 0 && (
              <button
                type="button"
                onClick={() => onChange(0)}
                className="text-xs text-slate-400 bg-slate-800 px-3 py-1 rounded-full active:bg-slate-700"
              >
                지우기 ✕
              </button>
            )}
          </div>
          <div className="flex items-baseline justify-end gap-1.5 border-b border-slate-800 pb-2">
            <input
              type="text"
              inputMode="numeric"
              value={displayVal}
              placeholder="0"
              onFocus={(e) => e.target.select()}
              onChange={(e) => {
                const raw = e.target.value.replace(/[^0-9]/g, '');
                onChange(raw ? Number(raw) : 0);
              }}
              className={`w-full bg-transparent text-right font-black text-3xl font-mono focus:outline-none ${colorClass}`}
            />
            <span className="text-lg font-bold text-slate-400">원</span>
          </div>
        </div>
      );
    }

    // 슬라이드 퇴근 컴포넌트
    function SlideToUnlock({ onUnlock, text = "오른쪽으로 밀어서 퇴근하기" }) {
      const [dragX, setDragX] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const containerRef = useRef(null);
      const startXRef = useRef(0);

      const handleStart = (clientX) => {
        setIsDragging(true);
        startXRef.current = clientX;
      };

      const handleMove = (clientX) => {
        if (!isDragging || !containerRef.current) return;
        const maxDrag = containerRef.current.clientWidth - 70;
        const delta = clientX - startXRef.current;
        const bounded = Math.max(0, Math.min(delta, maxDrag));
        setDragX(bounded);
      };

      const handleEnd = () => {
        if (!isDragging || !containerRef.current) return;
        setIsDragging(false);
        const maxDrag = containerRef.current.clientWidth - 70;
        if (dragX >= maxDrag * 0.82) {
          setDragX(maxDrag);
          onUnlock();
          setTimeout(() => setDragX(0), 800);
        } else {
          setDragX(0);
        }
      };

      return (
        <div
          ref={containerRef}
          className="relative w-full h-20 bg-slate-900 border-2 border-orange-500/80 rounded-3xl overflow-hidden flex items-center justify-center select-none shadow-2xl"
          onTouchStart={(e) => handleStart(e.touches[0].clientX)}
          onTouchMove={(e) => handleMove(e.touches[0].clientX)}
          onTouchEnd={handleEnd}
          onMouseDown={(e) => handleStart(e.clientX)}
          onMouseMove={(e) => handleMove(e.clientX)}
          onMouseUp={handleEnd}
          onMouseLeave={handleEnd}
        >
          <div
            className="absolute left-0 top-0 bottom-0 bg-gradient-to-r from-orange-600/30 to-red-600/50"
            style={{ width: `${dragX + 35}px` }}
          />
          <span className="text-base font-black text-slate-200 tracking-wider flex items-center gap-2 pointer-events-none">
            <span>{text}</span>
            <span className="text-orange-400 font-bold">➔➔</span>
          </span>
          <div
            className="absolute left-2 top-2 bottom-2 w-16 bg-gradient-to-tr from-orange-500 to-red-600 text-white font-black text-lg rounded-2xl flex items-center justify-center shadow-lg cursor-grab active:cursor-grabbing transition-transform duration-75"
            style={{ transform: `translateX(${dragX}px)` }}
          >
            퇴근
          </div>
        </div>
      );
    }

    function App() {
      const [appData, setAppData] = useState(loadSafeData);
      const activeType = appData?.activeType === 'private' ? 'private' : 'corporate';
      
      const detectedWorkDate = useMemo(() => {
        if (appData.isShiftActive && appData.activeShiftDate) {
          return appData.activeShiftDate;
        }
        const nowH = new Date().getHours();
        if (nowH < 8) {
          const yKey = getYesterdayKey();
          const yRec = appData[activeType]?.records?.[yKey];
          if (yRec && yRec.startTime && !yRec.endTime) {
            return yKey;
          }
        }
        return getTodayKey();
      }, [appData.isShiftActive, appData.activeShiftDate, appData[activeType]?.records]);

      const todayRecord = appData[activeType]?.records?.[detectedWorkDate] || {};

      const isShiftRunning = Boolean(appData.isShiftActive && todayRecord.startTime && !todayRecord.endTime);
      // 화면 상태: 'welcome' | 'calendar' | 'edit_day' | 'today' | 'hud' | 'settings' | 'time_picker'
      const [currentView, setCurrentView] = useState(() => (isShiftRunning ? 'calendar' : 'welcome'));
      const [selectedDateForEdit, setSelectedDateForEdit] = useState(detectedWorkDate);
      
      // 시간 선택 전용 페이지 파라미터
      const [timePickerConfig, setTimePickerConfig] = useState({
        targetField: '', // 'shiftStart' | 'recordStart' | 'recordEnd' | 'routine'
        initialTime: '18:00',
        title: '시간 설정',
        returnView: 'calendar'
      });

      const [currentYearMonth, setCurrentYearMonth] = useState(() => {
        const [y, m] = detectedWorkDate.split('-');
        return `${y}-${m}`;
      });

      const [welcomeMsg] = useState(() => WELCOME_MESSAGES[Math.floor(Math.random() * WELCOME_MESSAGES.length)]);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [isHudToolbarVisible, setIsHudToolbarVisible] = useState(false);
      const hudToolbarTimer = useRef(null);

      const [hudToastText, setHudToastText] = useState('');
      const hudToastTimer = useRef(null);

      const [hudCycleStep, setHudCycleStep] = useState(1);
      const hudAreaRef = useRef(null);
      const [hudDims, setHudDims] = useState({ w: 360, h: 600 });

      const lastTapTimeRef = useRef(0);
      const longPressTimerRef = useRef(null);
      const isLongPressTriggered = useRef(false);

      const [isSheetUrlLocked, setIsSheetUrlLocked] = useState(true);
      const [closingMsg, setClosingMsg] = useState('');
      const [showClosingModal, setShowClosingModal] = useState(false);
      const [showNavModal, setShowNavModal] = useState(false);
      const [showExitConfirmModal, setShowExitConfirmModal] = useState(false);

      const [gpsSpeed, setGpsSpeed] = useState(0);
      const [isGpsActive, setIsGpsActive] = useState(false);
      const [hudClockStr, setHudClockStr] = useState(getCurrentTimeStr());

      const [napTotalMinutes, setNapTotalMinutes] = useState(20);
      const [napTimerSeconds, setNapTimerSeconds] = useState(20 * 60);
      const [isNapTimerActive, setIsNapTimerActive] = useState(false);

      useEffect(() => {
        const tIntv = setInterval(() => setHudClockStr(getCurrentTimeStr()), 1000);
        return () => clearInterval(tIntv);
      }, []);

      useEffect(() => {
        window.__triggerExitConfirm = () => {
          setShowExitConfirmModal(true);
        };
        return () => {
          window.__triggerExitConfirm = null;
        };
      }, []);

      useEffect(() => {
        try {
          const str = JSON.stringify(appData);
          localStorage.setItem(CURRENT_STORAGE_KEY, str);
          localStorage.setItem(BACKUP_SLOT_KEY, str);
        } catch (e) {
          console.warn('Storage Save Warning', e);
        }
      }, [appData]);

      useEffect(() => {
        const updateDims = () => {
          if (hudAreaRef.current) {
            const rect = hudAreaRef.current.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
              setHudDims({ w: rect.width, h: rect.height });
            }
          }
        };
        updateDims();
        window.addEventListener('resize', updateDims);
        return () => window.removeEventListener('resize', updateDims);
      }, [currentView]);

      useEffect(() => {
        let wakeLockSentinel = null;
        const requestWakeLock = async () => {
          try {
            if ('wakeLock' in navigator) {
              wakeLockSentinel = await navigator.wakeLock.request('screen');
            }
          } catch (err) {
            console.warn('Wake Lock Error:', err);
          }
        };

        if (currentView === 'hud') requestWakeLock();

        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible' && currentView === 'hud') {
            requestWakeLock();
          }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          if (wakeLockSentinel) wakeLockSentinel.release().catch(() => {});
        };
      }, [currentView]);

      useEffect(() => {
        if (!navigator.geolocation) return;

        const watchId = navigator.geolocation.watchPosition(
          (pos) => {
            setIsGpsActive(true);
            const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
            setGpsSpeed(Math.max(0, speedKmh));
          },
          (err) => {
            setIsGpsActive(false);
            console.warn('GPS Error:', err.message);
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
        );

        return () => navigator.geolocation.clearWatch(watchId);
      }, []);

      // 출근하기
      const handleStartShift = () => {
        const nowTime = getCurrentTimeStr();
        const baseShiftDate = getTodayKey();
        const rec = appData[activeType]?.records?.[baseShiftDate] || {};
        const initialStart = rec.startTime || nowTime;

        const updatedRec = {
          ...rec,
          startTime: initialStart,
          endTime: '',
          workMinutes: 0
        };

        setAppData(prev => ({
          ...prev,
          isShiftActive: true,
          activeShiftDate: baseShiftDate,
          [activeType]: {
            ...prev[activeType],
            records: { ...(prev[activeType]?.records || {}), [baseShiftDate]: updatedRec }
          }
        }));

        setSelectedDateForEdit(baseShiftDate);
        setCurrentView('calendar');
        setIsHudToolbarVisible(false);
      };

      // 퇴근하기
      const handleEndShift = () => {
        const nowTime = getCurrentTimeStr();
        const sTime = todayRecord.startTime || nowTime;
        const workMins = calculateMinutes(sTime, nowTime);

        const cardR = Number(todayRecord.cardRev || 0);
        const cashR = Number(todayRecord.cashRev || 0);
        const finalRevenue = (cardR + cashR > 0) ? (cardR + cashR) : Number(todayRecord.revenue || 0);

        const updatedRec = {
          ...todayRecord,
          startTime: sTime,
          endTime: nowTime,
          workMinutes: workMins,
          revenue: finalRevenue
        };

        const newAppData = {
          ...appData,
          isShiftActive: false,
          activeShiftDate: '',
          [activeType]: {
            ...appData[activeType],
            records: { ...(appData[activeType]?.records || {}), [detectedWorkDate]: updatedRec }
          }
        };

        setAppData(newAppData);

        if (appData.googleSheetUrl && appData.googleSheetUrl.startsWith('http')) {
          try {
            fetch(appData.googleSheetUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                date: detectedWorkDate,
                carNumber: appData[activeType]?.carNumber || '충남31바3238',
                activeType: activeType === 'corporate' ? '법인' : '개인',
                startTime: sTime,
                endTime: nowTime,
                workHours: formatMinutesToHours(workMins),
                revenue: finalRevenue,
                cardRev: cardR,
                cashRev: cashR,
                tripCount: updatedRec.tripCount || 0,
                gas: updatedRec.gas || 0,
                toll: updatedRec.toll || 0,
                memo: updatedRec.memo || ''
              })
            }).catch(err => console.warn('Google Sheet Sync Error:', err));
          } catch(e) {
            console.warn('Google Sheet Send Error:', e);
          }
        }

        const randomClosing = CLOSING_MESSAGES[Math.floor(Math.random() * CLOSING_MESSAGES.length)];
        setClosingMsg(randomClosing);
        setShowClosingModal(true);
      };

      const openExternalNav = (navType) => {
        const isAndroid = /Android/i.test(navigator.userAgent);
        const encoded = encodeURIComponent('가스충전소');

        if (navType === 'tmap') {
          window.location.href = isAndroid
            ? `intent://search?name=${encoded}#Intent;scheme=tmap;package=com.skt.tmap.ku;end`
            : `tmap://search?name=${encoded}`;
        } else if (navType === 'kakao') {
          window.location.href = isAndroid
            ? `intent://search?q=${encoded}#Intent;scheme=kakaomap;package=net.daum.android.map;end`
            : `https://map.kakao.com/link/search/${encoded}`;
        } else if (navType === 'naver') {
          window.location.href = isAndroid
            ? `intent://search?query=${encoded}&appname=k-taxi#Intent;scheme=nmap;package=com.nhn.android.nmap;end`
            : `https://m.map.naver.com/search2/search.naver?query=${encoded}`;
        }
        setShowNavModal(false);
      };

      const totalFixedAllowances = useMemo(() => (appData?.corporate?.fixedAllowanceItems || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0), [appData?.corporate?.fixedAllowanceItems]);
      const totalFixedExpenses = useMemo(() => (appData?.corporate?.fixedExpenseItems || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0), [appData?.corporate?.fixedExpenseItems]);

      const currentMonthStats = useMemo(() => {
        const records = appData[activeType]?.records || {};
        const entries = Object.entries(records).filter(([date]) => date && String(date).startsWith(currentYearMonth));
        let workDays = 0, holidayDays = 0, totalWorkMinutes = 0, totalTrips = 0;

        if (activeType === 'corporate') {
          const dailyDeposit = Number(appData.corporate?.dailyDeposit || 201000);
          const deductionRate = Number(appData.corporate?.deductionRate !== undefined ? appData.corporate.deductionRate : 9.0) / 100;
          let totalRevenue = 0, totalGasCompany = 0, totalDriverExpense = 0, totalIncentive = 0;

          entries.forEach(([_, r]) => {
            if (r?.isHoliday) { holidayDays++; }
            else {
              workDays++;
              const cardR = Number(r?.cardRev || 0);
              const cashR = Number(r?.cashRev || 0);
              const rev = (cardR + cashR > 0) ? (cardR + cashR) : Number(r?.revenue || 0);
              totalRevenue += rev;
              totalTrips += Number(r?.tripCount || 0);
              totalGasCompany += Number(r?.gas || 0);

              let itemExp = 0;
              if (Array.isArray(r?.driverExpenseItems)) {
                itemExp = r.driverExpenseItems.reduce((acc, curr) => acc + (Number(curr.amount) || 0), 0);
              } else {
                itemExp = Number(r?.driverExpense || 0);
              }
              itemExp += Number(r?.toll || 0);
              totalDriverExpense += itemExp;

              totalWorkMinutes += Number(r?.workMinutes || 0);
              totalIncentive += Math.round(Math.max(0, rev - dailyDeposit) * 0.7);
            }
          });

          const grossSalary = totalFixedAllowances + totalIncentive;
          const taxAndInsurance = Math.round(grossSalary * deductionRate);
          const totalDeductions = taxAndInsurance + totalFixedExpenses;
          const netSalary = grossSalary - totalDeductions;
          const finalNet = netSalary - totalDriverExpense;

          const avgDailyMinutes = workDays > 0 ? Math.round(totalWorkMinutes / workDays) : 0;
          const avgDailyRevenue = workDays > 0 ? Math.round(totalRevenue / workDays) : 0;
          const totalWorkHours = totalWorkMinutes / 60;
          const avgHourlyWage = totalWorkHours > 0 ? Math.round(finalNet / totalWorkHours) : 0;

          return {
            workDays, holidayDays, totalWorkMinutes, totalRevenue, totalTrips, totalGasCompany, totalIncentive,
            grossSalary, taxAndInsurance, totalFixedExpenses, totalDeductions,
            netSalaryFromCompany: netSalary, totalDriverExpense, finalNetIncome: finalNet,
            avgDailyMinutes, avgDailyRevenue, avgHourlyWage
          };
        } else {
          let cardTotal = 0, cashTotal = 0, gasTotal = 0, tollTotal = 0, maintTotal = 0, otherTotal = 0;
          entries.forEach(([_, r]) => {
            if (r?.isHoliday) { holidayDays++; }
            else {
              workDays++;
              cardTotal += Number(r?.cardRev || 0);
              cashTotal += Number(r?.cashRev || 0);
              totalTrips += Number(r?.tripCount || 0);
              gasTotal += Number(r?.gas || 0);
              tollTotal += Number(r?.toll || 0);
              maintTotal += Number(r?.maint || 0);

              let itemExp = 0;
              if (Array.isArray(r?.driverExpenseItems)) {
                itemExp = r.driverExpenseItems.reduce((acc, curr) => acc + (Number(curr.amount) || 0), 0);
              } else {
                itemExp = Number(r?.other || 0);
              }
              otherTotal += itemExp;
              totalWorkMinutes += Number(r?.workMinutes || 0);
            }
          });
          const totalRevenue = cardTotal + cashTotal;
          const totalExpense = gasTotal + tollTotal + maintTotal + otherTotal;
          const netIncome = totalRevenue - totalExpense;

          const avgDailyMinutes = workDays > 0 ? Math.round(totalWorkMinutes / workDays) : 0;
          const avgDailyRevenue = workDays > 0 ? Math.round(totalRevenue / workDays) : 0;
          const totalWorkHours = totalWorkMinutes / 60;
          const avgHourlyWage = totalWorkHours > 0 ? Math.round(netIncome / totalWorkHours) : 0;

          return {
            workDays, holidayDays, totalWorkMinutes, cardTotal, cashTotal, totalRevenue, totalTrips,
            gasTotal, tollTotal, maintTotal, otherTotal, totalExpense, netIncome,
            avgDailyMinutes, avgDailyRevenue, avgHourlyWage
          };
        }
      }, [appData, activeType, currentYearMonth, totalFixedAllowances, totalFixedExpenses]);

      const isEndOfMonthToday = isLastDayOfMonth(currentYearMonth);

      const calendarCells = useMemo(() => {
        const [y, m] = currentYearMonth.split('-').map(Number);
        const firstDayWeekIndex = new Date(y, m - 1, 1).getDay();
        const totalDaysInMonth = new Date(y, m, 0).getDate();
        const cells = [];
        for (let i = 0; i < firstDayWeekIndex; i++) cells.push(null);
        for (let d = 1; d <= totalDaysInMonth; d++) cells.push(`${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
        return cells;
      }, [currentYearMonth]);

      // HUD 조작 핸들러
      const handleTouchStart = () => {
        isLongPressTriggered.current = false;
        longPressTimerRef.current = setTimeout(() => {
          isLongPressTriggered.current = true;
          setIsHudToolbarVisible(true);
          if (navigator.vibrate) navigator.vibrate(60);
          if (hudToolbarTimer.current) clearTimeout(hudToolbarTimer.current);
          hudToolbarTimer.current = setTimeout(() => {
            setIsHudToolbarVisible(false);
          }, 5000);
        }, 850);
      };

      const handleTouchEnd = () => {
        if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);
      };

      const handleHudClick = () => {
        if (isLongPressTriggered.current) {
          isLongPressTriggered.current = false;
          return;
        }

        const now = Date.now();
        const timeSinceLast = now - lastTapTimeRef.current;

        if (timeSinceLast < 400 && timeSinceLast > 50) {
          const nextStep = (hudCycleStep % 6) + 1;
          setHudCycleStep(nextStep);

          const modeLabels = {
            1: '1. 일반 세로 모드',
            2: '2. 반사 세로 모드 (거울 세로)',
            3: '3. 일반 가로 모드 (좌)',
            4: '4. 반사 가로 모드 (거울 가로 좌)',
            5: '5. 일반 가로 모드 (우)',
            6: '6. 반사 가로 모드 (거울 가로 우)'
          };

          setHudToastText(modeLabels[nextStep]);
          if (hudToastTimer.current) clearTimeout(hudToastTimer.current);
          hudToastTimer.current = setTimeout(() => {
            setHudToastText('');
          }, 2500);

          lastTapTimeRef.current = 0;
        } else {
          lastTapTimeRef.current = now;
        }
      };

      const getSpeedFontSize = (speed) => {
        const str = String(speed);
        if (str.length === 1) return 'min(58vw, 65vh)';
        if (str.length === 2) return 'min(44vw, 50vh)';
        return 'min(32vw, 36vh)';
      };

      const hudNumberTransformStyle = useMemo(() => {
        if (hudCycleStep === 1) return { transform: 'none' };
        if (hudCycleStep === 2) return { transform: 'scaleY(-1)' };
        if (hudCycleStep === 3) {
          return {
            width: `${hudDims.h}px`,
            height: `${hudDims.w}px`,
            position: 'absolute',
            top: '50%',
            left: '50%',
            transform: 'translate(-50%, -50%) rotate(90deg)'
          };
        }
        if (hudCycleStep === 4) {
          return {
            width: `${hudDims.h}px`,
            height: `${hudDims.w}px`,
            position: 'absolute',
            top: '50%',
            left: '50%',
            transform: 'translate(-50%, -50%) rotate(90deg) scaleY(-1)'
          };
        }
        if (hudCycleStep === 5) {
          return {
            width: `${hudDims.h}px`,
            height: `${hudDims.w}px`,
            position: 'absolute',
            top: '50%',
            left: '50%',
            transform: 'translate(-50%, -50%) rotate(-90deg)'
          };
        }
        if (hudCycleStep === 6) {
          return {
            width: `${hudDims.h}px`,
            height: `${hudDims.w}px`,
            position: 'absolute',
            top: '50%',
            left: '50%',
            transform: 'translate(-50%, -50%) rotate(-90deg) scaleY(-1)'
          };
        }
        return { transform: 'none' };
      }, [hudCycleStep, hudDims]);

      const DAYS_NAME = ['일', '월', '화', '수', '목', '금', '토'];

      return (
        <div className="w-full h-full flex flex-col bg-black relative overflow-hidden">
          
          {/* 상단 통합 헤더 (모바일 카카오 스타일) */}
          {currentView !== 'welcome' && currentView !== 'time_picker' && (currentView !== 'hud' || isHudToolbarVisible) && (
            <header className="flex-shrink-0 px-4 py-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between z-40 relative">
              <div className="flex items-center gap-2.5">
                <span className="bg-yellow-500 text-black text-xs font-black px-2.5 py-1 rounded-lg shadow">K-TAXI</span>
                <span className="text-base font-black text-white tracking-tight">
                  {appData[activeType]?.carNumber || '충남31바3238'}
                </span>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setShowNavModal(true)}
                  className="px-3.5 py-2 bg-emerald-700 hover:bg-emerald-600 text-white rounded-xl text-xs font-black shadow active:scale-95 transition"
                >
                  길안내
                </button>

                <button
                  onClick={() => setIsMenuOpen(prev => !prev)}
                  className={`px-3.5 py-2 rounded-xl text-xs font-black border transition active:scale-95 ${
                    isMenuOpen
                      ? 'bg-yellow-500 text-slate-950 border-yellow-400 font-black'
                      : 'bg-slate-800 text-yellow-400 border-slate-700'
                  }`}
                >
                  {isMenuOpen ? '닫기' : '전체메뉴'}
                </button>
              </div>
            </header>
          )}

          {/* 전체 메뉴: 큼직한 타일형 카카오 스타일 */}
          {isMenuOpen && (
            <div className="absolute top-14 left-0 right-0 z-50 bg-slate-900/98 backdrop-blur-xl border-b-2 border-yellow-500 shadow-2xl p-5 space-y-3 animate-fade-in">
              <span className="text-xs font-bold text-slate-400 block mb-1">화면 바로가기</span>
              <div className="grid grid-cols-2 gap-3">
                <button
                  onClick={() => { setCurrentView('calendar'); setIsMenuOpen(false); }}
                  className={`p-4 rounded-2xl text-left border transition ${
                    currentView === 'calendar'
                      ? 'bg-yellow-500 text-slate-950 font-black border-yellow-300 shadow-lg'
                      : 'bg-slate-950 text-slate-200 border-slate-800'
                  }`}
                >
                  <div className="text-lg font-black">📅 운행 달력</div>
                  <div className="text-xs text-slate-400 mt-1">월별 매출 & 시급</div>
                </button>

                <button
                  onClick={() => { setCurrentView('today'); setIsMenuOpen(false); }}
                  className={`p-4 rounded-2xl text-left border transition ${
                    currentView === 'today'
                      ? 'bg-yellow-500 text-slate-950 font-black border-yellow-300 shadow-lg'
                      : 'bg-slate-950 text-slate-200 border-slate-800'
                  }`}
                >
                  <div className="text-lg font-black">💊 건강 & 쪽잠</div>
                  <div className="text-xs text-slate-400 mt-1">약 복용 / 20분 타이머</div>
                </button>

                <button
                  onClick={() => { setCurrentView('hud'); setIsMenuOpen(false); setIsHudToolbarVisible(false); }}
                  className={`p-4 rounded-2xl text-left border transition ${
                    currentView === 'hud'
                      ? 'bg-yellow-500 text-slate-950 font-black border-yellow-300 shadow-lg'
                      : 'bg-slate-950 text-slate-200 border-slate-800'
                  }`}
                >
                  <div className="text-lg font-black">⚡ 초대형 속도계</div>
                  <div className="text-xs text-slate-400 mt-1">야간 HUD 모드</div>
                </button>

                <button
                  onClick={() => { setCurrentView('settings'); setIsMenuOpen(false); }}
                  className={`p-4 rounded-2xl text-left border transition ${
                    currentView === 'settings'
                      ? 'bg-yellow-500 text-slate-950 font-black border-yellow-300 shadow-lg'
                      : 'bg-slate-950 text-slate-200 border-slate-800'
                  }`}
                >
                  <div className="text-lg font-black">⚙️ 기본 설정</div>
                  <div className="text-xs text-slate-400 mt-1">사납금 / 시트 연동</div>
                </button>
              </div>
            </div>
          )}

          {/* 메인 뷰 스위처 */}
          <main className="flex-1 relative w-full overflow-hidden">
            
            {/* 0. 첫 화면: 초대형 출근 전용 화면 */}
            {currentView === 'welcome' && (
              <div className="h-full flex flex-col justify-between p-6 md:p-12 text-center bg-gradient-to-b from-black via-slate-900 to-black select-none">
                <div className="w-full flex items-center justify-between pt-2">
                  <span className="bg-yellow-500 text-black text-xs font-black px-3.5 py-1.5 rounded-full shadow-lg">
                    K-TAXI 스마트 파트너
                  </span>
                  <button
                    onClick={() => setCurrentView('calendar')}
                    className="text-xs font-bold text-slate-300 bg-slate-900 border border-slate-700 px-3.5 py-1.5 rounded-full"
                  >
                    달력 바로보기 ➔
                  </button>
                </div>

                <div className="flex-1 flex flex-col items-center justify-center my-auto">
                  <span className="text-slate-500 text-sm font-bold uppercase tracking-wider mb-2">{detectedWorkDate}</span>
                  <h1 className="text-3xl sm:text-4xl font-black text-white leading-snug break-keep drop-shadow-xl max-w-md">
                    {welcomeMsg}
                  </h1>
                </div>

                <div className="w-full max-w-md mx-auto pb-6">
                  <button
                    onClick={handleStartShift}
                    className="w-full py-7 bg-gradient-to-r from-yellow-500 via-amber-400 to-yellow-500 text-slate-950 font-black text-2xl rounded-3xl shadow-[0_0_40px_rgba(250,204,21,0.5)] border-2 border-yellow-200 active:scale-98 transition-transform"
                  >
                    출근하기 (운행 시작) ▶
                  </button>
                </div>
              </div>
            )}

            {/* 1. 달력 뷰 (메인 홈) */}
            {currentView === 'calendar' && (
              <div className="h-full p-4 overflow-y-auto max-w-xl mx-auto space-y-4 pb-8">
                
                {/* 상단 출근 상태 배너 (초대형 직관 버튼) */}
                <div className="bg-slate-900 border-2 border-slate-800 rounded-3xl p-5 shadow-lg flex items-center justify-between">
                  {!todayRecord.startTime ? (
                    <button
                      onClick={handleStartShift}
                      className="w-full py-4 bg-gradient-to-r from-yellow-500 to-amber-400 text-black font-black text-lg rounded-2xl shadow active:scale-98 transition"
                    >
                      출근하기 (운행 시작) ▶
                    </button>
                  ) : (
                    <div className="w-full flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <span className="w-3.5 h-3.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        <div>
                          <span className="text-xs text-slate-400 font-bold block">오늘 운행 중</span>
                          <span className="text-2xl font-black text-yellow-400 font-mono tracking-wide">
                            {todayRecord.startTime} 출근
                          </span>
                        </div>
                      </div>
                      <button
                        onClick={() => {
                          setTimePickerConfig({
                            targetField: 'shiftStart',
                            initialTime: todayRecord.startTime || '18:00',
                            title: '출근 시간 수정',
                            returnView: 'calendar'
                          });
                          setCurrentView('time_picker');
                        }}
                        className="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-yellow-400 border border-slate-700 font-black text-sm rounded-xl"
                      >
                        시간수정
                      </button>
                    </div>
                  )}
                </div>

                {/* 월 선택 바 */}
                <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800 flex items-center justify-between">
                  <button onClick={() => {
                    const [y, m] = currentYearMonth.split('-').map(Number);
                    const prevDate = new Date(y, m - 2, 1);
                    setCurrentYearMonth(`${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`);
                  }} className="w-11 h-11 flex items-center justify-center bg-slate-800 rounded-2xl text-slate-300 font-black text-lg">◀</button>
                  <div className="text-center">
                    <span className="text-2xl font-black text-yellow-400 font-mono">{currentYearMonth}</span>
                    <div className="text-xs text-slate-400 font-medium mt-0.5">
                      {currentMonthStats.workDays}일 운행 ({currentMonthStats.totalTrips || 0}건) / {formatMinutesToHours(currentMonthStats.totalWorkMinutes)}
                    </div>
                  </div>
                  <button onClick={() => {
                    const [y, m] = currentYearMonth.split('-').map(Number);
                    const nextDate = new Date(y, m, 1);
                    setCurrentYearMonth(`${nextDate.getFullYear()}-${String(nextDate.getMonth() + 1).padStart(2, '0')}`);
                  }} className="w-11 h-11 flex items-center justify-center bg-slate-800 rounded-2xl text-slate-300 font-black text-lg">▶</button>
                </div>

                {/* 핵심 매출 요약 카드 2단 */}
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800">
                    <span className="text-xs font-bold text-slate-400 block">이번 달 총 매출</span>
                    <span className="text-xl font-black text-yellow-400 font-mono block mt-1">
                      {formatMoney(currentMonthStats.totalRevenue)}원
                    </span>
                  </div>
                  <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800">
                    <span className="text-xs font-bold text-emerald-400 block">{activeType === 'corporate' ? '통장 예상 월급' : '과세 소득금액'}</span>
                    <span className="text-xl font-black text-emerald-400 font-mono block mt-1">
                      {activeType === 'corporate' ? formatMoney(currentMonthStats.netSalaryFromCompany) : formatMoney(currentMonthStats.netIncome)}원
                    </span>
                  </div>
                </div>

                {/* 달력 그리드 */}
                <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800">
                  <div className="grid grid-cols-7 text-center text-xs font-bold text-slate-400 pb-3 border-b border-slate-800 mb-2">
                    {DAYS_NAME.map((dName, idx) => (
                      <span key={dName} className={`${idx === 0 ? 'text-red-400' : idx === 6 ? 'text-blue-400' : 'text-slate-300'}`}>
                        {dName}
                      </span>
                    ))}
                  </div>
                  <div className="grid grid-cols-7 gap-1.5">
                    {calendarCells.map((dateStr, idx) => {
                      if (!dateStr) return <div key={`empty-${idx}`} className="h-14 rounded-2xl bg-transparent"></div>;
                      const dayNum = Number(dateStr.split('-')[2]);
                      const dayOfWeek = (idx % 7);
                      const rec = appData[activeType]?.records?.[dateStr];
                      const isToday = detectedWorkDate === dateStr;

                      const cardR = Number(rec?.cardRev || 0);
                      const cashR = Number(rec?.cashRev || 0);
                      const dayRev = (cardR + cashR > 0) ? (cardR + cashR) : Number(rec?.revenue || 0);

                      return (
                        <button
                          key={dateStr}
                          onClick={() => {
                            setSelectedDateForEdit(dateStr);
                            setCurrentView('edit_day'); // 팝업 대신 전체 화면으로 이동
                          }}
                          className={`h-14 p-1 rounded-2xl flex flex-col justify-between items-center text-center border transition active:scale-95 ${
                            isToday ? 'border-yellow-400 bg-yellow-500/20' : rec?.isHoliday ? 'border-emerald-800 bg-emerald-950/30' : rec ? 'border-slate-700 bg-slate-950' : 'border-slate-800 bg-slate-950/40'
                          }`}
                        >
                          <span className={`text-xs font-bold ${dayOfWeek === 0 ? 'text-red-400' : dayOfWeek === 6 ? 'text-blue-400' : 'text-slate-300'}`}>
                            {dayNum}
                          </span>
                          {rec && (
                            rec.isHoliday ? (
                              <span className="text-[9px] bg-emerald-900 text-emerald-300 font-bold px-1 rounded-md">휴무</span>
                            ) : (
                              <span className="text-[10px] text-yellow-400 font-black font-mono truncate w-full">
                                {formatShortMoney(dayRev)}
                              </span>
                            )
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="pt-2">
                  <SlideToUnlock onUnlock={handleEndShift} text="밀어서 오늘 운행 퇴근하기" />
                </div>
              </div>
            )}

            {/* 2. 당일 운행 기록 작성 전용 전체 화면 (카카오 스타일 Full Page) */}
            {currentView === 'edit_day' && (
              <FullDayEditView
                activeType={activeType}
                dateKey={selectedDateForEdit}
                existingData={appData[activeType]?.records?.[selectedDateForEdit] || {}}
                onBack={() => setCurrentView('calendar')}
                onOpenTimePicker={(target, initialTime, title) => {
                  setTimePickerConfig({
                    targetField: target,
                    initialTime: initialTime || '18:00',
                    title: title,
                    returnView: 'edit_day'
                  });
                  setCurrentView('time_picker');
                }}
                onSave={(data) => {
                  setAppData(prev => ({
                    ...prev,
                    [activeType]: {
                      ...prev[activeType],
                      records: { ...(prev[activeType]?.records || {}), [selectedDateForEdit]: data }
                    }
                  }));
                  setCurrentView('calendar');
                }}
              />
            )}

            {/* 3. 풀스크린 간편 시간 설정기 (카카오 스타일 시계 팝업 대체) */}
            {currentView === 'time_picker' && (
              <FullTimePickerView
                title={timePickerConfig.title}
                initialTime={timePickerConfig.initialTime}
                onConfirm={(selectedTime) => {
                  if (timePickerConfig.targetField === 'shiftStart') {
                    const updatedRec = {
                      ...todayRecord,
                      startTime: selectedTime,
                      workMinutes: todayRecord.endTime ? calculateMinutes(selectedTime, todayRecord.endTime) : 0
                    };
                    setAppData(prev => ({
                      ...prev,
                      [activeType]: {
                        ...prev[activeType],
                        records: { ...(prev[activeType]?.records || {}), [detectedWorkDate]: updatedRec }
                      }
                    }));
                  }
                  setCurrentView(timePickerConfig.returnView);
                }}
                onCancel={() => setCurrentView(timePickerConfig.returnView)}
              />
            )}

            {/* 4. 휴식 & 건강 알림 뷰 */}
            {currentView === 'today' && (
              <div className="h-full p-4 overflow-y-auto max-w-xl mx-auto space-y-4 pb-8">
                <div
                  onClick={() => {
                    if (isNapTimerActive) {
                      setIsNapTimerActive(false);
                    } else {
                      setNapTimerSeconds(napTotalMinutes * 60);
                      setIsNapTimerActive(true);
                    }
                  }}
                  className="bg-gradient-to-r from-indigo-950 via-slate-900 to-indigo-950 p-5 rounded-3xl border-2 border-indigo-500/60 shadow-xl flex items-center justify-between cursor-pointer active:scale-98 transition"
                >
                  <div>
                    <h4 className="text-lg font-black text-indigo-200">20분 파워 쪽잠 타이머</h4>
                    <p className="text-xs text-slate-400 mt-1">
                      {isNapTimerActive
                        ? `쪽잠 진행 중 (${Math.floor(napTimerSeconds / 60)}분 남음) 터치 시 정지`
                        : '터치 시 20분 카운트다운 시작 (종료 알람)'}
                    </p>
                  </div>
                  <span className="px-5 py-3 bg-indigo-600 text-white font-black text-sm rounded-2xl shadow">
                    {isNapTimerActive ? '정지' : '시작'}
                  </span>
                </div>

                <div className="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-4">
                  <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                    <span className="text-base font-black text-emerald-400">건강 알림 리스트</span>
                  </div>

                  <div className="space-y-3">
                    {(appData.healthRoutines || []).map((routine) => (
                      <div key={routine.id} className="p-4 bg-slate-950 border border-slate-800 rounded-2xl flex items-center justify-between">
                        <div>
                          <div className="flex items-center gap-2">
                            {routine.alarmEnabled && (
                              <span className="text-xs text-yellow-400 font-mono font-black bg-yellow-500/10 border border-yellow-500/30 px-2 py-0.5 rounded-md">
                                {routine.time}
                              </span>
                            )}
                            <span className="font-bold text-white text-base">{routine.title}</span>
                          </div>
                        </div>
                        <button
                          onClick={() => {
                            setAppData(prev => ({
                              ...prev,
                              healthRoutines: (prev.healthRoutines || []).map(r => r.id === routine.id ? { ...r, alarmEnabled: !r.alarmEnabled } : r)
                            }));
                          }}
                          className={`px-3.5 py-2 rounded-xl text-xs font-black border ${
                            routine.alarmEnabled ? 'bg-amber-500 text-black border-yellow-300' : 'bg-slate-900 text-slate-500 border-slate-800'
                          }`}
                        >
                          {routine.alarmEnabled ? '🔔 ON' : '🔕 OFF'}
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* 5. 초대형 HUD 속도계 */}
            {currentView === 'hud' && (
              <div
                ref={hudAreaRef}
                onClick={handleHudClick}
                onTouchStart={handleTouchStart}
                onTouchEnd={handleTouchEnd}
                onMouseDown={handleTouchStart}
                onMouseUp={handleTouchEnd}
                className="w-full h-full flex flex-col items-center justify-center select-none relative overflow-hidden bg-black cursor-pointer"
              >
                <div className="absolute top-4 right-4 flex items-center gap-2 pointer-events-none z-30">
                  <span className="text-sm font-mono font-bold text-slate-400 bg-slate-950/80 px-3 py-1 rounded-xl border border-slate-800">
                    {hudClockStr}
                  </span>
                  <div className="flex items-center gap-1.5 bg-slate-950/80 px-3 py-1 rounded-xl border border-slate-800">
                    <span className={`w-2.5 h-2.5 rounded-full ${isGpsActive ? 'bg-emerald-400 animate-pulse' : 'bg-amber-500'}`}></span>
                    <span className="text-xs font-bold text-slate-300">{isGpsActive ? 'GPS' : '수신대기'}</span>
                  </div>
                </div>

                <div style={hudNumberTransformStyle} className="flex flex-col items-center justify-center p-2">
                  <span
                    className={`font-black tracking-tighter font-mono leading-none select-none ${
                      gpsSpeed > 0 ? 'font-speed-neon' : 'font-speed-zero'
                    }`}
                    style={{ fontSize: getSpeedFontSize(gpsSpeed) }}
                  >
                    {gpsSpeed}
                  </span>
                  <span
                    className="font-black text-slate-400/80 tracking-widest mt-[-2vh]"
                    style={{ fontSize: 'min(6vw, 6vh)' }}
                  >
                    KM/H
                  </span>
                </div>

                <div className="absolute bottom-6 left-0 right-0 text-center pointer-events-none z-50">
                  {hudToastText ? (
                    <span className="text-base font-black text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.8)] tracking-wide">
                      {hudToastText}
                    </span>
                  ) : (
                    <span className="text-xs font-medium text-slate-500">
                      화면 두 번 톡톡: 6대 모드 순환 / 1초 꾹 누르기: 상단바 열기
                    </span>
                  )}
                </div>
              </div>
            )}

            {/* 6. 기본 설정 뷰 */}
            {currentView === 'settings' && (
              <div className="h-full p-4 overflow-y-auto max-w-xl mx-auto space-y-4 pb-8">
                <div className="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-3">
                  <span className="text-base font-black text-white block">운행 모드 및 차량번호</span>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => setAppData(prev => ({ ...prev, activeType: 'corporate' }))}
                      className={`py-3 rounded-2xl font-black text-sm border ${
                        activeType === 'corporate' ? 'bg-yellow-500 text-black border-yellow-300 shadow' : 'bg-slate-950 text-slate-400 border-slate-800'
                      }`}
                    >
                      법인 택시
                    </button>
                    <button
                      onClick={() => setAppData(prev => ({ ...prev, activeType: 'private' }))}
                      className={`py-3 rounded-2xl font-black text-sm border ${
                        activeType === 'private' ? 'bg-yellow-500 text-black border-yellow-300 shadow' : 'bg-slate-950 text-slate-400 border-slate-800'
                      }`}
                    >
                      개인 택시
                    </button>
                  </div>
                  <div className="flex items-center justify-between pt-2 border-t border-slate-800">
                    <span className="text-sm font-bold text-slate-300">차량 번호</span>
                    <input
                      type="text"
                      value={appData[activeType]?.carNumber || '충남31바3238'}
                      onChange={(e) => {
                        const val = e.target.value;
                        setAppData(prev => ({ ...prev, [activeType]: { ...(prev[activeType] || {}), carNumber: val } }));
                      }}
                      className="bg-slate-950 border border-slate-700 px-3 py-2 rounded-xl text-right font-bold text-white text-sm"
                    />
                  </div>
                </div>

                <div className="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-3">
                  <div className="flex justify-between items-center">
                    <span className="text-sm font-black text-emerald-400">구글 시트 연동 주소</span>
                    <button
                      onClick={() => setIsSheetUrlLocked(prev => !prev)}
                      className="text-xs text-yellow-400 font-bold"
                    >
                      {isSheetUrlLocked ? '🔒 수정' : '🔓 완료'}
                    </button>
                  </div>
                  <input
                    type="url"
                    disabled={isSheetUrlLocked}
                    value={appData.googleSheetUrl || ''}
                    onChange={(e) => setAppData(prev => ({ ...prev, googleSheetUrl: e.target.value.trim() }))}
                    placeholder="구글 앱스 스크립트 웹앱 URL"
                    className="w-full bg-slate-950 border border-slate-800 p-3 rounded-2xl text-xs font-mono text-white"
                  />
                </div>
              </div>
            )}
          </main>

          {/* 내비 모달 */}
          {showNavModal && (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border-2 border-emerald-500/50 rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl text-center">
                <h3 className="text-lg font-black text-white">실행할 내비게이션</h3>
                <div className="space-y-2.5">
                  <button onClick={() => openExternalNav('tmap')} className="w-full p-4 bg-red-950 border border-red-500/60 text-red-200 font-black rounded-2xl flex items-center justify-between text-base">
                    <span>티맵 (TMAP)</span><span>실행 ▶</span>
                  </button>
                  <button onClick={() => openExternalNav('kakao')} className="w-full p-4 bg-yellow-950 border border-yellow-500/60 text-yellow-200 font-black rounded-2xl flex items-center justify-between text-base">
                    <span>카카오내비</span><span>실행 ▶</span>
                  </button>
                  <button onClick={() => openExternalNav('naver')} className="w-full p-4 bg-emerald-950 border border-emerald-500/60 text-emerald-200 font-black rounded-2xl flex items-center justify-between text-base">
                    <span>네이버지도</span><span>실행 ▶</span>
                  </button>
                </div>
                <button onClick={() => setShowNavModal(false)} className="w-full py-3 bg-slate-800 text-slate-300 font-bold rounded-2xl text-xs">닫기</button>
              </div>
            </div>
          )}

          {/* 퇴근 완료 축하 모달 */}
          {showClosingModal && (
            <div className="fixed inset-0 bg-black flex flex-col justify-between p-6 z-50 text-center animate-fade-in">
              <div className="pt-20 space-y-6">
                <span className="inline-block bg-yellow-500 text-black text-xs font-black px-4 py-1.5 rounded-full">
                  오늘 운행 마감 완료
                </span>
                <h3 className="text-3xl font-black text-white leading-relaxed">{closingMsg}</h3>
              </div>
              <div className="pb-8">
                <button
                  onClick={() => {
                    setShowClosingModal(false);
                    setCurrentView('welcome');
                  }}
                  className="w-full py-6 bg-gradient-to-r from-yellow-500 to-amber-400 text-slate-950 font-black text-2xl rounded-3xl shadow-2xl"
                >
                  확인 (첫 화면으로)
                </button>
              </div>
            </div>
          )}

          {/* 뒤로가기 종료 확인 */}
          {showExitConfirmModal && (
            <div className="fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[99] animate-fade-in">
              <div className="bg-slate-900 border-2 border-amber-500 rounded-3xl w-full max-w-xs p-6 space-y-4 shadow-2xl text-center">
                <div className="w-12 h-12 rounded-full bg-amber-500/20 text-yellow-400 mx-auto flex items-center justify-center text-2xl font-black">
                  ⚠️
                </div>
                <div>
                  <h3 className="text-base font-black text-white">앱을 종료하시겠습니까?</h3>
                  <p className="text-xs text-slate-400 mt-1.5">뒤로가기 버튼이 눌렸습니다.</p>
                </div>
                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => {
                      setShowExitConfirmModal(false);
                      window.history.go(-2);
                    }}
                    className="flex-1 py-3 bg-red-600 text-white font-black text-xs rounded-xl shadow"
                  >
                    종료하기
                  </button>
                  <button
                    onClick={() => setShowExitConfirmModal(false)}
                    className="flex-1 py-3 bg-yellow-500 text-black font-black text-xs rounded-xl shadow"
                  >
                    계속 사용
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // [전체 화면 1] 카카오 스타일 당일 운행 기록 작성 전용 전체 화면 (Full Page)
    function FullDayEditView({ activeType, dateKey, existingData, onBack, onOpenTimePicker, onSave }) {
      const [isHoliday, setIsHoliday] = useState(existingData?.isHoliday || false);
      const [memo, setMemo] = useState(existingData?.memo || '');
      const [startTime, setStartTime] = useState(existingData?.startTime || '18:00');
      const [endTime, setEndTime] = useState(existingData?.endTime || '06:00');
      
      const [cardRev, setCardRev] = useState(() => {
        if (existingData?.cardRev !== undefined) return existingData.cardRev;
        return activeType === 'corporate' ? (existingData?.revenue || 0) : 0;
      });
      const [cashRev, setCashRev] = useState(existingData?.cashRev || 0);
      const [tripCount, setTripCount] = useState(existingData?.tripCount || 0);
      const [toll, setToll] = useState(existingData?.toll || 0);
      const [gas, setGas] = useState(existingData?.gas || 0);

      const calculatedMins = calculateMinutes(startTime, endTime);
      const currentTotalRev = Number(cardRev || 0) + Number(cashRev || 0);

      const handleConfirmSave = () => {
        onSave({
          ...existingData,
          isHoliday,
          memo,
          startTime,
          endTime,
          workMinutes: calculatedMins,
          cardRev: Number(cardRev) || 0,
          cashRev: Number(cashRev) || 0,
          revenue: currentTotalRev,
          tripCount: Number(tripCount) || 0,
          toll: Number(toll) || 0,
          gas: Number(gas) || 0
        });
      };

      return (
        <div className="h-full flex flex-col bg-black text-white">
          {/* 풀스크린 상단 뒤로가기 헤더 */}
          <div className="flex-shrink-0 px-4 py-3.5 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
            <button
              onClick={onBack}
              className="flex items-center gap-2 text-yellow-400 font-black text-base active:opacity-75"
            >
              <span className="text-xl">◀</span>
              <span>달력으로</span>
            </button>
            <span className="text-lg font-black font-mono text-white">{dateKey} 기록</span>
            <button
              onClick={handleConfirmSave}
              className="px-4 py-1.5 bg-yellow-500 text-black font-black text-sm rounded-xl shadow active:scale-95"
            >
              저장
            </button>
          </div>

          {/* 본문 스크롤 영역 */}
          <div className="flex-1 overflow-y-auto p-4 max-w-xl mx-auto w-full space-y-4 pb-24">
            
            {/* 휴무일 지정 대형 토글 버튼 */}
            <button
              type="button"
              onClick={() => setIsHoliday(prev => !prev)}
              className={`w-full py-4 rounded-3xl font-black text-base border transition flex items-center justify-center gap-3 ${
                isHoliday
                  ? 'bg-emerald-900/60 border-emerald-500 text-emerald-300 shadow-lg'
                  : 'bg-slate-900 border-slate-800 text-slate-400'
              }`}
            >
              <span className="text-xl">{isHoliday ? '✓' : '○'}</span>
              <span>{isHoliday ? '오늘 근무: 휴무일로 지정됨' : '정상 근무일 (터치 시 휴무 지정)'}</span>
            </button>

            {!isHoliday && (
              <>
                {/* 1. 출퇴근 시간 큼직한 카드 */}
                <div className="bg-slate-900 border-2 border-slate-800 rounded-3xl p-5 space-y-3">
                  <div className="flex justify-between items-center">
                    <span className="text-sm font-bold text-slate-400">근무 시간</span>
                    <span className="text-sm font-black text-blue-400">{formatMinutesToHours(calculatedMins)}</span>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div
                      onClick={() => onOpenTimePicker('recordStart', startTime, '출근 시간 선택')}
                      className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center cursor-pointer active:border-yellow-500"
                    >
                      <span className="text-xs text-slate-500 block mb-1">출근 시각</span>
                      <span className="text-2xl font-black font-mono text-yellow-400">{startTime}</span>
                    </div>
                    <div
                      onClick={() => onOpenTimePicker('recordEnd', endTime, '퇴근 시간 선택')}
                      className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center cursor-pointer active:border-yellow-500"
                    >
                      <span className="text-xs text-slate-500 block mb-1">퇴근 시각</span>
                      <span className="text-2xl font-black font-mono text-yellow-400">{endTime}</span>
                    </div>
                  </div>
                </div>

                {/* 2. 카드/현금 초대형 매출 입력 카드 */}
                <KakaoLargeMoneyInput label="💳 카드 매출" value={cardRev} onChange={setCardRev} colorClass="text-yellow-400" />
                <KakaoLargeMoneyInput label="💵 현금 매출" value={cashRev} onChange={setCashRev} colorClass="text-amber-300" />

                {/* 총매출 요약 배너 */}
                <div className="bg-slate-950 border border-yellow-500/40 rounded-3xl p-5 flex items-center justify-between">
                  <span className="text-base font-black text-white">당일 총 매출합계</span>
                  <span className="text-2xl font-black font-mono text-yellow-400">{formatMoney(currentTotalRev)}원</span>
                </div>

                {/* 3. 운행 건수 원터치 가산기 */}
                <div className="bg-slate-900 border-2 border-slate-800 rounded-3xl p-5 space-y-3">
                  <div className="flex justify-between items-center">
                    <span className="text-sm font-bold text-slate-400">🚕 당일 운행 건수</span>
                    <span className="text-3xl font-black font-mono text-emerald-400">{tripCount} 회</span>
                  </div>
                  <div className="grid grid-cols-4 gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setTripCount(prev => Math.max(0, prev - 1))}
                      className="py-3 bg-slate-950 border border-slate-800 text-slate-300 font-black text-lg rounded-2xl active:scale-95"
                    >
                      -1
                    </button>
                    <button
                      type="button"
                      onClick={() => setTripCount(prev => prev + 1)}
                      className="py-3 bg-slate-800 text-yellow-400 font-black text-lg rounded-2xl active:scale-95"
                    >
                      +1
                    </button>
                    <button
                      type="button"
                      onClick={() => setTripCount(prev => prev + 5)}
                      className="py-3 bg-slate-800 text-yellow-400 font-black text-lg rounded-2xl active:scale-95"
                    >
                      +5
                    </button>
                    <button
                      type="button"
                      onClick={() => setTripCount(0)}
                      className="py-3 bg-slate-950 border border-slate-800 text-slate-400 font-bold text-sm rounded-2xl active:scale-95"
                    >
                      리셋
                    </button>
                  </div>
                </div>

                {/* 4. 통행료 및 가스비 입력 */}
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800 space-y-1">
                    <span className="text-xs font-bold text-rose-400">🛣️ 통행료 (기사 지출)</span>
                    <input
                      type="text"
                      inputMode="numeric"
                      value={toll > 0 ? Number(toll).toLocaleString('ko-KR') : ''}
                      placeholder="0"
                      onChange={(e) => {
                        const raw = e.target.value.replace(/[^0-9]/g, '');
                        setToll(raw ? Number(raw) : 0);
                      }}
                      className="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-2xl text-right font-black font-mono text-lg text-rose-300 focus:outline-none"
                    />
                  </div>
                  <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800 space-y-1">
                    <span className="text-xs font-bold text-blue-400">⛽ 가스비</span>
                    <input
                      type="text"
                      inputMode="numeric"
                      value={gas > 0 ? Number(gas).toLocaleString('ko-KR') : ''}
                      placeholder="0"
                      onChange={(e) => {
                        const raw = e.target.value.replace(/[^0-9]/g, '');
                        setGas(raw ? Number(raw) : 0);
                      }}
                      className="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-2xl text-right font-black font-mono text-lg text-blue-300 focus:outline-none"
                    />
                  </div>
                </div>

                {/* 5. 메모 */}
                <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800 space-y-1">
                  <span className="text-xs font-bold text-slate-400">운행 특이사항 메모</span>
                  <input
                    type="text"
                    value={memo}
                    placeholder="예: 야간 세차 완료 / 타이어 공기압 체크"
                    onChange={(e) => setMemo(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 p-3 rounded-2xl text-sm text-white focus:outline-none"
                  />
                </div>
              </>
            )}
          </div>

          {/* 하단 고정 저장 버튼 (카카오 스타일 풀 와이드) */}
          <div className="fixed bottom-0 left-0 right-0 p-4 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 max-w-xl mx-auto">
            <button
              onClick={handleConfirmSave}
              className="w-full py-5 bg-gradient-to-r from-yellow-500 to-amber-400 text-slate-950 font-black text-xl rounded-3xl shadow-xl active:scale-98 transition"
            >
              작성 완료 및 저장
            </button>
          </div>
        </div>
      );
    }

    // [전체 화면 2] 카카오 스타일 초대형 풀스크린 시간 설정 뷰
    function FullTimePickerView({ title, initialTime, onConfirm, onCancel }) {
      const parseTime = (tStr) => {
        if (!tStr || !tStr.includes(':')) return { ampm: '오후', hour: 6, min: 0 };
        const [hNum, mNum] = tStr.split(':').map(Number);
        const ampm = hNum < 12 ? '오전' : '오후';
        let h12 = hNum % 12;
        if (h12 === 0) h12 = 12;
        return { ampm, hour: h12, min: mNum };
      };

      const [ampm, setAmpm] = useState(() => parseTime(initialTime).ampm);
      const [hour, setHour] = useState(() => parseTime(initialTime).hour);
      const [min, setMin] = useState(() => parseTime(initialTime).min);

      const handleSave = () => {
        let h24 = hour;
        if (ampm === '오전') {
          if (hour === 12) h24 = 0;
        } else {
          if (hour !== 12) h24 += 12;
        }
        const timeStr = `${String(h24).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
        onConfirm(timeStr);
      };

      return (
        <div className="h-full flex flex-col justify-between bg-black p-5 text-white max-w-xl mx-auto select-none">
          <div className="flex items-center justify-between pt-2">
            <button onClick={onCancel} className="text-slate-400 font-black text-base px-3 py-1">
              취소
            </button>
            <h2 className="text-lg font-black text-white">{title}</h2>
            <div className="w-10"></div>
          </div>

          {/* 중앙 시계 디스플레이 */}
          <div className="flex flex-col items-center justify-center my-auto space-y-8">
            <div className="flex items-center gap-3">
              <button
                onClick={() => setAmpm('오전')}
                className={`px-5 py-3 rounded-2xl font-black text-base border transition ${
                  ampm === '오전' ? 'bg-yellow-500 text-black border-yellow-300 shadow-lg' : 'bg-slate-900 text-slate-500 border-slate-800'
                }`}
              >
                오전
              </button>
              <button
                onClick={() => setAmpm('오후')}
                className={`px-5 py-3 rounded-2xl font-black text-base border transition ${
                  ampm === '오후' ? 'bg-yellow-500 text-black border-yellow-300 shadow-lg' : 'bg-slate-900 text-slate-500 border-slate-800'
                }`}
              >
                오후
              </button>
            </div>

            <div className="flex items-center justify-center gap-4 bg-slate-900 p-6 rounded-3xl border-2 border-yellow-500/60 shadow-2xl w-full">
              <div className="flex flex-col items-center">
                <span className="text-xs text-slate-500 font-bold mb-2">시간</span>
                <span className="text-6xl font-black font-mono text-yellow-400">{String(hour).padStart(2, '0')}</span>
              </div>
              <span className="text-5xl font-black text-slate-600 mt-5">:</span>
              <div className="flex flex-col items-center">
                <span className="text-xs text-slate-500 font-bold mb-2">분</span>
                <span className="text-6xl font-black font-mono text-yellow-400">{String(min).padStart(2, '0')}</span>
              </div>
            </div>

            {/* 원터치 시간/분 조절 버튼 */}
            <div className="grid grid-cols-4 gap-2 w-full">
              <button onClick={() => setHour(prev => prev >= 12 ? 1 : prev + 1)} className="py-4 bg-slate-900 border border-slate-800 rounded-2xl font-black text-base">
                +1시간
              </button>
              <button onClick={() => setMin(prev => (prev + 10) % 60)} className="py-4 bg-slate-900 border border-slate-800 rounded-2xl font-black text-base">
                +10분
              </button>
              <button onClick={() => setMin(0)} className="py-4 bg-slate-900 border border-slate-800 rounded-2xl font-black text-base text-slate-400">
                00분
              </button>
              <button onClick={() => setMin(30)} className="py-4 bg-slate-900 border border-slate-800 rounded-2xl font-black text-base text-slate-400">
                30분
              </button>
            </div>
          </div>

          <div className="pb-4">
            <button
              onClick={handleSave}
              className="w-full py-6 bg-gradient-to-r from-yellow-500 to-amber-400 text-black font-black text-xl rounded-3xl shadow-xl active:scale-98"
            >
              시간 선택 완료
            </button>
          </div>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("K-TAXI Error Caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="h-full bg-black text-slate-100 flex flex-col items-center justify-center p-6 text-center">
              <div className="bg-slate-900 border border-red-500/40 p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl">
                <div>
                  <h2 className="text-base font-bold text-red-400">데이터 안전 보호 모드</h2>
                  <p className="text-xs text-slate-400 mt-1.5 leading-relaxed">화면을 새로고침하여 시스템을 복구합니다.</p>
                </div>
                <button onClick={() => window.location.reload()} className="w-full py-3 bg-yellow-500 text-black font-bold text-xs rounded-xl shadow">화면 새로고침</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
