<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>K-TAXI 스마트 가디언 HUD & 운행관리</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM (Cloudflare CDN) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone (Cloudflare CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .hud-flip-y {
      transform: scaleY(-1);
    }
    .hud-rot90-flip {
      transform: rotate(-90deg) scaleY(-1);
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 1.25rem);
    }
    
    /* 5:5 교대 펌핑 (Grow & Shrink) 애니메이션 */
    @keyframes pulse-grow {
      0%, 100% { transform: scale(1.18); filter: drop-shadow(0 0 25px rgba(239, 68, 68, 0.9)); }
      50% { transform: scale(0.85); filter: drop-shadow(0 0 8px rgba(234, 179, 8, 0.5)); }
    }
    @keyframes pulse-shrink {
      0%, 100% { transform: scale(0.85); filter: drop-shadow(0 0 8px rgba(234, 179, 8, 0.5)); }
      50% { transform: scale(1.18); filter: drop-shadow(0 0 25px rgba(34, 197, 94, 0.9)); }
    }
    .animate-grow-pulse {
      animation: pulse-grow 0.9s infinite ease-in-out;
    }
    .animate-shrink-pulse {
      animation: pulse-shrink 0.9s infinite ease-in-out;
    }

    /* 화려한 네온 스트로브 경고 점멸 */
    @keyframes strobe-warning {
      0% { background-color: rgba(239, 68, 68, 0.35); border-color: #ef4444; }
      25% { background-color: rgba(234, 179, 8, 0.35); border-color: #eab308; }
      50% { background-color: rgba(6, 182, 212, 0.35); border-color: #06b6d4; }
      75% { background-color: rgba(168, 85, 247, 0.35); border-color: #a855f7; }
      100% { background-color: rgba(239, 68, 68, 0.35); border-color: #ef4444; }
    }
    .animate-strobe-alert {
      animation: strobe-warning 0.5s infinite linear;
    }
  </style>
</head>
<body class="select-none antialiased min-h-screen bg-slate-950">
  <div id="root">
    <div class="min-h-screen flex items-center justify-center text-yellow-400 font-bold text-sm bg-slate-950">
      K-TAXI 가디언 시스템 로딩 중...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, Component } = React;

    const APP_VERSION = 'v1.7.0';
    const CURRENT_STORAGE_KEY = 'K_TAXI_RECORD_DATA_V14';

    // --- 천안·아산 주요 단속 포인트 DB (기본 내장) ---
    const CAMERA_DB = [
      { id: 'cam1', name: '불당대로 (시청 앞)', lat: 36.8152, lon: 127.1135, limit: 50, type: 'dog' }, // 과속/신호
      { id: 'cam2', name: '번영로 (종합운동장)', lat: 36.8285, lon: 127.1210, limit: 60, type: 'dog' },
      { id: 'cam3', name: '충무로 (쌍용고사거리)', lat: 36.7950, lon: 127.1260, limit: 50, type: 'dog' },
      { id: 'cam4', name: '서부대로 (봉명역 인근)', lat: 36.8010, lon: 127.1350, limit: 50, type: 'dog' },
      { id: 'cam5', name: '온천대로 (아산시청 앞)', lat: 36.7895, lon: 127.0035, limit: 50, type: 'dog' },
      { id: 'cam6', name: '배방로 (배방역 광장)', lat: 36.7770, lon: 127.0520, limit: 50, type: 'dog' },
      { id: 'cam7', name: '천안역 서부광장 주정차구역', lat: 36.8105, lon: 127.1460, limit: 30, type: 'cat' }, // 주정차
      { id: 'cam8', name: '남부대로 구간단속 (유량~목천)', lat: 36.7820, lon: 127.1650, limit: 70, type: 'tiger' } // 구간단속
    ];

    // 하버사인 공식 (거리 m 계산)
    const calculateDistanceMeters = (lat1, lon1, lat2, lon2) => {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    };

    // --- Web Audio 사운드 신시사이저 (개·고양이·호랑이 소리 합성) ---
    const playAnimalSound = (type = 'dog') => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'dog') {
          // [개 짖는 소리] 날카롭고 강렬한 더블 하향 얍! 얍!
          [0, 0.18].forEach((delay) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(650, ctx.currentTime + delay);
            osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + delay + 0.12);
            gain.gain.setValueAtTime(0.5, ctx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay + 0.12);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + delay);
            osc.stop(ctx.currentTime + delay + 0.12);
          });
        } else if (type === 'cat') {
          // [고양이 울음] 부드럽게 올라갔다 내려오는 야옹~
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(380, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(820, ctx.currentTime + 0.25);
          osc.frequency.exponentialRampToValueAtTime(450, ctx.currentTime + 0.55);
          gain.gain.setValueAtTime(0.35, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.55);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.55);
        } else if (type === 'tiger') {
          // [호랑이 포효] 저음 진동과 거친 럼블 사운드 어흥~
          const osc = ctx.createOscillator();
          const mod = ctx.createOscillator();
          const modGain = ctx.createGain();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(95, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.8);
          mod.type = 'square';
          mod.frequency.setValueAtTime(25, ctx.currentTime);
          modGain.gain.setValueAtTime(40, ctx.currentTime);
          mod.connect(osc.frequency);
          gain.gain.setValueAtTime(0.5, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
          osc.connect(gain);
          gain.connect(ctx.destination);
          mod.start(ctx.currentTime);
          osc.start(ctx.currentTime);
          mod.stop(ctx.currentTime + 0.8);
          osc.stop(ctx.currentTime + 0.8);
        } else {
          // 기본 알람 차임
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 1.2);
        }
      } catch (e) {
        console.warn('Animal Audio Error', e);
      }
    };

    // 포맷 유틸
    const formatMoney = (val) => Number(String(val).replace(/[^0-9]/g, '') || 0).toLocaleString('ko-KR');
    const formatShortMoney = (val) => {
      const num = Number(val) || 0;
      if (num === 0) return '0';
      if (num >= 10000) return (num / 10000).toFixed(num % 10000 === 0 ? 0 : 1) + '만';
      return (num / 1000).toFixed(0) + '천';
    };
    const getTodayKey = () => {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    };
    const getCurrentTimeStr = () => {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    };
    const addMinutesToTime = (timeStr, minsToAdd) => {
      if (!timeStr) return '--:--';
      const [h, m] = timeStr.split(':').map(Number);
      const totalMins = (h * 60 + m + minsToAdd) % (24 * 60);
      return `${String(Math.floor(totalMins / 60)).padStart(2, '0')}:${String(totalMins % 60).padStart(2, '0')}`;
    };
    const calculateMinutes = (start, end) => {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let sMin = sh * 60 + sm;
      let eMin = eh * 60 + em;
      if (eMin < sMin) eMin += 24 * 60;
      return Math.max(0, eMin - sMin);
    };
    const formatMinutesToHours = (totalMins) => {
      if (!totalMins || totalMins <= 0) return '0시간';
      const hours = Math.floor(totalMins / 60);
      const mins = totalMins % 60;
      return mins === 0 ? `${hours}시간` : `${hours}시간 ${mins}분`;
    };

    // 기본 스키마
    const DEFAULT_STORAGE = {
      hasSelectedType: false,
      activeType: 'corporate',
      hudSpeedLimit: 50,
      defaultOffDay: 1,
      healthRoutines: [
        { id: 1, text: '기름진 야식 대신 속 편한 간편식(감자/계란/샐러드)', done: false },
        { id: 2, text: '가스 충전 시 3분 맥켄지 허리 신전 스트레칭', done: false },
        { id: 3, text: '수분 섭취 (따뜻한 물/보리차 1L 이상)', done: false },
        { id: 4, text: '새벽 1:30경 20분 전략적 쪽잠(Power Nap)', done: false }
      ],
      corporate: {
        carNumber: '',
        dailyDeposit: 201000,
        deductionRate: 9.0,
        fixedAllowanceItems: [
          { id: 1, name: '기본급', amount: 1181700 },
          { id: 2, name: '승무수당', amount: 130000 },
          { id: 3, name: '교육수당', amount: 21000 },
          { id: 4, name: '법정휴일수당', amount: 35000 }
        ],
        fixedExpenseItems: [
          { id: 1, name: '노조비', amount: 25000 },
          { id: 2, name: '상조회비', amount: 0 }
        ],
        records: {}
      },
      private: {
        carNumber: '',
        records: {}
      }
    };

    const loadSafeData = () => {
      try {
        let saved = null;
        for (let i = 15; i >= 1; i--) {
          const raw = localStorage.getItem(`K_TAXI_RECORD_DATA_V${i}`);
          if (raw) { saved = raw; break; }
        }
        if (!saved) saved = localStorage.getItem('K_TAXI_RECORD_DATA');
        if (saved) {
          const p = JSON.parse(saved);
          return {
            hasSelectedType: p.hasSelectedType !== undefined ? p.hasSelectedType : true,
            activeType: (p.activeType || p.activeTab || 'corporate') === 'private' ? 'private' : 'corporate',
            hudSpeedLimit: Number(p.hudSpeedLimit || 50),
            defaultOffDay: Number(p.defaultOffDay !== undefined ? p.defaultOffDay : 1),
            healthRoutines: Array.isArray(p.healthRoutines) && p.healthRoutines.length > 0 ? p.healthRoutines : DEFAULT_STORAGE.healthRoutines,
            corporate: {
              carNumber: p.corporate?.carNumber || '',
              dailyDeposit: Number(p.corporate?.dailyDeposit || p.corporate?.baseDeposit || 201000),
              deductionRate: Number(p.corporate?.deductionRate !== undefined ? p.corporate.deductionRate : 9.0),
              fixedAllowanceItems: Array.isArray(p.corporate?.fixedAllowanceItems) && p.corporate.fixedAllowanceItems.length > 0 ? p.corporate.fixedAllowanceItems : DEFAULT_STORAGE.corporate.fixedAllowanceItems,
              fixedExpenseItems: Array.isArray(p.corporate?.fixedExpenseItems) ? p.corporate.fixedExpenseItems : DEFAULT_STORAGE.corporate.fixedExpenseItems,
              records: p.corporate?.records || {}
            },
            private: { carNumber: p.private?.carNumber || '', records: p.private?.records || {} }
          };
        }
      } catch (e) {
        console.warn('Storage Load Warning', e);
      }
      return DEFAULT_STORAGE;
    };

    function SmartMoneyInput({ value, onChange, placeholder = "0", className = "", colorClass = "text-white" }) {
      const numVal = Number(value) || 0;
      const displayVal = numVal > 0 ? numVal.toLocaleString('ko-KR') : '';

      return (
        <div className="relative flex items-center w-full">
          {numVal > 0 && (
            <button
              type="button"
              onClick={() => onChange(0)}
              className="absolute left-2 z-10 text-slate-400 hover:text-red-400 bg-slate-800 active:bg-slate-700 rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-black"
              tabIndex={-1}
            >
              ✕
            </button>
          )}
          <input
            type="text"
            inputMode="numeric"
            value={displayVal}
            placeholder={placeholder}
            onFocus={(e) => e.target.select()}
            onChange={(e) => {
              const raw = e.target.value.replace(/[^0-9]/g, '');
              onChange(raw ? Number(raw) : 0);
            }}
            className={`w-full bg-slate-900 border border-slate-700 p-2 text-sm rounded-xl text-right font-bold ${colorClass} focus:border-yellow-500 focus:outline-none ${className}`}
          />
        </div>
      );
    }

    // 메인 App 컴포넌트
    function App() {
      const [appData, setAppData] = useState(loadSafeData);
      const [currentTab, setCurrentTab] = useState('today');
      const [selectedDate, setSelectedDate] = useState(getTodayKey());
      const [currentYearMonth, setCurrentYearMonth] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      });

      const [navQuery, setNavQuery] = useState('');
      const [newRoutineText, setNewRoutineText] = useState('');
      const [showAddRoutineInput, setShowAddRoutineInput] = useState(false);

      const [showDailyModal, setShowDailyModal] = useState(false);
      const [showTaxModal, setShowTaxModal] = useState(false);
      const [showFixedAllowanceModal, setShowFixedAllowanceModal] = useState(false);
      const [showFixedExpenseModal, setShowFixedExpenseModal] = useState(false);

      // GPS & HUD & 카메라 감지 상태
      const [gpsSpeed, setGpsSpeed] = useState(0);
      const [currentCoords, setCurrentCoords] = useState(null);
      const [hudMirrorMode, setHudMirrorMode] = useState('rot90');
      const [nearbyCamera, setNearbyCamera] = useState(null); // { name, dist, limit, type }
      const [isSimulationActive, setIsSimulationActive] = useState(false);
      const lastSoundTriggerTime = useRef(0);

      // 쪽잠 타이머
      const [napTimerSeconds, setNapTimerSeconds] = useState(0);
      const [isNapTimerActive, setIsNapTimerActive] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem(CURRENT_STORAGE_KEY, JSON.stringify(appData));
        } catch (e) {
          console.warn('Storage Save Warning', e);
        }
      }, [appData]);

      // 실시간 GPS 감시 및 단속 카메라 거리 계산 엔진
      useEffect(() => {
        if (!navigator.geolocation) return;

        const watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            setGpsSpeed(speedKmh);
            setCurrentCoords({ lat, lon });

            if (!isSimulationActive) {
              // 가장 가까운 단속 카메라 탐색
              let closest = null;
              let minDistance = 99999;

              CAMERA_DB.forEach((cam) => {
                const dist = calculateDistanceMeters(lat, lon, cam.lat, cam.lon);
                if (dist < minDistance) {
                  minDistance = dist;
                  closest = { ...cam, dist };
                }
              });

              // 350m 이내 접근 시 감지
              if (closest && closest.dist <= 350) {
                setNearbyCamera(closest);
                // 10초 쿨다운 후 동물 사운드 출력
                const now = Date.now();
                if (now - lastSoundTriggerTime.current > 10000) {
                  playAnimalSound(closest.type);
                  lastSoundTriggerTime.current = now;
                }
              } else {
                setNearbyCamera(null);
              }
            }
          },
          (err) => console.warn('GPS Info:', err.message),
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 4000 }
        );

        return () => navigator.geolocation.clearWatch(watchId);
      }, [isSimulationActive]);

      // 시뮬레이션 테스트 토글 (가상 단속카메라 250m 진입)
      const toggleSimulation = (e) => {
        e.stopPropagation();
        if (isSimulationActive) {
          setIsSimulationActive(false);
          setNearbyCamera(null);
          setGpsSpeed(0);
        } else {
          setIsSimulationActive(true);
          setGpsSpeed(68); // 50 제한도로에서 68km/h 과속 가상 연출
          setNearbyCamera({
            id: 'sim_cam',
            name: '불당대로 (시뮬레이션)',
            limit: 50,
            dist: 230,
            type: 'dog'
          });
          playAnimalSound('dog');
        }
      };

      // 쪽잠 타이머
      useEffect(() => {
        let interval = null;
        if (isNapTimerActive && napTimerSeconds > 0) {
          interval = setInterval(() => setNapTimerSeconds(prev => prev - 1), 1000);
        } else if (isNapTimerActive && napTimerSeconds === 0) {
          setIsNapTimerActive(false);
          playAnimalSound('tiger');
          if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 1000]);
          alert('🔔 20분 쪽잠이 종료되었습니다! 안전 운행을 시작하세요.');
        }
        return () => clearInterval(interval);
      }, [isNapTimerActive, napTimerSeconds]);

      const activeType = appData?.activeType === 'private' ? 'private' : 'corporate';

      const handleInitialSelectType = (type) => {
        setAppData(prev => ({ ...prev, activeType: type, hasSelectedType: true }));
      };
      const setVehicleType = (type) => setAppData(prev => ({ ...prev, activeType: type }));
      const handleCarNumberChange = (val) => {
        setAppData(prev => ({ ...prev, [activeType]: { ...(prev[activeType] || {}), carNumber: val } }));
      };
      const handleCorporateConfigChange = (key, val) => {
        setAppData(prev => ({ ...prev, corporate: { ...(prev.corporate || {}), [key]: Number(val) || 0 } }));
      };
      const handleDefaultOffDayChange = (dayIndex) => {
        setAppData(prev => ({ ...prev, defaultOffDay: Number(dayIndex) }));
      };

      // 안드로이드 표준 Intent 내비 런처
      const openNavApp = (appType) => {
        const query = navQuery.trim() || '가스충전소';
        const encoded = encodeURIComponent(query);
        const isAndroid = /Android/i.test(navigator.userAgent);

        if (appType === 'tmap') {
          window.location.href = isAndroid
            ? `intent://search?name=${encoded}#Intent;scheme=tmap;package=com.skt.tmap.ku;end`
            : `tmap://search?name=${encoded}`;
        } else if (appType === 'kakao') {
          window.location.href = isAndroid
            ? `intent://search?q=${encoded}#Intent;scheme=kakaomap;package=net.daum.android.map;end`
            : `https://map.kakao.com/link/search/${encoded}`;
        } else if (appType === 'naver') {
          window.location.href = isAndroid
            ? `intent://search?query=${encoded}&appname=k-taxi#Intent;scheme=nmap;package=com.nhn.android.nmap;end`
            : `https://m.map.naver.com/search2/search.naver?query=${encoded}`;
        }
      };

      // 건강 루틴
      const toggleRoutineDone = (id) => {
        setAppData(prev => ({
          ...prev,
          healthRoutines: (prev.healthRoutines || []).map(r => r.id === id ? { ...r, done: !r.done } : r)
        }));
      };
      const handleAddRoutine = () => {
        if (!newRoutineText.trim()) return;
        setAppData(prev => ({
          ...prev,
          healthRoutines: [...(prev.healthRoutines || []), { id: Date.now(), text: newRoutineText.trim(), done: false }]
        }));
        setNewRoutineText('');
        setShowAddRoutineInput(false);
      };
      const handleDeleteRoutine = (id) => {
        if (!confirm('삭제하시겠습니까?')) return;
        setAppData(prev => ({ ...prev, healthRoutines: (prev.healthRoutines || []).filter(r => r.id !== id) }));
      };

      // 출퇴근 처리
      const todayKey = getTodayKey();
      const todayRecord = appData[activeType]?.records?.[todayKey] || {};

      const handleQuickClock = (type) => {
        const nowTime = getCurrentTimeStr();
        let updatedRec = { ...todayRecord };
        if (type === 'start') {
          updatedRec.startTime = nowTime;
          if (!updatedRec.endTime) updatedRec.endTime = '';
        } else {
          updatedRec.endTime = nowTime;
          if (!updatedRec.startTime) updatedRec.startTime = nowTime;
        }
        updatedRec.workMinutes = calculateMinutes(updatedRec.startTime, updatedRec.endTime);
        setAppData(prev => ({
          ...prev,
          [activeType]: { ...prev[activeType], records: { ...(prev[activeType]?.records || {}), [todayKey]: updatedRec } }
        }));
      };

      const handleResetClock = () => {
        if (!confirm('오늘의 출퇴근 시간을 초기화하시겠습니까?')) return;
        const updatedRec = { ...todayRecord, startTime: '', endTime: '', workMinutes: 0 };
        setAppData(prev => ({
          ...prev,
          [activeType]: { ...prev[activeType], records: { ...(prev[activeType]?.records || {}), [todayKey]: updatedRec } }
        }));
      };

      const handleSaveRecord = (dateKey, recordData) => {
        const workMins = calculateMinutes(recordData.startTime, recordData.endTime);
        setAppData(prev => ({
          ...prev,
          [activeType]: { ...prev[activeType], records: { ...(prev[activeType]?.records || {}), [dateKey]: { ...recordData, workMinutes: workMins } } }
        }));
        setShowDailyModal(false);
      };

      const handleDeleteDailyRecord = (dateKey) => {
        if (!confirm(`${dateKey} 기록을 삭제하시겠습니까?`)) return;
        const updatedRecords = { ...(appData[activeType]?.records || {}) };
        delete updatedRecords[dateKey];
        setAppData(prev => ({ ...prev, [activeType]: { ...prev[activeType], records: updatedRecords } }));
      };

      const totalFixedAllowances = useMemo(() => {
        return (appData?.corporate?.fixedAllowanceItems || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [appData?.corporate?.fixedAllowanceItems]);

      const totalFixedExpenses = useMemo(() => {
        return (appData?.corporate?.fixedExpenseItems || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [appData?.corporate?.fixedExpenseItems]);

      const currentMonthStats = useMemo(() => {
        const records = appData[activeType]?.records || {};
        const entries = Object.entries(records).filter(([date]) => date && String(date).startsWith(currentYearMonth));

        let workDays = 0, holidayDays = 0, totalWorkMinutes = 0;

        if (activeType === 'corporate') {
          const dailyDeposit = Number(appData.corporate?.dailyDeposit || 201000);
          const deductionRate = Number(appData.corporate?.deductionRate !== undefined ? appData.corporate.deductionRate : 9.0) / 100;
          let totalRevenue = 0, totalGasCompany = 0, totalDriverExpense = 0, totalIncentive = 0;

          entries.forEach(([_, r]) => {
            if (r?.isHoliday) { holidayDays++; }
            else {
              workDays++;
              const rev = Number(r?.revenue || 0);
              totalRevenue += rev;
              totalGasCompany += Number(r?.gas || 0);
              totalDriverExpense += Number(r?.driverExpense || 0);
              totalWorkMinutes += Number(r?.workMinutes || 0);
              totalIncentive += Math.round(Math.max(0, rev - dailyDeposit) * 0.7);
            }
          });

          const grossSalary = totalFixedAllowances + totalIncentive;
          const taxAndInsurance = Math.round(grossSalary * deductionRate);
          const totalDeductions = taxAndInsurance + totalFixedExpenses;
          const netSalaryFromCompany = grossSalary - totalDeductions;
          const finalNetIncome = netSalaryFromCompany - totalDriverExpense;

          return { workDays, holidayDays, totalWorkMinutes, totalRevenue, totalGasCompany, totalIncentive, grossSalary, taxAndInsurance, totalFixedExpenses, totalDeductions, netSalaryFromCompany, totalDriverExpense, finalNetIncome };
        } else {
          let cardTotal = 0, cashTotal = 0, gasTotal = 0, tollTotal = 0, maintTotal = 0, otherTotal = 0;

          entries.forEach(([_, r]) => {
            if (r?.isHoliday) { holidayDays++; }
            else {
              workDays++;
              cardTotal += Number(r?.cardRev || 0);
              cashTotal += Number(r?.cashRev || 0);
              gasTotal += Number(r?.gas || 0);
              tollTotal += Number(r?.toll || 0);
              maintTotal += Number(r?.maint || 0);
              otherTotal += Number(r?.other || 0);
              totalWorkMinutes += Number(r?.workMinutes || 0);
            }
          });

          const totalRevenue = cardTotal + cashTotal;
          const totalExpense = gasTotal + tollTotal + maintTotal + otherTotal;
          return { workDays, holidayDays, totalWorkMinutes, cardTotal, cashTotal, totalRevenue, gasTotal, tollTotal, maintTotal, otherTotal, totalExpense, netIncome: totalRevenue - totalExpense };
        }
      }, [appData, activeType, currentYearMonth, totalFixedAllowances, totalFixedExpenses]);

      const calendarCells = useMemo(() => {
        const [y, m] = currentYearMonth.split('-').map(Number);
        const firstDayWeekIndex = new Date(y, m - 1, 1).getDay();
        const totalDaysInMonth = new Date(y, m, 0).getDate();
        const cells = [];
        for (let i = 0; i < firstDayWeekIndex; i++) cells.push(null);
        for (let d = 1; d <= totalDaysInMonth; d++) cells.push(`${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
        return cells;
      }, [currentYearMonth]);

      const shiftSchedule = useMemo(() => {
        const start = todayRecord.startTime || '16:30';
        return { start, rest1: addMinutesToTime(start, 240), rest2: '01:30', end: addMinutesToTime(start, 720) };
      }, [todayRecord.startTime]);

      const openModalForDate = (dateStr) => { setSelectedDate(dateStr); setShowDailyModal(true); };
      const currentRecords = appData[activeType]?.records || {};
      const sortedMonthEntries = Object.entries(currentRecords).filter(([date]) => date && String(date).startsWith(currentYearMonth)).sort(([a], [b]) => a.localeCompare(b));

      const getHudInnerTransformClass = () => {
        if (hudMirrorMode === 'flipY') return 'hud-flip-y';
        if (hudMirrorMode === 'rot90') return 'hud-rot90-flip';
        return '';
      };

      const getMirrorModeLabel = () => {
        if (hudMirrorMode === 'rot90') return '90° 회전 반사';
        if (hudMirrorMode === 'flipY') return '가로 반사';
        return '일반 모드';
      };

      const effectiveSpeedLimit = nearbyCamera ? nearbyCamera.limit : (appData.hudSpeedLimit || 50);
      const isOverSpeed = gpsSpeed > effectiveSpeedLimit;
      const isNearCamera = !!nearbyCamera;

      const handleCycleMirrorMode = () => {
        if (hudMirrorMode === 'rot90') setHudMirrorMode('flipY');
        else if (hudMirrorMode === 'flipY') setHudMirrorMode('normal');
        else setHudMirrorMode('rot90');
      };

      const DAYS_NAME = ['일', '월', '화', '수', '목', '금', '토'];

      if (!appData.hasSelectedType) {
        return (
          <div className="max-w-md mx-auto min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 text-center space-y-6">
            <div className="space-y-2">
              <span className="bg-yellow-500 text-black text-xs font-black px-3 py-1 rounded-full shadow">K-TAXI</span>
              <h1 className="text-2xl font-black text-white tracking-tight mt-2">운행 모드를 선택해 주세요</h1>
              <p className="text-xs text-slate-400">선택하신 모드에 최적화된 장부와 계산식이 적용됩니다.<br/>(설정 탭에서 언제든 변경 가능)</p>
            </div>
            <div className="w-full space-y-3">
              <button
                onClick={() => handleInitialSelectType('corporate')}
                className="w-full p-5 bg-slate-900 border-2 border-yellow-500/50 hover:border-yellow-400 rounded-3xl text-left flex items-center justify-between shadow-xl"
              >
                <div>
                  <span className="text-base font-black text-yellow-400 block">법인택시 모드</span>
                  <span className="text-xs text-slate-400 mt-1 block">사납금, 성과급(70%), 고정수당, 4대보험 공제 정산</span>
                </div>
                <span className="text-2xl">🚕</span>
              </button>
              <button
                onClick={() => handleInitialSelectType('private')}
                className="w-full p-5 bg-slate-900 border-2 border-slate-700 hover:border-slate-500 rounded-3xl text-left flex items-center justify-between shadow-xl"
              >
                <div>
                  <span className="text-base font-black text-emerald-400 block">개인택시 모드</span>
                  <span className="text-xs text-slate-400 mt-1 block">카드/현금 수입, 가스/통행료 경비, 세무서 양식 추출</span>
                </div>
                <span className="text-2xl">🚗</span>
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-md mx-auto w-full min-h-screen flex flex-col bg-slate-950 border-x border-slate-800 relative">
          
          {currentTab !== 'hud' && (
            <header className="p-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between sticky top-0 z-30">
              <div className="flex items-center gap-2">
                <span className="bg-yellow-500 text-black text-[11px] font-black px-2 py-0.5 rounded shadow">K-TAXI</span>
                <span className="text-sm font-bold text-white tracking-tight truncate max-w-[150px]">
                  {appData[activeType]?.carNumber || (activeType === 'corporate' ? '법인택시' : '개인택시')}
                </span>
              </div>
              <span className="text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-semibold border border-slate-700">
                {activeType === 'corporate' ? '법인 모드' : '개인 모드'}
              </span>
            </header>
          )}

          <main className={`flex-1 overflow-y-auto ${currentTab === 'hud' ? 'p-2 pb-20 flex flex-col' : 'p-3 pb-24'}`}>
            
            {/* 탭 1: 🏠 오늘 & 건강 */}
            {currentTab === 'today' && (
              <div className="space-y-3.5">
                <div className="bg-slate-900 p-3.5 rounded-2xl border border-slate-800 shadow-sm space-y-3">
                  <div className="flex items-center justify-between">
                    <div className="space-y-0.5">
                      <span className="text-[11px] text-slate-400 font-bold block">오늘의 근무 기록</span>
                      <div className="text-xs text-slate-200">
                        출근 <span className="text-yellow-400 font-bold">{todayRecord.startTime || '--:--'}</span> ~ 퇴근 <span className="text-yellow-400 font-bold">{todayRecord.endTime || '--:--'}</span>
                        {todayRecord.workMinutes > 0 && (
                          <span className="ml-1.5 text-[11px] text-green-400 font-bold">({formatMinutesToHours(todayRecord.workMinutes)})</span>
                        )}
                      </div>
                    </div>
                    <div className="flex gap-1.5 items-center">
                      <button onClick={() => handleQuickClock('start')} className="px-3 py-1.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow">출근</button>
                      <button onClick={() => handleQuickClock('end')} className="px-3 py-1.5 bg-orange-600 text-white font-bold text-xs rounded-xl shadow">퇴근</button>
                      {(todayRecord.startTime || todayRecord.endTime) && (
                        <button onClick={handleResetClock} className="px-2 py-1.5 bg-slate-800 text-slate-400 font-bold text-xs rounded-xl border border-slate-700">초기화</button>
                      )}
                    </div>
                  </div>

                  <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 space-y-2">
                    <div className="flex justify-between items-center text-[11px]">
                      <span className="font-bold text-slate-300">⏱️ 출근 맞춤 건강 일과표</span>
                      {isNapTimerActive ? (
                        <button onClick={() => setIsNapTimerActive(false)} className="px-2 py-0.5 bg-red-950 text-red-300 border border-red-500/40 rounded-lg font-bold text-[10px] animate-pulse">
                          쪽잠 중 ({Math.floor(napTimerSeconds / 60)}:{String(napTimerSeconds % 60).padStart(2, '0')}) 취소
                        </button>
                      ) : (
                        <button onClick={() => { setNapTimerSeconds(20 * 60); setIsNapTimerActive(true); }} className="px-2 py-0.5 bg-indigo-900/80 text-indigo-200 border border-indigo-500/40 rounded-lg font-bold text-[10px]">
                          ⚡ 20분 쪽잠 타이머
                        </button>
                      )}
                    </div>
                    <div className="grid grid-cols-3 gap-1.5 text-center text-[10px]">
                      <div className="bg-slate-900 p-1.5 rounded-lg border border-slate-800">
                        <span className="text-slate-400 block font-semibold">1차 식사/스트레칭</span>
                        <span className="text-yellow-400 font-bold mt-0.5 block">{shiftSchedule.rest1}</span>
                      </div>
                      <div className="bg-slate-900 p-1.5 rounded-lg border border-slate-800">
                        <span className="text-slate-400 block font-semibold">2차 쪽잠 (20분)</span>
                        <span className="text-indigo-300 font-bold mt-0.5 block">{shiftSchedule.rest2}</span>
                      </div>
                      <div className="bg-slate-900 p-1.5 rounded-lg border border-slate-800">
                        <span className="text-slate-400 block font-semibold">목표 퇴근 (12h)</span>
                        <span className="text-emerald-400 font-bold mt-0.5 block">{shiftSchedule.end}</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* 내비 런처 */}
                <div className="bg-slate-900 p-3.5 rounded-2xl border border-slate-800 space-y-2.5">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-slate-300">🧭 원터치 내비 길안내</span>
                    <span className="text-[10px] text-slate-500">목적지 앱 자동 연동</span>
                  </div>
                  <div className="flex gap-1.5">
                    <input
                      type="text"
                      placeholder="목적지 입력 (미입력 시 '가스충전소')"
                      value={navQuery}
                      onChange={(e) => setNavQuery(e.target.value)}
                      className="flex-1 bg-slate-950 border border-slate-700 px-3 py-2 text-xs rounded-xl text-white focus:outline-none"
                    />
                    {navQuery && <button onClick={() => setNavQuery('')} className="px-2.5 bg-slate-800 text-slate-400 rounded-xl text-xs">✕</button>}
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <button onClick={() => openNavApp('tmap')} className="py-2.5 bg-red-950/80 border border-red-500/40 text-red-300 font-bold rounded-xl text-xs flex items-center justify-center gap-1"><span>🔴</span> 티맵</button>
                    <button onClick={() => openNavApp('kakao')} className="py-2.5 bg-yellow-950/80 border border-yellow-500/40 text-yellow-300 font-bold rounded-xl text-xs flex items-center justify-center gap-1"><span>🟡</span> 카카오맵</button>
                    <button onClick={() => openNavApp('naver')} className="py-2.5 bg-emerald-950/80 border border-emerald-500/40 text-emerald-300 font-bold rounded-xl text-xs flex items-center justify-center gap-1"><span>🟢</span> 네이버지도</button>
                  </div>
                </div>

                {/* 건강 루틴 */}
                <div className="bg-slate-900 p-3.5 rounded-2xl border border-slate-800 space-y-2.5">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-emerald-400">🥗 오늘 실천할 건강 루틴 ({ (appData.healthRoutines || []).filter(r => r.done).length } / { (appData.healthRoutines || []).length })</span>
                    <button onClick={() => setShowAddRoutineInput(!showAddRoutineInput)} className="text-[11px] text-yellow-400 font-bold px-2 py-0.5 rounded bg-slate-800 border border-slate-700">
                      {showAddRoutineInput ? '닫기' : '+ 항목 추가'}
                    </button>
                  </div>
                  {showAddRoutineInput && (
                    <div className="flex gap-1.5 pt-1">
                      <input
                        type="text"
                        placeholder="새 건강 목표 입력 (예: 허리보호대 착용)"
                        value={newRoutineText}
                        onChange={(e) => setNewRoutineText(e.target.value)}
                        className="flex-1 bg-slate-950 border border-slate-700 px-3 py-1.5 text-xs rounded-xl text-white focus:outline-none"
                      />
                      <button onClick={handleAddRoutine} className="px-3 py-1.5 bg-emerald-600 text-white font-bold text-xs rounded-xl">추가</button>
                    </div>
                  )}
                  <div className="space-y-1.5 pt-1">
                    {(appData.healthRoutines || []).map((routine) => (
                      <div key={routine.id} className={`p-2.5 rounded-xl border flex items-center justify-between text-xs ${routine.done ? 'bg-emerald-950/30 border-emerald-800/40 text-emerald-300 line-through' : 'bg-slate-950 border-slate-800 text-slate-200'}`}>
                        <div onClick={() => toggleRoutineDone(routine.id)} className="flex items-center gap-2 flex-1 cursor-pointer">
                          <input type="checkbox" checked={routine.done} onChange={() => toggleRoutineDone(routine.id)} className="w-4 h-4 rounded text-emerald-500 cursor-pointer" />
                          <span className="font-medium">{routine.text}</span>
                        </div>
                        <button onClick={() => handleDeleteRoutine(routine.id)} className="text-slate-500 hover:text-red-400 px-1 font-bold text-xs">✕</button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* 탭 2: 📅 운행일지 */}
            {currentTab === 'calendar' && (
              <div className="space-y-3">
                <div className="bg-slate-900 p-2.5 rounded-2xl border border-slate-800 flex items-center justify-between">
                  <button onClick={() => {
                    const [y, m] = currentYearMonth.split('-').map(Number);
                    const prevDate = new Date(y, m - 2, 1);
                    setCurrentYearMonth(`${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`);
                  }} className="w-8 h-8 flex items-center justify-center bg-slate-800 rounded-xl text-slate-300 font-bold">◀</button>
                  <div className="text-center">
                    <span className="text-base font-black text-yellow-400">{currentYearMonth}</span>
                    <div className="text-[11px] text-slate-400 font-medium">{currentMonthStats.workDays}일 운행 / 총 {formatMinutesToHours(currentMonthStats.totalWorkMinutes)}</div>
                  </div>
                  <button onClick={() => {
                    const [y, m] = currentYearMonth.split('-').map(Number);
                    const nextDate = new Date(y, m, 1);
                    setCurrentYearMonth(`${nextDate.getFullYear()}-${String(nextDate.getMonth() + 1).padStart(2, '0')}`);
                  }} className="w-8 h-8 flex items-center justify-center bg-slate-800 rounded-xl text-slate-300 font-bold">▶</button>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800">
                    <span className="text-[11px] text-slate-400 block font-semibold">이번 달 총 매출</span>
                    <span className="text-base font-black text-yellow-400 block mt-0.5">{formatMoney(currentMonthStats.totalRevenue)}</span>
                  </div>
                  <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800">
                    <span className="text-[11px] text-green-400 block font-semibold">{activeType === 'corporate' ? '통장 예상 월급' : '과세 소득금액'}</span>
                    <span className="text-base font-black text-green-400 block mt-0.5">
                      {activeType === 'corporate' ? formatMoney(currentMonthStats.netSalaryFromCompany) : formatMoney(currentMonthStats.netIncome)}
                    </span>
                  </div>
                </div>

                <div className="bg-slate-900/90 p-3 rounded-2xl border border-slate-800">
                  <div className="grid grid-cols-7 text-center text-[11px] font-bold text-slate-400 pb-2 border-b border-slate-800 mb-2">
                    {DAYS_NAME.map((dName, idx) => (
                      <span key={dName} className={`${idx === 0 ? 'text-red-400' : idx === 6 ? 'text-blue-400' : idx === (appData.defaultOffDay || 1) ? 'text-emerald-400' : 'text-slate-300'}`}>
                        {dName}{idx === (appData.defaultOffDay || 1) ? '·휴' : ''}
                      </span>
                    ))}
                  </div>
                  <div className="grid grid-cols-7 gap-1">
                    {calendarCells.map((dateStr, idx) => {
                      if (!dateStr) return <div key={`empty-${idx}`} className="h-12 rounded-lg bg-transparent"></div>;
                      const dayNum = Number(dateStr.split('-')[2]);
                      const dayOfWeek = (idx % 7);
                      const rec = currentRecords[dateStr];
                      const isSelected = selectedDate === dateStr;
                      const isDefaultOff = dayOfWeek === (appData.defaultOffDay || 1);

                      return (
                        <button
                          key={dateStr}
                          onClick={() => openModalForDate(dateStr)}
                          className={`h-12 p-1 rounded-xl flex flex-col justify-between items-start text-left border transition ${
                            isSelected ? 'border-yellow-400 bg-yellow-500/20' : rec?.isHoliday ? 'border-emerald-800/60 bg-emerald-950/30' : rec ? 'border-slate-700 bg-slate-950/80' : isDefaultOff ? 'border-slate-800/80 bg-slate-900/40' : 'border-slate-800/60 bg-slate-950/30'
                          }`}
                        >
                          <div className="flex justify-between w-full items-center">
                            <span className={`text-[10px] font-bold ${dayOfWeek === 0 ? 'text-red-400' : dayOfWeek === 6 ? 'text-blue-400' : dayOfWeek === (appData.defaultOffDay || 1) ? 'text-emerald-400' : 'text-slate-300'}`}>{dayNum}</span>
                            {isDefaultOff && !rec && <span className="text-[7px] text-emerald-500/80 font-bold">휴무</span>}
                          </div>
                          {rec && (
                            rec.isHoliday ? (
                              <span className="text-[8px] bg-emerald-950 text-emerald-300 font-bold px-1 rounded w-full text-center">휴무</span>
                            ) : (
                              <span className="text-[8px] text-yellow-400 font-bold truncate w-full text-center">
                                {activeType === 'corporate' ? formatShortMoney(rec.revenue) : formatShortMoney(Number(rec.cardRev || 0) + Number(rec.cashRev || 0))}
                              </span>
                            )
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="bg-slate-900/90 p-3 rounded-2xl border border-slate-800 space-y-2">
                  <div className="flex justify-between items-center pb-1">
                    <span className="text-xs font-bold text-slate-300">운행 일지 ({sortedMonthEntries.length}건)</span>
                    <button onClick={() => openModalForDate(todayKey)} className="px-2.5 py-1 bg-yellow-500 text-black font-bold text-[11px] rounded-lg shadow">+ 오늘 기록</button>
                  </div>
                  {sortedMonthEntries.length === 0 ? (
                    <div className="text-center py-6 text-xs text-slate-500">등록된 운행 기록이 없습니다.</div>
                  ) : (
                    <div className="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                      {sortedMonthEntries.map(([date, rec]) => (
                        <div key={date} className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between text-xs">

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] text-slate-400 block mb-0.5">출근 시간</label>
                      <input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} className="w-full bg-slate-900 border border-slate-700 p-1.5 rounded-lg text-xs text-white text-center font-bold" />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-400 block mb-0.5">퇴근 시간</label>
                      <input type="time" value={endTime} onChange={(e) => setEndTime(e.target.value)} className="w-full bg-slate-900 border border-slate-700 p-1.5 rounded-lg text-xs text-white text-center font-bold" />
                    </div>
                  </div>
                </div>
                {activeType === 'corporate' ? (
                  <>
                    <div><label className="text-[11px] text-slate-400 block mb-1">당일 총매출</label><SmartMoneyInput value={revenue} onChange={setRevenue} colorClass="text-yellow-400" /></div>
                    <div><label className="text-[11px] text-blue-400 block mb-1">가스비</label><SmartMoneyInput value={gas} onChange={setGas} colorClass="text-blue-300" /></div>
                    <div><label className="text-[11px] text-orange-400 block mb-1">기타 기사경비</label><SmartMoneyInput value={driverExpense} onChange={setDriverExpense} colorClass="text-orange-300" /></div>
                  </>
                ) : (
                  <>
                    <div className="grid grid-cols-2 gap-2">
                      <div><label className="text-[10px] text-slate-400 block mb-1">카드 수입</label><SmartMoneyInput value={cardRev} onChange={setCardRev} /></div>
                      <div><label className="text-[10px] text-slate-400 block mb-1">현금 수입</label><SmartMoneyInput value={cashRev} onChange={setCashRev} /></div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div><label className="text-[10px] text-slate-400 block mb-1">가스비</label><SmartMoneyInput value={privGas} onChange={setPrivGas} /></div>
                      <div><label className="text-[10px] text-slate-400 block mb-1">통행료</label><SmartMoneyInput value={toll} onChange={setToll} /></div>
                    </div>
                  </>
                )}
                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">운행 메모</label>
                  <input type="text" placeholder="특이사항 메모" value={memo} onChange={(e) => setMemo(e.target.value)} className="w-full bg-slate-950 border border-slate-700 p-2 text-xs rounded-xl text-white" />
                </div>
              </div>
            )}
            <div className="flex gap-2 pt-2">
              <button onClick={handleSave} className="flex-1 py-2.5 bg-yellow-500 text-black font-bold rounded-xl text-xs">저장 완료</button>
              <button onClick={onClose} className="px-4 py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">취소</button>
            </div>
          </div>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("K-TAXI Error Caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-6 text-center">
              <div className="bg-slate-900 border border-red-500/40 p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl">
                <div className="w-12 h-12 rounded-2xl bg-red-950/80 border border-red-500/40 flex items-center justify-center mx-auto text-2xl">🛡️</div>
                <div>
                  <h2 className="text-base font-bold text-red-400">데이터 안전 보호 모드</h2>
                  <p className="text-xs text-slate-400 mt-1.5 leading-relaxed">시스템이 정상 복구되었습니다.</p>
                </div>
                <button onClick={() => window.location.reload()} className="w-full py-2.5 bg-yellow-500 text-black font-bold text-xs rounded-xl shadow">화면 새로고침</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
