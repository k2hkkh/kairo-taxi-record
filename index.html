<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>K-TAXI 운행기록장 & 안전운행 HUD</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animate-pulse-slow {
      animation: pulse-slow 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .hud-mirror {
      transform: scaleY(-1);
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans select-none antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- 유틸리티 함수 ---
    const formatMoney = (val) => {
      const num = Number(val) || 0;
      return num.toLocaleString('ko-KR') + '원';
    };

    const getTodayKey = () => {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const getNowTimestamp = () => {
      const now = new Date();
      const date = getTodayKey();
      const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      return `${date} ${time}`;
    };

    // 하버사인 거리 계산 공식 (단위: 미터)
    const getDistanceMeters = (lat1, lon1, lat2, lon2) => {
      const R = 6371e3;
      const φ1 = (lat1 * Math.PI) / 180;
      const φ2 = (lat2 * Math.PI) / 180;
      const Δφ = ((lat2 - lat1) * Math.PI) / 180;
      const Δλ = ((lon2 - lon1) * Math.PI) / 180;

      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    };

    // 단속 카메라 데이터베이스 (신호/과속 겸용 및 고정식)
    const SAMPLE_CAMERAS = [
      { id: 1, lat: 37.5665, lon: 126.9780, limitSpeed: 50, desc: '서울시청앞 신호·과속 단속' },
      { id: 2, lat: 37.4979, lon: 127.0276, limitSpeed: 50, desc: '강남역교차로 과속단속' },
      { id: 3, lat: 37.5172, lon: 127.0473, limitSpeed: 60, desc: '봉은사로 신호·과속 단속' },
      { id: 4, lat: 36.7845, lon: 127.0041, limitSpeed: 50, desc: '아산시청앞 신호·과속 단속' },
      { id: 5, lat: 36.7812, lon: 127.0095, limitSpeed: 30, desc: '어린이보호구역 스쿨존 단속' }
    ];

    // 기본 스토리지 스키마 (법인/개인 분리 및 과속단속기록부 추가)
    const DEFAULT_STORAGE = {
      activeTab: 'corporate', // 'corporate' | 'private'
      corporate: {
        carNumber: '',
        baseDeposit: 201000,
        fixedIncomes: 0,
        records: {}
      },
      private: {
        carNumber: '',
        records: {}
      },
      speedingLogs: [] // 과속 단속 의심 이력 [{ id, timestamp, desc, limitSpeed, passSpeed, overSpeed }]
    };

    function App() {
      // 로컬 스토리지 데이터 로드
      const [appData, setAppData] = useState(() => {
        const saved = localStorage.getItem('K_TAXI_RECORD_DATA_V4');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { return DEFAULT_STORAGE; }
        }
        return DEFAULT_STORAGE;
      });

      const [viewMode, setViewMode] = useState('record'); // 'record' | 'hud'
      const [selectedDate, setSelectedDate] = useState(getTodayKey());
      const [currentYearMonth, setCurrentYearMonth] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      });

      // 모달 상태
      const [showDailyModal, setShowDailyModal] = useState(false);
      const [showTaxModal, setShowTaxModal] = useState(false);
      const [showSpeedLogModal, setShowSpeedLogModal] = useState(false);
      const [showCorporateNet, setShowCorporateNet] = useState(false);

      // GPS & HUD 상태
      const [gpsSpeed, setGpsSpeed] = useState(0);
      const [nearestCamera, setNearestCamera] = useState(null);
      const [hudMirrored, setHudMirrored] = useState(false);
      const [audioReady, setAudioReady] = useState(false);
      
      const lastAlertedCamRef = useRef(null);
      const lastLoggedCamRef = useRef(null); // 중복 기록 방지용 Ref

      // 데이터 저장 동기화
      useEffect(() => {
        localStorage.setItem('K_TAXI_RECORD_DATA_V4', JSON.stringify(appData));
      }, [appData]);

      // TTS 음성 경고 (블루투스 출력 및 최고 음량)
      const speak = (text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 1.05;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const koVoice = voices.find(v => v.lang.includes('ko'));
        if (koVoice) utterance.voice = koVoice;

        window.speechSynthesis.speak(utterance);
      };

      // 오디오/블루투스 채널 선점 활성화
      const initAudioChannel = () => {
        if ('speechSynthesis' in window) {
          const dummy = new SpeechSynthesisUtterance('');
          window.speechSynthesis.speak(dummy);
          setAudioReady(true);
          speak('안전운행 음성 안내가 활성화되었습니다.');
        }
      };

      // GPS 감시 및 과속 단속 의심 이력 자동 기록 로직
      useEffect(() => {
        if (!navigator.geolocation) return;

        const watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
            setGpsSpeed(speedKmh);

            const userLat = pos.coords.latitude;
            const userLon = pos.coords.longitude;

            let closest = null;
            let minDist = Infinity;

            SAMPLE_CAMERAS.forEach((cam) => {
              const dist = getDistanceMeters(userLat, userLon, cam.lat, cam.lon);
              if (dist < 600 && dist < minDist) {
                minDist = Math.round(dist);
                closest = { ...cam, distance: minDist };
              }
            });

            setNearestCamera(closest);

            if (closest) {
              // 1. 사전 음성 알림 (500m / 300m 구간)
              if (closest.distance <= 300 && closest.distance > 60 && lastAlertedCamRef.current !== `${closest.id}-300`) {
                speak(`전방 300미터 앞 제한속도 ${closest.limitSpeed}킬로미터 단속 구간입니다.`);
                lastAlertedCamRef.current = `${closest.id}-300`;
              } else if (closest.distance > 300 && closest.distance <= 500 && lastAlertedCamRef.current !== `${closest.id}-500`) {
                speak(`전방에 ${closest.limitSpeed}킬로미터 단속 카메라가 있습니다.`);
                lastAlertedCamRef.current = `${closest.id}-500`;
              }

              // 2. 단속 카메라 초근접 통과 시(반경 45m 이내) 과속 단속 의심 이력 자동 저장
              if (closest.distance <= 45 && speedKmh > closest.limitSpeed) {
                if (lastLoggedCamRef.current !== closest.id) {
                  const overKm = speedKmh - closest.limitSpeed;
                  const newLog = {
                    id: Date.now(),
                    timestamp: getNowTimestamp(),
                    desc: closest.desc,
                    limitSpeed: closest.limitSpeed,
                    passSpeed: speedKmh,
                    overSpeed: overKm
                  };

                  setAppData(prev => ({
                    ...prev,
                    speedingLogs: [newLog, ...(prev.speedingLogs || [])]
                  }));

                  speak(`제한속도 ${overKm}킬로미터 초과! 단속 의심 내역에 기록되었습니다.`);
                  lastLoggedCamRef.current = closest.id;
                }
              }
            } else {
              lastAlertedCamRef.current = null;
              lastLoggedCamRef.current = null;
            }
          },
          (err) => console.warn('GPS Info:', err.message),
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
        );

        return () => navigator.geolocation.clearWatch(watchId);
      }, []);

      // 탭 전환 핸들러
      const setTab = (tab) => {
        setAppData(prev => ({ ...prev, activeTab: tab }));
        setShowCorporateNet(false);
      };

      // 차량번호 수정
      const handleCarNumberChange = (val) => {
        const tab = appData.activeTab;
        setAppData(prev => ({
          ...prev,
          [tab]: {
            ...prev[tab],
            carNumber: val
          }
        }));
      };

      // 법인 설정 변경
      const handleCorporateConfigChange = (key, val) => {
        setAppData(prev => ({
          ...prev,
          corporate: {
            ...prev.corporate,
            [key]: Number(val) || 0
          }
        }));
      };

      // 일별 기록 저장
      const handleSaveRecord = (dateKey, recordData) => {
        const tab = appData.activeTab;
        setAppData(prev => ({
          ...prev,
          [tab]: {
            ...prev[tab],
            records: {
              ...prev[tab].records,
              [dateKey]: recordData
            }
          }
        }));
        setShowDailyModal(false);
      };

      // 단속 기록 개별 삭제
      const handleDeleteSpeedLog = (id) => {
        setAppData(prev => ({
          ...prev,
          speedingLogs: prev.speedingLogs.filter(item => item.id !== id)
        }));
      };

      // 단속 기록 전체 삭제
      const handleClearAllSpeedLogs = () => {
        if (confirm('모든 단속 의심 이력을 삭제하시겠습니까?')) {
          setAppData(prev => ({ ...prev, speedingLogs: [] }));
        }
      };

      // 현재 선택된 월의 통계 계산
      const currentMonthStats = useMemo(() => {
        const tab = appData.activeTab;
        const records = appData[tab].records || {};
        const entries = Object.entries(records).filter(([date]) => date.startsWith(currentYearMonth));

        if (tab === 'corporate') {
          let totalRevenue = 0;
          let totalGasCompany = 0;
          let totalDriverExpense = 0;

          entries.forEach(([_, r]) => {
            if (!r.isHoliday) {
              totalRevenue += Number(r.revenue || 0);
              totalGasCompany += Number(r.gas || 0);
              totalDriverExpense += Number(r.driverExpense || 0);
            }
          });

          const fixedIncomes = Number(appData.corporate.fixedIncomes || 0);
          const grossSalary = totalRevenue + fixedIncomes;
          const netIncome = grossSalary - totalDriverExpense;

          return {
            totalRevenue,
            totalGasCompany,
            totalDriverExpense,
            grossSalary,
            netIncome
          };
        } else {
          let cardTotal = 0;
          let cashTotal = 0;
          let gasTotal = 0;
          let tollTotal = 0;
          let maintTotal = 0;
          let otherTotal = 0;

          entries.forEach(([_, r]) => {
            if (!r.isHoliday) {
              cardTotal += Number(r.cardRev || 0);
              cashTotal += Number(r.cashRev || 0);
              gasTotal += Number(r.gas || 0);
              tollTotal += Number(r.toll || 0);
              maintTotal += Number(r.maint || 0);
              otherTotal += Number(r.other || 0);
            }
          });

          const totalRevenue = cardTotal + cashTotal;
          const totalExpense = gasTotal + tollTotal + maintTotal + otherTotal;
          const netIncome = totalRevenue - totalExpense;

          return {
            cardTotal,
            cashTotal,
            totalRevenue,
            gasTotal,
            tollTotal,
            maintTotal,
            otherTotal,
            totalExpense,
            netIncome
          };
        }
      }, [appData, currentYearMonth]);

      // 개인택시 세무서 제출 텍스트
      const taxReportText = useMemo(() => {
        if (appData.activeTab !== 'private') return '';
        const stats = currentMonthStats;
        const carNum = appData.private.carNumber || '미등록';

        return `[세무서 제출용 간편 소득 요약서]
■ 귀속기간: ${currentYearMonth}
■ 차량번호: ${carNum}
------------------------------------
1. 총 수입금액 (매출)
 - 카드 및 앱 매출: ${formatMoney(stats.cardTotal)}
 - 현금 결제 매출: ${formatMoney(stats.cashTotal)}
 * 매출 총 합계: ${formatMoney(stats.totalRevenue)}

2. 필요경비 합계 (지출)
 - 가스비 (유류비): ${formatMoney(stats.gasTotal)}
 - 도로 통행료: ${formatMoney(stats.tollTotal)}
 - 차량 정비/유지비: ${formatMoney(stats.maintTotal)}
 - 기타 사업경비: ${formatMoney(stats.otherTotal)}
 * 필요경비 총 합계: ${formatMoney(stats.totalExpense)}
------------------------------------
3. 소득금액 (과세표준 대상): ${formatMoney(stats.netIncome)}
------------------------------------
※ 본 자료는 K-TAXI에서 부가가치세 및 종합소득세 신고를 위해 자동 산출된 자료입니다.`;
      }, [appData, currentMonthStats, currentYearMonth]);

      // JSON 백업 다운로드
      const exportBackup = () => {
        const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `K-TAXI_BACKUP_${getTodayKey()}.json`;
        a.click();
      };

      // JSON 백업 복원
      const importBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed.corporate && parsed.private) {
              setAppData(parsed);
              alert('데이터 복원이 완료되었습니다.');
            } else {
              alert('올바른 백업 파일 형식이 아닙니다.');
            }
          } catch (err) {
            alert('파일을 읽는 중 오류가 발생했습니다.');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col bg-gray-900 border-x border-gray-800">
          
          {/* 상단 헤더 */}
          <header className="p-4 bg-gray-950 border-b border-gray-800 flex items-center justify-between sticky top-0 z-30">
            <div className="flex items-center gap-2">
              <span className="bg-yellow-500 text-black text-xs font-black px-2 py-0.5 rounded">K-TAXI</span>
              <h1 className="text-base font-bold tracking-tight">운행기록 & HUD</h1>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setShowSpeedLogModal(true)}
                className="px-2 py-1 bg-red-950/80 border border-red-800 text-red-300 text-[11px] font-bold rounded-lg relative"
              >
                단속의심 {appData.speedingLogs && appData.speedingLogs.length > 0 && (
                  <span className="ml-1 bg-red-500 text-white px-1.5 py-0.2 rounded-full text-[9px]">
                    {appData.speedingLogs.length}
                  </span>
                )}
              </button>
              <button
                onClick={() => setViewMode(viewMode === 'hud' ? 'record' : 'hud')}
                className={`px-3 py-1 text-xs font-bold rounded-lg transition ${
                  viewMode === 'hud' ? 'bg-red-600 text-white animate-pulse' : 'bg-gray-800 text-yellow-400 border border-yellow-500/30'
                }`}
              >
                {viewMode === 'hud' ? '기록장 닫기' : '안전운행 HUD'}
              </button>
            </div>
          </header>

          {/* 메인 뷰 1: HUD 모드 */}
          {viewMode === 'hud' ? (
            <div className="flex-1 flex flex-col p-4 bg-black justify-between select-none">
              <div className="flex justify-between items-center">
                <button
                  onClick={() => setHudMirrored(!hudMirrored)}
                  className="text-xs px-3 py-1.5 bg-gray-800 text-gray-300 rounded-lg"
                >
                  {hudMirrored ? '미러 모드 켜짐 (HUD)' : '일반 모드'}
                </button>
                {!audioReady ? (
                  <button
                    onClick={initAudioChannel}
                    className="text-xs px-3 py-1.5 bg-indigo-600 text-white rounded-lg font-bold animate-bounce"
                  >
                    🔊 블루투스/음성 켜기
                  </button>
                ) : (
                  <span className="text-xs text-green-400 flex items-center gap-1 font-semibold">
                    <span className="w-2 h-2 bg-green-400 rounded-full animate-ping"></span>
                    음성 알림 활성
                  </span>
                )}
              </div>

              {/* HUD 디스플레이 본체 */}
              <div className={`flex flex-col items-center justify-center my-auto transition-transform ${hudMirrored ? 'hud-mirror' : ''}`}>
                
                {/* 상단 단속 감지 텍스트 */}
                <div className="h-10 flex items-center text-center">
                  {nearestCamera ? (
                    <span className="text-yellow-400 font-bold text-lg animate-pulse-slow">
                      ⚠️ {nearestCamera.distance}m 앞 [{nearestCamera.limitSpeed}km/h] {nearestCamera.desc}
                    </span>
                  ) : (
                    <span className="text-gray-500 text-sm">안전 속도를 준수하십시오</span>
                  )}
                </div>

                {/* 중앙: 대형 제한속도 원형 표지판 & 주행속도 */}
                <div className="flex items-center justify-center gap-6 my-6">
                  <div className="flex flex-col items-center justify-center w-24 h-24 rounded-full border-4 border-red-600 bg-white text-black shadow-2xl flex-shrink-0">
                    <span className="text-[11px] font-black text-red-600 leading-none">제한</span>
                    <span className="text-3xl font-black leading-tight tracking-tight">
                      {nearestCamera ? nearestCamera.limitSpeed : 50}
                    </span>
                    <span className="text-[9px] font-bold text-gray-500 leading-none">km/h</span>
                  </div>

                  <div className="flex items-baseline">
                    <span className={`text-8xl font-black tracking-tighter ${
                      nearestCamera && gpsSpeed > nearestCamera.limitSpeed ? 'text-red-500 animate-bounce' : 'text-green-400'
                    }`}>
                      {gpsSpeed}
                    </span>
                    <span className="text-2xl font-bold ml-2 text-gray-400">km/h</span>
                  </div>
                </div>

                {/* 속도 초과 경고 바 */}
                {nearestCamera && gpsSpeed > nearestCamera.limitSpeed && (
                  <div className="w-full bg-red-600/90 text-white text-center py-1.5 rounded-xl font-bold text-sm">
                    속도 초과! 단속 의심 기록 중 (+{gpsSpeed - nearestCamera.limitSpeed} km/h 초과)
                  </div>
                )}
              </div>

              <div className="text-center text-xs text-gray-600 pb-2">
                카메라 초근접 통과 시 속도 초과분은 [단속 의심 내역]에 자동 저장됩니다.
              </div>
            </div>
          ) : (
            /* 메인 뷰 2: 운행기록장 모드 */
            <div className="flex-1 p-4 space-y-4 overflow-y-auto">
              
              {/* 법인 / 개인 탭 선택 */}
              <div className="grid grid-cols-2 p-1 bg-gray-950 rounded-xl border border-gray-800">
                <button
                  onClick={() => setTab('corporate')}
                  className={`py-2 text-sm font-bold rounded-lg transition ${
                    appData.activeTab === 'corporate'
                      ? 'bg-yellow-500 text-black shadow-md'
                      : 'text-gray-400 hover:text-white'
                  }`}
                >
                  법인 택시
                </button>
                <button
                  onClick={() => setTab('private')}
                  className={`py-2 text-sm font-bold rounded-lg transition ${
                    appData.activeTab === 'private'
                      ? 'bg-yellow-500 text-black shadow-md'
                      : 'text-gray-400 hover:text-white'
                  }`}
                >
                  개인 택시
                </button>
              </div>

              {/* 차량번호 및 기준 설정 카드 */}
              <div className="bg-gray-800/80 p-4 rounded-2xl border border-gray-700/60 space-y-3">
                <div className="flex items-center justify-between">
                  <label className="text-xs text-gray-400 font-semibold">차량 번호</label>
                  <input
                    type="text"
                    placeholder="예: 서울31사 1234"
                    value={appData[appData.activeTab].carNumber}
                    onChange={(e) => handleCarNumberChange(e.target.value)}
                    className="bg-gray-900 border border-gray-700 px-3 py-1 text-sm rounded-lg text-right w-44 font-semibold text-white focus:border-yellow-500 focus:outline-none"
                  />
                </div>

                {appData.activeTab === 'corporate' && (
                  <div className="pt-2 border-t border-gray-700 space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs text-gray-400">기본 사납금 (기사 직접기입)</span>
                      <div className="flex items-center gap-1">
                        <input
                          type="number"
                          value={appData.corporate.baseDeposit}
                          onChange={(e) => handleCorporateConfigChange('baseDeposit', e.target.value)}
                          className="bg-gray-900 border border-gray-700 px-2 py-1 text-xs rounded text-right w-24 text-white"
                        />
                        <span className="text-xs text-gray-400">원</span>
                      </div>
                    </div>
                    <div className="flex items-center justify-between">
                      <span className="text-xs text-gray-400">고정수당 (총매출 합산용)</span>
                      <div className="flex items-center gap-1">
                        <input
                          type="number"
                          value={appData.corporate.fixedIncomes}
                          onChange={(e) => handleCorporateConfigChange('fixedIncomes', e.target.value)}
                          className="bg-gray-900 border border-gray-700 px-2 py-1 text-xs rounded text-right w-24 text-white"
                        />
                        <span className="text-xs text-gray-400">원</span>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* 월 선택 바 */}
              <div className="flex items-center justify-between bg-gray-950 p-2 rounded-xl border border-gray-800">
                <button
                  onClick={() => {
                    const [y, m] = currentYearMonth.split('-').map(Number);
                    const prevDate = new Date(y, m - 2, 1);
                    setCurrentYearMonth(`${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`);
                  }}
                  className="px-3 py-1 bg-gray-800 text-gray-300 rounded-lg text-sm font-bold"
                >
                  ◀
                </button>
                <span className="text-base font-black tracking-wide text-yellow-400">{currentYearMonth} 정산</span>
                <button
                  onClick={() => {
                    const [y, m] = currentYearMonth.split('-').map(Number);
                    const nextDate = new Date(y, m, 1);
                    setCurrentYearMonth(`${nextDate.getFullYear()}-${String(nextDate.getMonth() + 1).padStart(2, '0')}`);
                  }}
                  className="px-3 py-1 bg-gray-800 text-gray-300 rounded-lg text-sm font-bold"
                >
                  ▶
                </button>
              </div>

              {/* 월 정산 요약 카드 */}
              {appData.activeTab === 'corporate' ? (
                /* 법인택시 요약 */
                <div className="bg-gray-800 p-4 rounded-2xl border border-gray-700 space-y-3">
                  <div className="flex justify-between items-center text-xs pb-2 border-b border-gray-700">
                    <span className="text-gray-400">회사 전액 부담 가스비</span>
                    <span className="text-gray-300 font-semibold">{formatMoney(currentMonthStats.totalGasCompany)} (지원)</span>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div className="bg-gray-900/90 p-3 rounded-xl">
                      <span className="text-[11px] text-blue-400 block font-semibold">총매출 + 고정수당</span>
                      <span className="text-base font-bold text-blue-300 block mt-0.5">{formatMoney(currentMonthStats.grossSalary)}</span>
                      <span className="text-[9px] text-gray-500 block">(월급여 산정액)</span>
                    </div>
                    <div className="bg-gray-900/90 p-3 rounded-xl">
                      <span className="text-[11px] text-orange-400 block font-semibold">기타 기사 지출합산</span>
                      <span className="text-base font-bold text-orange-300 block mt-0.5">{formatMoney(currentMonthStats.totalDriverExpense)}</span>
                      <span className="text-[9px] text-gray-500 block">(기사 자부담 경비)</span>
                    </div>
                  </div>

                  <button
                    onClick={() => setShowCorporateNet(!showCorporateNet)}
                    className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold rounded-xl text-xs transition"
                  >
                    {showCorporateNet ? '순수입 숨기기' : '이번 달 실제 순수입 계산 / 확인'}
                  </button>

                  {showCorporateNet && (
                    <div className="bg-indigo-950 border border-indigo-500 p-3 rounded-xl text-center">
                      <span className="text-[11px] text-indigo-300 block">월급여 - 기사 자부담 경비</span>
                      <span className="text-xl font-black text-yellow-300 mt-1 block">
                        {formatMoney(currentMonthStats.netIncome)}
                      </span>
                    </div>
                  )}
                </div>
              ) : (
                /* 개인택시 요약 */
                <div className="bg-gray-800 p-4 rounded-2xl border border-gray-700 space-y-3">
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div className="bg-gray-900 p-2.5 rounded-xl">
                      <span className="text-gray-400 block">총 수입 (카드+현금)</span>
                      <span className="text-sm font-bold text-green-400 mt-1 block">{formatMoney(currentMonthStats.totalRevenue)}</span>
                    </div>
                    <div className="bg-gray-900 p-2.5 rounded-xl">
                      <span className="text-gray-400 block">총 지출 (가스/경비 등)</span>
                      <span className="text-sm font-bold text-red-400 mt-1 block">{formatMoney(currentMonthStats.totalExpense)}</span>
                    </div>
                  </div>

                  <div className="bg-gray-900 p-3 rounded-xl flex items-center justify-between">
                    <div>
                      <span className="text-xs text-gray-400 block">과세표준 소득금액 (순수익)</span>
                      <span className="text-lg font-black text-yellow-400">{formatMoney(currentMonthStats.netIncome)}</span>
                    </div>
                    <button
                      onClick={() => setShowTaxModal(true)}
                      className="px-3 py-2 bg-yellow-500 text-black font-bold rounded-xl text-xs"
                    >
                      세무서 양식 추출
                    </button>
                  </div>
                </div>
              )}

              {/* 일별 기록 입력 영역 */}
              <div className="bg-gray-800/60 p-4 rounded-2xl border border-gray-700/50 space-y-2">
                <div className="flex justify-between items-center mb-1">
                  <span className="text-xs font-bold text-gray-300">일별 운행 기록 입력</span>
                  <span className="text-[11px] text-gray-500">날짜 선택 후 입력</span>
                </div>

                <div className="flex gap-2">
                  <input
                    type="date"
                    value={selectedDate}
                    onChange={(e) => setSelectedDate(e.target.value)}
                    className="bg-gray-900 border border-gray-700 px-3 py-2 rounded-xl text-sm font-semibold flex-1 text-white focus:outline-none"
                  />
                  <button
                    onClick={() => setShowDailyModal(true)}
                    className="px-4 py-2 bg-yellow-500 text-black font-bold text-xs rounded-xl shadow"
                  >
                    기록 작성 / 수정
                  </button>
                </div>

                {(() => {
                  const r = appData[appData.activeTab].records[selectedDate];
                  if (!r) {
                    return <div className="text-xs text-gray-500 pt-1 text-center">등록된 운행 기록이 없습니다.</div>;
                  }
                  if (r.isHoliday) {
                    return <div className="text-xs text-yellow-500 font-bold pt-1 text-center">🌴 [휴무일 지정됨]</div>;
                  }
                  return (
                    <div className="bg-gray-900 p-2.5 rounded-xl text-xs space-y-1 mt-2">
                      <div className="flex justify-between text-gray-300">
                        <span>매출액:</span>
                        <span className="font-bold text-yellow-400">
                          {appData.activeTab === 'corporate'
                            ? formatMoney(r.revenue)
                            : formatMoney(Number(r.cardRev || 0) + Number(r.cashRev || 0))}
                        </span>
                      </div>
                      {r.memo && <div className="text-gray-400 text-[11px]">메모: {r.memo}</div>}
                    </div>
                  );
                })()}
              </div>

              {/* 백업 / 원복 버튼 */}
              <div className="pt-2 flex gap-2">
                <button
                  onClick={exportBackup}
                  className="flex-1 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold rounded-xl text-xs border border-gray-700"
                >
                  데이터 백업 (저장)
                </button>
                <label className="flex-1 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold rounded-xl text-xs border border-gray-700 text-center cursor-pointer">
                  데이터 복원 (열기)
                  <input type="file" accept=".json" onChange={importBackup} className="hidden" />
                </label>
              </div>
            </div>
          )}

          {/* 일별 기록 입력 모달 */}
          {showDailyModal && (
            <DailyRecordModal
              activeTab={appData.activeTab}
              dateKey={selectedDate}
              existingData={appData[appData.activeTab].records[selectedDate] || {}}
              onSave={(data) => handleSaveRecord(selectedDate, data)}
              onClose={() => setShowDailyModal(false)}
            />
          )}

          {/* 개인택시 세무서 제출 텍스트 모달 */}
          {showTaxModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-sm p-5 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold text-yellow-400">세무서 제출 양식 추출</h3>
                  <button onClick={() => setShowTaxModal(false)} className="text-gray-400 text-lg font-bold">✕</button>
                </div>
                <textarea
                  readOnly
                  value={taxReportText}
                  className="w-full h-64 bg-gray-950 text-gray-200 text-xs font-mono p-3 rounded-xl border border-gray-800 focus:outline-none resize-none"
                />
                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(taxReportText);
                      alert('클립보드에 복사되었습니다. 세무사 또는 홈택스 입력 시 활용하세요.');
                    }}
                    className="flex-1 py-2.5 bg-yellow-500 text-black font-bold rounded-xl text-xs"
                  >
                    내용 전체 복사
                  </button>
                  <button
                    onClick={() => setShowTaxModal(false)}
                    className="px-4 py-2.5 bg-gray-800 text-gray-300 font-bold rounded-xl text-xs"
                  >
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 과속 단속 의심 이력 조회 모달 */}
          {showSpeedLogModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-sm p-5 space-y-4 max-h-[85vh] flex flex-col">
                <div className="flex justify-between items-center pb-2 border-b border-gray-800">
                  <div className="flex items-center gap-2">
                    <h3 className="text-sm font-bold text-red-400">과속 단속 의심 이력</h3>
                    <span className="text-xs text-gray-500">({appData.speedingLogs?.length || 0}건)</span>
                  </div>
                  <button onClick={() => setShowSpeedLogModal(false)} className="text-gray-400 text-lg font-bold">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-2.5 pr-1">
                  {(!appData.speedingLogs || appData.speedingLogs.length === 0) ? (
                    <div className="text-center py-10 text-xs text-gray-500">
                      기록된 단속 의심 이력이 없습니다.
                    </div>
                  ) : (
                    appData.speedingLogs.map((log) => (
                      <div key={log.id} className="bg-gray-950 p-3 rounded-xl border border-red-950/80 space-y-1">
                        <div className="flex justify-between items-start">
                          <span className="text-xs font-bold text-gray-200">{log.desc}</span>
                          <button
                            onClick={() => handleDeleteSpeedLog(log.id)}
                            className="text-[10px] text-gray-500 hover:text-red-400 ml-2"
                          >
                            삭제
                          </button>
                        </div>
                        <div className="text-[11px] text-gray-400">{log.timestamp}</div>
                        <div className="flex items-center justify-between pt-1 text-xs">
                          <span className="text-gray-400">제한 {log.limitSpeed}km/h · 통과 <span className="text-white font-bold">{log.passSpeed}km/h</span></span>
                          <span className="text-red-400 font-black">+{log.overSpeed} km/h 초과</span>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {appData.speedingLogs && appData.speedingLogs.length > 0 && (
                  <button
                    onClick={handleClearAllSpeedLogs}
                    className="w-full py-2 bg-red-950/80 hover:bg-red-900 text-red-300 font-bold rounded-xl text-xs border border-red-800"
                  >
                    이력 전체 삭제
                  </button>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- 일별 운행기록 작성 서브 모달 ---
    function DailyRecordModal({ activeTab, dateKey, existingData, onSave, onClose }) {
      const [isHoliday, setIsHoliday] = useState(existingData.isHoliday || false);
      const [memo, setMemo] = useState(existingData.memo || '');

      // 법인 폼 상태
      const [revenue, setRevenue] = useState(existingData.revenue || '');
      const [gas, setGas] = useState(existingData.gas || '');
      const [driverExpense, setDriverExpense] = useState(existingData.driverExpense || '');

      // 개인 폼 상태
      const [cardRev, setCardRev] = useState(existingData.cardRev || '');
      const [cashRev, setCashRev] = useState(existingData.cashRev || '');
      const [privGas, setPrivGas] = useState(existingData.gas || '');
      const [toll, setToll] = useState(existingData.toll || '');
      const [maint, setMaint] = useState(existingData.maint || '');
      const [other, setOther] = useState(existingData.other || '');

      const handleSave = () => {
        if (activeTab === 'corporate') {
          onSave({
            isHoliday,
            memo,
            revenue: Number(revenue) || 0,
            gas: Number(gas) || 0,
            driverExpense: Number(driverExpense) || 0
          });
        } else {
          onSave({
            isHoliday,
            memo,
            cardRev: Number(cardRev) || 0,
            cashRev: Number(cashRev) || 0,
            gas: Number(privGas) || 0,
            toll: Number(toll) || 0,
            maint: Number(maint) || 0,
            other: Number(other) || 0
          });
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-sm p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center pb-2 border-b border-gray-800">
              <h3 className="text-sm font-bold text-yellow-400">{dateKey} 운행기록</h3>
              <button onClick={onClose} className="text-gray-400 font-bold text-lg">✕</button>
            </div>

            <label className="flex items-center gap-2 bg-gray-950 p-2.5 rounded-xl border border-gray-800 cursor-pointer">
              <input
                type="checkbox"
                checked={isHoliday}
                onChange={(e) => setIsHoliday(e.target.checked)}
                className="w-4 h-4 rounded text-yellow-500 focus:ring-0"
              />
              <span className="text-xs font-bold text-gray-300">이 날은 운행하지 않고 휴무했습니다</span>
            </label>

            {!isHoliday && (
              <div className="space-y-3">
                {activeTab === 'corporate' ? (
                  <>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">당일 운행 매출액</label>
                      <input
                        type="number"
                        placeholder="0"
                        value={revenue}
                        onChange={(e) => setRevenue(e.target.value)}
                        className="w-full bg-gray-950 border border-gray-700 p-2 text-sm rounded-xl text-right font-semibold text-white focus:border-yellow-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-blue-400 block mb-1">가스 충전비 (회사부담 참고용)</label>
                      <input
                        type="number"
                        placeholder="0"
                        value={gas}
                        onChange={(e) => setGas(e.target.value)}
                        className="w-full bg-gray-950 border border-gray-700 p-2 text-sm rounded-xl text-right font-semibold text-white focus:border-yellow-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-orange-400 block mb-1">기타 기사부담 경비 (식대/세차/통행료 등)</label>
                      <input
                        type="number"
                        placeholder="0"
                        value={driverExpense}
                        onChange={(e) => setDriverExpense(e.target.value)}
                        className="w-full bg-gray-950 border border-gray-700 p-2 text-sm rounded-xl text-right font-semibold text-white focus:border-yellow-500 focus:outline-none"
                      />
                    </div>
                  </>
                ) : (
                  <>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[11px] text-gray-400 block mb-1">카드/앱 결제 매출</label>
                        <input
                          type="number"
                          placeholder="0"
                          value={cardRev}
                          onChange={(e) => setCardRev(e.target.value)}
                          className="w-full bg-gray-950 border border-gray-700 p-2 text-xs rounded-xl text-right font-semibold text-white"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] text-gray-400 block mb-1">현금 수입 매출</label>
                        <input
                          type="number"
                          placeholder="0"
                          value={cashRev}
                          onChange={(e) => setCashRev(e.target.value)}
                          className="w-full bg-gray-950 border border-gray-700 p-2 text-xs rounded-xl text-right font-semibold text-white"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[11px] text-gray-400 block mb-1">가스 충전비</label>
                        <input
                          type="number"
                          placeholder="0"
                          value={privGas}
                          onChange={(e) => setPrivGas(e.target.value)}
                          className="w-full bg-gray-950 border border-gray-700 p-2 text-xs rounded-xl text-right font-semibold text-white"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] text-gray-400 block mb-1">도로 통행료</label>
                        <input
                          type="number"
                          placeholder="0"
                          value={toll}
                          onChange={(e) => setToll(e.target.value)}
                          className="w-full bg-gray-950 border border-gray-700 p-2 text-xs rounded-xl text-right font-semibold text-white"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[11px] text-gray-400 block mb-1">정비/소모품비</label>
                        <input
                          type="number"
                          placeholder="0"
                          value={maint}
                          onChange={(e) => setMaint(e.target.value)}
                          className="w-full bg-gray-950 border border-gray-700 p-2 text-xs rounded-xl text-right font-semibold text-white"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] text-gray-400 block mb-1">기타 사업경비</label>
                        <input
                          type="number"
                          placeholder="0"
                          value={other}
                          onChange={(e) => setOther(e.target.value)}
                          className="w-full bg-gray-950 border border-gray-700 p-2 text-xs rounded-xl text-right font-semibold text-white"
                        />
                      </div>
                    </div>
                  </>
                )}

                <div>
                  <label className="text-xs text-gray-400 block mb-1">운행 메모</label>
                  <input
                    type="text"
                    placeholder="특이사항 메모"
                    value={memo}
                    onChange={(e) => setMemo(e.target.value)}
                    className="w-full bg-gray-950 border border-gray-700 p-2 text-xs rounded-xl text-white focus:outline-none"
                  />
                </div>
              </div>
            )}

            <div className="flex gap-2 pt-2">
              <button
                onClick={handleSave}
                className="flex-1 py-2.5 bg-yellow-500 text-black font-bold rounded-xl text-xs"
              >
                저장 완료
              </button>
              <button
                onClick={onClose}
                className="px-4 py-2.5 bg-gray-800 text-gray-300 font-bold rounded-xl text-xs"
              >
                취소
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
