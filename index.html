<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>K-TAXI 운행기록장 & 안전운행 HUD</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM (Cloudflare CDN) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone (Cloudflare CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .hud-mirror-landscape {
      transform: scaleY(-1);
    }
    .hud-mirror-portrait-rot {
      transform: rotate(-90deg) scaleY(-1);
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 1.25rem);
    }
    @keyframes blink-red {
      0%, 100% { background-color: rgba(220, 38, 38, 0.15); }
      50% { background-color: rgba(220, 38, 38, 0.45); }
    }
    .animate-overspeed {
      animation: blink-red 0.8s infinite;
    }
  </style>
</head>
<body class="select-none antialiased min-h-screen bg-slate-950">
  <div id="root">
    <div class="min-h-screen flex items-center justify-center text-yellow-400 font-bold text-sm bg-slate-950">
      K-TAXI 시스템 로딩 중...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, Component } = React;

    const APP_VERSION = 'v1.4.0';
    const CURRENT_STORAGE_KEY = 'K_TAXI_RECORD_DATA_V14';

    // --- 통화 및 시간 포맷 유틸리티 ---
    const formatMoney = (val) => {
      const num = Number(String(val).replace(/[^0-9]/g, '')) || 0;
      return num.toLocaleString('ko-KR');
    };

    const formatShortMoney = (val) => {
      const num = Number(val) || 0;
      if (num === 0) return '0';
      if (num >= 10000) {
        return (num / 10000).toFixed(num % 10000 === 0 ? 0 : 1) + '만';
      }
      return (num / 1000).toFixed(0) + '천';
    };

    const getTodayKey = () => {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const getCurrentTimeStr = () => {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    };

    const calculateMinutes = (start, end) => {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let sMin = sh * 60 + sm;
      let eMin = eh * 60 + em;
      if (eMin < sMin) eMin += 24 * 60; // 야간 운행 (자정 넘김)
      return Math.max(0, eMin - sMin);
    };

    const formatMinutesToHours = (totalMins) => {
      if (!totalMins || totalMins <= 0) return '0시간';
      const hours = Math.floor(totalMins / 60);
      const mins = totalMins % 60;
      if (mins === 0) return `${hours}시간`;
      return `${hours}시간 ${mins}분`;
    };

    // 스토리지 기본 스키마
    const DEFAULT_STORAGE = {
      activeType: 'corporate',
      hudSpeedLimit: 50,
      corporate: {
        carNumber: '',
        dailyDeposit: 201000,
        deductionRate: 9.0,
        fixedAllowanceItems: [
          { id: 1, name: '기본급', amount: 1181700 },
          { id: 2, name: '승무수당', amount: 130000 },
          { id: 3, name: '교육수당', amount: 21000 },
          { id: 4, name: '법정휴일수당', amount: 35000 }
        ],
        fixedExpenseItems: [
          { id: 1, name: '노조비', amount: 25000 },
          { id: 2, name: '상조회비', amount: 0 }
        ],
        records: {}
      },
      private: {
        carNumber: '',
        records: {}
      }
    };

    // 데이터 안전 로더
    const loadSafeData = () => {
      try {
        let saved = null;
        for (let i = 15; i >= 1; i--) {
          const raw = localStorage.getItem(`K_TAXI_RECORD_DATA_V${i}`);
          if (raw) { saved = raw; break; }
        }
        if (!saved) saved = localStorage.getItem('K_TAXI_RECORD_DATA');

        if (saved) {
          const p = JSON.parse(saved);
          return {
            activeType: (p.activeType || p.activeTab || 'corporate') === 'private' ? 'private' : 'corporate',
            hudSpeedLimit: Number(p.hudSpeedLimit || 50),
            corporate: {
              carNumber: p.corporate?.carNumber || '',
              dailyDeposit: Number(p.corporate?.dailyDeposit || p.corporate?.baseDeposit || 201000),
              deductionRate: Number(p.corporate?.deductionRate !== undefined ? p.corporate.deductionRate : 9.0),
              fixedAllowanceItems: Array.isArray(p.corporate?.fixedAllowanceItems) && p.corporate.fixedAllowanceItems.length > 0
                ? p.corporate.fixedAllowanceItems
                : DEFAULT_STORAGE.corporate.fixedAllowanceItems,
              fixedExpenseItems: Array.isArray(p.corporate?.fixedExpenseItems)
                ? p.corporate.fixedExpenseItems
                : DEFAULT_STORAGE.corporate.fixedExpenseItems,
              records: p.corporate?.records || {}
            },
            private: {
              carNumber: p.private?.carNumber || '',
              records: p.private?.records || {}
            }
          };
        }
      } catch (e) {
        console.warn('Storage Migration Fallback', e);
      }
      return DEFAULT_STORAGE;
    };

    // 스마트 금액 입력 인풋
    function SmartMoneyInput({ value, onChange, placeholder = "0", className = "", colorClass = "text-white" }) {
      const numVal = Number(value) || 0;
      const displayVal = numVal > 0 ? numVal.toLocaleString('ko-KR') : '';

      return (
        <div className="relative flex items-center w-full">
          {numVal > 0 && (
            <button
              type="button"
              onClick={() => onChange(0)}
              className="absolute left-2 z-10 text-slate-400 hover:text-red-400 bg-slate-800 active:bg-slate-700 rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-black"
              tabIndex={-1}
            >
              ✕
            </button>
          )}
          <input
            type="text"
            inputMode="numeric"
            value={displayVal}
            placeholder={placeholder}
            onFocus={(e) => e.target.select()}
            onChange={(e) => {
              const raw = e.target.value.replace(/[^0-9]/g, '');
              onChange(raw ? Number(raw) : 0);
            }}
            className={`w-full bg-slate-900 border border-slate-700 p-2 text-sm rounded-xl text-right font-bold ${colorClass} focus:border-yellow-500 focus:outline-none ${className}`}
          />
        </div>
      );
    }

    // 메인 App 컴포넌트
    function App() {
      const [appData, setAppData] = useState(loadSafeData);
      const [currentTab, setCurrentTab] = useState('calendar'); // 'calendar' | 'settlement' | 'hud' | 'settings'
      const [selectedDate, setSelectedDate] = useState(getTodayKey());
      const [currentYearMonth, setCurrentYearMonth] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      });

      // 모달 상태
      const [showDailyModal, setShowDailyModal] = useState(false);
      const [showTaxModal, setShowTaxModal] = useState(false);
      const [showFixedAllowanceModal, setShowFixedAllowanceModal] = useState(false);
      const [showFixedExpenseModal, setShowFixedExpenseModal] = useState(false);

      // GPS & HUD 상태
      const [gpsSpeed, setGpsSpeed] = useState(0);
      const [hudMirrorMode, setHudMirrorMode] = useState('normal'); // 'normal' | 'landscape' | 'portrait-rot'
      const SPEED_LIMIT_PRESETS = [30, 50, 60, 70, 80, 100];

      // 스토리지 동기화
      useEffect(() => {
        try {
          localStorage.setItem(CURRENT_STORAGE_KEY, JSON.stringify(appData));
        } catch (e) {
          console.warn('Storage Save Warning', e);
        }
      }, [appData]);

      // GPS 속도 감시
      useEffect(() => {
        if (!navigator.geolocation) return;

        const watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
            setGpsSpeed(speedKmh);
          },
          (err) => console.warn('GPS Info:', err.message),
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 4000 }
        );

        return () => navigator.geolocation.clearWatch(watchId);
      }, []);

      const activeType = appData?.activeType === 'private' ? 'private' : 'corporate';

      const setVehicleType = (type) => {
        setAppData(prev => ({ ...prev, activeType: type }));
      };

      const handleCarNumberChange = (val) => {
        setAppData(prev => ({
          ...prev,
          [activeType]: { ...(prev[activeType] || {}), carNumber: val }
        }));
      };

      const handleCorporateConfigChange = (key, val) => {
        setAppData(prev => ({
          ...prev,
          corporate: { ...(prev.corporate || {}), [key]: Number(val) || 0 }
        }));
      };

      const setHudSpeedLimit = (limit) => {
        setAppData(prev => ({ ...prev, hudSpeedLimit: limit }));
      };

      // 출퇴근 원클릭 버튼 처리
      const handleQuickClock = (type) => { // type: 'start' | 'end'
        const today = getTodayKey();
        const nowTime = getCurrentTimeStr();
        const todayRec = appData[activeType]?.records?.[today] || {};

        let updatedRec = { ...todayRec };
        if (type === 'start') {
          updatedRec.startTime = nowTime;
          if (!updatedRec.endTime) updatedRec.endTime = '';
        } else {
          updatedRec.endTime = nowTime;
          if (!updatedRec.startTime) updatedRec.startTime = nowTime;
        }

        updatedRec.workMinutes = calculateMinutes(updatedRec.startTime, updatedRec.endTime);

        setAppData(prev => ({
          ...prev,
          [activeType]: {
            ...prev[activeType],
            records: {
              ...(prev[activeType]?.records || {}),
              [today]: updatedRec
            }
          }
        }));
      };

      // 일별 기록 저장
      const handleSaveRecord = (dateKey, recordData) => {
        const workMins = calculateMinutes(recordData.startTime, recordData.endTime);
        const finalData = { ...recordData, workMinutes: workMins };

        setAppData(prev => ({
          ...prev,
          [activeType]: {
            ...prev[activeType],
            records: {
              ...(prev[activeType]?.records || {}),
              [dateKey]: finalData
            }
          }
        }));
        setShowDailyModal(false);
      };

      const handleDeleteDailyRecord = (dateKey) => {
        if (!confirm(`${dateKey} 기록을 삭제하시겠습니까?`)) return;
        const updatedRecords = { ...(appData[activeType]?.records || {}) };
        delete updatedRecords[dateKey];
        setAppData(prev => ({
          ...prev,
          [activeType]: { ...prev[activeType], records: updatedRecords }
        }));
      };

      // 수당 & 고정비
      const totalFixedAllowances = useMemo(() => {
        const items = appData?.corporate?.fixedAllowanceItems || [];
        return items.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [appData?.corporate?.fixedAllowanceItems]);

      const totalFixedExpenses = useMemo(() => {
        const items = appData?.corporate?.fixedExpenseItems || [];
        return items.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [appData?.corporate?.fixedExpenseItems]);

      // 월별 정산 및 근무시간 통계
      const currentMonthStats = useMemo(() => {
        const records = appData[activeType]?.records || {};
        const entries = Object.entries(records).filter(([date]) => date && String(date).startsWith(currentYearMonth));

        let workDays = 0;
        let holidayDays = 0;
        let totalWorkMinutes = 0;

        if (activeType === 'corporate') {
          const dailyDeposit = Number(appData.corporate?.dailyDeposit || 201000);
          const deductionRate = Number(appData.corporate?.deductionRate !== undefined ? appData.corporate.deductionRate : 9.0) / 100;

          let totalRevenue = 0;
          let totalGasCompany = 0;
          let totalDriverExpense = 0;
          let totalIncentive = 0;

          entries.forEach(([_, r]) => {
            if (r?.isHoliday) {
              holidayDays++;
            } else {
              workDays++;
              const rev = Number(r?.revenue || 0);
              totalRevenue += rev;
              totalGasCompany += Number(r?.gas || 0);
              totalDriverExpense += Number(r?.driverExpense || 0);
              totalWorkMinutes += Number(r?.workMinutes || 0);

              const dailyOver = Math.max(0, rev - dailyDeposit);
              totalIncentive += Math.round(dailyOver * 0.7);
            }
          });

          const grossSalary = totalFixedAllowances + totalIncentive;
          const taxAndInsurance = Math.round(grossSalary * deductionRate);
          const totalDeductions = taxAndInsurance + totalFixedExpenses;
          const netSalaryFromCompany = grossSalary - totalDeductions;
          const finalNetIncome = netSalaryFromCompany - totalDriverExpense;

          return {
            workDays,
            holidayDays,
            totalWorkMinutes,
            dailyDeposit,
            totalFixedAllowances,
            totalRevenue,
            totalGasCompany,
            totalIncentive,
            grossSalary,
            taxAndInsurance,
            totalFixedExpenses,
            totalDeductions,
            netSalaryFromCompany,
            totalDriverExpense,
            finalNetIncome
          };
        } else {
          let cardTotal = 0;
          let cashTotal = 0;
          let gasTotal = 0;
          let tollTotal = 0;
          let maintTotal = 0;
          let otherTotal = 0;

          entries.forEach(([_, r]) => {
            if (r?.isHoliday) {
              holidayDays++;
            } else {
              workDays++;
              cardTotal += Number(r?.cardRev || 0);
              cashTotal += Number(r?.cashRev || 0);
              gasTotal += Number(r?.gas || 0);
              tollTotal += Number(r?.toll || 0);
              maintTotal += Number(r?.maint || 0);
              otherTotal += Number(r?.other || 0);
              totalWorkMinutes += Number(r?.workMinutes || 0);
            }
          });

          const totalRevenue = cardTotal + cashTotal;
          const totalExpense = gasTotal + tollTotal + maintTotal + otherTotal;
          const netIncome = totalRevenue - totalExpense;

          return {
            workDays,
            holidayDays,
            totalWorkMinutes,
            cardTotal,
            cashTotal,
            totalRevenue,
            gasTotal,
            tollTotal,
            maintTotal,
            otherTotal,
            totalExpense,
            netIncome
          };
        }
      }, [appData, activeType, currentYearMonth, totalFixedAllowances, totalFixedExpenses]);

      // 달력 날짜 셀
      const calendarCells = useMemo(() => {
        const [y, m] = currentYearMonth.split('-').map(Number);
        const firstDayWeekIndex = new Date(y, m - 1, 1).getDay();
        const totalDaysInMonth = new Date(y, m, 0).getDate();

        const cells = [];
        for (let i = 0; i < firstDayWeekIndex; i++) cells.push(null);
        for (let d = 1; d <= totalDaysInMonth; d++) {
          const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          cells.push(dateStr);
        }
        return cells;
      }, [currentYearMonth]);

      // 오늘 출퇴근 상태
      const todayRecord = appData[activeType]?.records?.[getTodayKey()] || {};

      const openModalForDate = (dateStr) => {
        setSelectedDate(dateStr);
        setShowDailyModal(true);
      };

      const isOverSpeed = gpsSpeed > (appData.hudSpeedLimit || 50);

      const currentRecords = appData[activeType]?.records || {};
      const sortedMonthEntries = Object.entries(currentRecords)
        .filter(([date]) => date && String(date).startsWith(currentYearMonth))
        .sort(([a], [b]) => a.localeCompare(b));

      return (
        <div className="max-w-md mx-auto w-full min-h-screen flex flex-col bg-slate-950 border-x border-slate-800 relative">
          
          {/* 상단 헤더 */}
          <header className="p-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between sticky top-0 z-30">
            <div className="flex items-center gap-2">
              <span className="bg-yellow-500 text-black text-[11px] font-black px-2 py-0.5 rounded shadow">K-TAXI</span>
              <span className="text-sm font-bold text-white tracking-tight truncate max-w-[130px]">
                {appData[activeType]?.carNumber || (activeType === 'corporate' ? '법인택시' : '개인택시')}
              </span>
            </div>

            <div className="flex bg-slate-950 p-0.5 rounded-lg border border-slate-800">
              <button
                onClick={() => setVehicleType('corporate')}
                className={`px-2.5 py-1 text-xs font-bold rounded-md transition ${
                  activeType === 'corporate' ? 'bg-yellow-500 text-black shadow' : 'text-slate-400'
                }`}
              >
                법인
              </button>
              <button
                onClick={() => setVehicleType('private')}
                className={`px-2.5 py-1 text-xs font-bold rounded-md transition ${
                  activeType === 'private' ? 'bg-yellow-500 text-black shadow' : 'text-slate-400'
                }`}
              >
                개인
              </button>
            </div>
          </header>

          {/* 메인 뷰 */}
          <main className="flex-1 p-3 pb-24 overflow-y-auto">
            
            {/* 탭 1: 운행일지 & 달력 */}
            {currentTab === 'calendar' && (
              <div className="space-y-3">
                
                {/* 원터치 출퇴근 카드 */}
                <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800 flex items-center justify-between shadow-sm">
                  <div className="space-y-0.5">
                    <span className="text-[11px] text-slate-400 font-bold block">오늘의 근무 기록</span>
                    <div className="text-xs text-slate-200">
                      출근 <span className="text-yellow-400 font-bold">{todayRecord.startTime || '--:--'}</span> ~ 퇴근 <span className="text-yellow-400 font-bold">{todayRecord.endTime || '--:--'}</span>
                      {todayRecord.workMinutes > 0 && (
                        <span className="ml-1.5 text-[11px] text-green-400 font-bold">({formatMinutesToHours(todayRecord.workMinutes)})</span>
                      )}
                    </div>
                  </div>
                  <div className="flex gap-1.5">
                    <button
                      onClick={() => handleQuickClock('start')}
                      className="px-2.5 py-1.5 bg-blue-600 active:bg-blue-500 text-white font-bold text-xs rounded-xl shadow"
                    >
                      출근
                    </button>
                    <button
                      onClick={() => handleQuickClock('end')}
                      className="px-2.5 py-1.5 bg-orange-600 active:bg-orange-500 text-white font-bold text-xs rounded-xl shadow"
                    >
                      퇴근
                    </button>
                  </div>
                </div>

                {/* 월 선택 바 */}
                <div className="bg-slate-900 p-2.5 rounded-2xl border border-slate-800 flex items-center justify-between shadow-sm">
                  <button
                    onClick={() => {
                      const [y, m] = currentYearMonth.split('-').map(Number);
                      const prevDate = new Date(y, m - 2, 1);
                      setCurrentYearMonth(`${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`);
                    }}
                    className="w-8 h-8 flex items-center justify-center bg-slate-800 active:bg-slate-700 rounded-xl text-slate-300 font-bold"
                  >
                    ◀
                  </button>
                  <div className="text-center">
                    <span className="text-base font-black text-yellow-400">{currentYearMonth}</span>
                    <div className="text-[11px] text-slate-400 font-medium">
                      {currentMonthStats.workDays}일 운행 / 총 {formatMinutesToHours(currentMonthStats.totalWorkMinutes)}
                    </div>
                  </div>
                  <button
                    onClick={() => {
                      const [y, m] = currentYearMonth.split('-').map(Number);
                      const nextDate = new Date(y, m, 1);
                      setCurrentYearMonth(`${nextDate.getFullYear()}-${String(nextDate.getMonth() + 1).padStart(2, '0')}`);
                    }}
                    className="w-8 h-8 flex items-center justify-center bg-slate-800 active:bg-slate-700 rounded-xl text-slate-300 font-bold"
                  >
                    ▶
                  </button>
                </div>

                {/* 요약 카드 */}
                <div className="grid grid-cols-2 gap-2">
                  <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800">
                    <span className="text-[11px] text-slate-400 block font-semibold">이번 달 총 매출</span>
                    <span className="text-base font-black text-yellow-400 block mt-0.5">
                      {formatMoney(currentMonthStats.totalRevenue)}
                    </span>
                  </div>
                  <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800">
                    <span className="text-[11px] text-green-400 block font-semibold">
                      {activeType === 'corporate' ? '통장 예상 월급' : '과세 소득금액'}
                    </span>
                    <span className="text-base font-black text-green-400 block mt-0.5">
                      {activeType === 'corporate'
                        ? formatMoney(currentMonthStats.netSalaryFromCompany)
                        : formatMoney(currentMonthStats.netIncome)}
                    </span>
                  </div>
                </div>

                {/* 달력 */}
                <div className="bg-slate-900/90 p-3 rounded-2xl border border-slate-800">
                  <div className="grid grid-cols-7 text-center text-[11px] font-bold text-slate-400 pb-2 border-b border-slate-800 mb-2">
                    <span className="text-red-400">일</span>
                    <span>월</span>
                    <span>화</span>
                    <span>수</span>
                    <span>목</span>
                    <span>금</span>
                    <span className="text-blue-400">토</span>
                  </div>

                  <div className="grid grid-cols-7 gap-1">
                    {calendarCells.map((dateStr, idx) => {
                      if (!dateStr) return <div key={`empty-${idx}`} className="h-12 rounded-lg bg-transparent"></div>;
                      const dayNum = Number(dateStr.split('-')[2]);
                      const rec = currentRecords[dateStr];
                      const isSelected = selectedDate === dateStr;

                      return (
                        <button
                          key={dateStr}
                          onClick={() => openModalForDate(dateStr)}
                          className={`h-12 p-1 rounded-xl flex flex-col justify-between items-start text-left border transition active:scale-95 ${
                            isSelected
                              ? 'border-yellow-400 bg-yellow-500/20'
                              : rec
                              ? 'border-slate-700 bg-slate-950/80 hover:border-slate-600'
                              : 'border-slate-800/60 bg-slate-950/30'
                          }`}
                        >
                          <span className={`text-[10px] font-bold ${

                        value={item.name}
                        onChange={(e) => {
                          const updated = (appData.corporate?.fixedExpenseItems || []).map(it => it.id === item.id ? { ...it, name: e.target.value } : it);
                          setAppData(prev => ({ ...prev, corporate: { ...prev.corporate, fixedExpenseItems: updated } }));
                        }}
                        className="bg-slate-900 border border-slate-700 px-2 py-1 text-xs rounded-lg text-white w-20 font-bold"
                      />
                      <div className="flex-1">
                        <SmartMoneyInput
                          value={item.amount}
                          onChange={(val) => {
                            const updated = (appData.corporate?.fixedExpenseItems || []).map(it => it.id === item.id ? { ...it, amount: Number(val) } : it);
                            setAppData(prev => ({ ...prev, corporate: { ...prev.corporate, fixedExpenseItems: updated } }));
                          }}
                          colorClass="text-orange-400"
                        />
                      </div>
                    </div>
                  ))}
                </div>
                <button onClick={() => setShowFixedExpenseModal(false)} className="w-full py-2 bg-yellow-500 text-black font-bold rounded-xl text-xs">완료</button>
              </div>
            </div>
          )}

          {/* 세무서 양식 모달 */}
          {showTaxModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="text-xs font-bold text-yellow-400">세무서 제출 양식</h3>
                  <button onClick={() => setShowTaxModal(false)} className="text-slate-400 text-base font-bold">✕</button>
                </div>
                <textarea
                  readOnly
                  value={`[세무서 제출용 간편 소득 요약서]\n귀속기간: ${currentYearMonth}\n차량번호: ${appData.private?.carNumber || '미등록'}\n매출합계: ${formatMoney(currentMonthStats.totalRevenue)}\n경비합계: ${formatMoney(currentMonthStats.totalExpense)}\n과세소득: ${formatMoney(currentMonthStats.netIncome)}`}
                  className="w-full h-44 bg-slate-950 text-slate-200 text-xs font-mono p-2.5 rounded-xl border border-slate-800 resize-none focus:outline-none"
                />
                <button
                  onClick={() => {
                    navigator.clipboard.writeText(`[세무서 제출용 간편 소득 요약서]\n귀속기간: ${currentYearMonth}\n차량번호: ${appData.private?.carNumber || '미등록'}\n매출합계: ${formatMoney(currentMonthStats.totalRevenue)}\n경비합계: ${formatMoney(currentMonthStats.totalExpense)}\n과세소득: ${formatMoney(currentMonthStats.netIncome)}`);
                    alert('복사되었습니다.');
                  }}
                  className="w-full py-2.5 bg-yellow-500 text-black font-bold rounded-xl text-xs"
                >
                  내용 전체 복사
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 일별 기록 모달 (출퇴근 시간 입력 포함)
    function DailyRecordModal({ activeType, dateKey, existingData, onSave, onClose }) {
      const [isHoliday, setIsHoliday] = useState(existingData?.isHoliday || false);
      const [memo, setMemo] = useState(existingData?.memo || '');
      const [startTime, setStartTime] = useState(existingData?.startTime || '');
      const [endTime, setEndTime] = useState(existingData?.endTime || '');

      const [revenue, setRevenue] = useState(existingData?.revenue || 0);
      const [gas, setGas] = useState(existingData?.gas || 0);
      const [driverExpense, setDriverExpense] = useState(existingData?.driverExpense || 0);

      const [cardRev, setCardRev] = useState(existingData?.cardRev || 0);
      const [cashRev, setCashRev] = useState(existingData?.cashRev || 0);
      const [privGas, setPrivGas] = useState(existingData?.gas || 0);
      const [toll, setToll] = useState(existingData?.toll || 0);
      const [maint, setMaint] = useState(existingData?.maint || 0);
      const [other, setOther] = useState(existingData?.other || 0);

      const calculatedMins = calculateMinutes(startTime, endTime);

      const handleSave = () => {
        const base = { isHoliday, memo, startTime, endTime, workMinutes: calculatedMins };
        if (activeType === 'corporate') {
          onSave({
            ...base,
            revenue: Number(revenue) || 0,
            gas: Number(gas) || 0,
            driverExpense: Number(driverExpense) || 0
          });
        } else {
          onSave({
            ...base,
            cardRev: Number(cardRev) || 0,
            cashRev: Number(cashRev) || 0,
            gas: Number(privGas) || 0,
            toll: Number(toll) || 0,
            maint: Number(maint) || 0,
            other: Number(other) || 0
          });
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center pb-2 border-b border-slate-800">
              <h3 className="text-xs font-bold text-yellow-400">{dateKey} 운행 기록</h3>
              <button onClick={onClose} className="text-slate-400 font-bold text-base">✕</button>
            </div>

            <label className="flex items-center gap-2 bg-slate-950 p-2.5 rounded-xl border border-slate-800 cursor-pointer">
              <input
                type="checkbox"
                checked={isHoliday}
                onChange={(e) => setIsHoliday(e.target.checked)}
                className="w-4 h-4 rounded text-yellow-500 focus:ring-0"
              />
              <span className="text-xs font-bold text-slate-300">이 날은 휴무했습니다 (미운행)</span>
            </label>

            {!isHoliday && (
              <div className="space-y-2.5">
                {/* 출퇴근 시간 입력 영역 */}
                <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 space-y-1.5">
                  <div className="flex justify-between items-center">
                    <span className="text-[11px] font-bold text-slate-300">근무 시간 (출·퇴근)</span>
                    {calculatedMins > 0 && (
                      <span className="text-[11px] font-bold text-blue-400">{formatMinutesToHours(calculatedMins)}</span>
                    )}
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] text-slate-400 block mb-0.5">출근 시간</label>
                      <input
                        type="time"
                        value={startTime}
                        onChange={(e) => setStartTime(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 p-1.5 rounded-lg text-xs text-white text-center font-bold focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-400 block mb-0.5">퇴근 시간</label>
                      <input
                        type="time"
                        value={endTime}
                        onChange={(e) => setEndTime(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 p-1.5 rounded-lg text-xs text-white text-center font-bold focus:outline-none"
                      />
                    </div>
                  </div>
                </div>

                {activeType === 'corporate' ? (
                  <>
                    <div>
                      <label className="text-[11px] text-slate-400 block mb-1">당일 운행 총매출액</label>
                      <SmartMoneyInput value={revenue} onChange={setRevenue} colorClass="text-yellow-400" />
                    </div>
                    <div>
                      <label className="text-[11px] text-blue-400 block mb-1">가스 충전비 (회사부담 참고)</label>
                      <SmartMoneyInput value={gas} onChange={setGas} colorClass="text-blue-300" />
                    </div>
                    <div>
                      <label className="text-[11px] text-orange-400 block mb-1">기타 기사경비 (식대/세차 등)</label>
                      <SmartMoneyInput value={driverExpense} onChange={setDriverExpense} colorClass="text-orange-300" />
                    </div>
                  </>
                ) : (
                  <>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[10px] text-slate-400 block mb-1">카드/앱 매출</label>
                        <SmartMoneyInput value={cardRev} onChange={setCardRev} />
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 block mb-1">현금 수입</label>
                        <SmartMoneyInput value={cashRev} onChange={setCashRev} />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[10px] text-slate-400 block mb-1">가스비</label>
                        <SmartMoneyInput value={privGas} onChange={setPrivGas} />
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 block mb-1">통행료</label>
                        <SmartMoneyInput value={toll} onChange={setToll} />
                      </div>
                    </div>
                  </>
                )}

                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">운행 메모</label>
                  <input
                    type="text"
                    placeholder="특이사항 메모"
                    value={memo}
                    onChange={(e) => setMemo(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 p-2 text-xs rounded-xl text-white focus:outline-none"
                  />
                </div>
              </div>
            )}

            <div className="flex gap-2 pt-2">
              <button onClick={handleSave} className="flex-1 py-2.5 bg-yellow-500 text-black font-bold rounded-xl text-xs">
                저장 완료
              </button>
              <button onClick={onClose} className="px-4 py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">
                취소
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Error Boundary 보호막
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("K-TAXI Runtime Error Caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-6 text-center">
              <div className="bg-slate-900 border border-red-500/40 p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl">
                <div className="w-12 h-12 rounded-2xl bg-red-950/80 border border-red-500/40 flex items-center justify-center mx-auto text-2xl">
                  🛡️
                </div>
                <div>
                  <h2 className="text-base font-bold text-red-400">데이터 안전 보호 모드</h2>
                  <p className="text-xs text-slate-400 mt-1.5 leading-relaxed">
                    시스템이 안전하게 업데이트되었습니다. 기존 운행 기록은 보존되어 있습니다.
                  </p>
                </div>
                <button
                  onClick={() => window.location.reload()}
                  className="w-full py-2.5 bg-yellow-500 text-black font-bold text-xs rounded-xl shadow"
                >
                  화면 새로고침 (정상 복구)
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
