  <meta charset="UTF-8" />

  <title>K-TAXI 운행기록장 & 안전운행 HUD</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM (Cloudflare CDN) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <style>
    html, body {

      padding: 0;

      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animate-pulse-slow {
      animation: pulse-slow 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .hud-mirror {
      transform: scaleY(-1);

      padding-bottom: env(safe-area-inset-bottom, 1.25rem);

</head>
<body class="select-none antialiased min-h-screen bg-slate-950">
  <div id="root">
    <div class="min-h-screen flex items-center justify-center text-yellow-400 font-bold text-sm bg-slate-950">
      K-TAXI 시스템 로딩 중...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- 통화 포맷 유틸리티 ---
    const formatMoney = (val) => {
      const num = Number(String(val).replace(/[^0-9]/g, '')) || 0;
      return num.toLocaleString('ko-KR');
    };

    const parseMoneyInput = (val) => {
      return Number(String(val).replace(/[^0-9]/g, '')) || 0;
    };

    const formatShortMoney = (val) => {
      const num = Number(val) || 0;
      if (num === 0) return '0';
      if (num >= 10000) {
        return (num / 10000).toFixed(num % 10000 === 0 ? 0 : 1) + '만';
      }
      return (num / 1000).toFixed(0) + '천';
    };

    const getTodayKey = () => {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const getNowTimestamp = () => {
      const now = new Date();
      const date = getTodayKey();
      const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      return `${date} ${time}`;
    };

    // 하버사인 거리 계산
    const getDistanceMeters = (lat1, lon1, lat2, lon2) => {
      const R = 6371e3;
      const φ1 = (lat1 * Math.PI) / 180;
      const φ2 = (lat2 * Math.PI) / 180;
      const Δφ = ((lat2 - lat1) * Math.PI) / 180;
      const Δλ = ((lon2 - lon1) * Math.PI) / 180;

      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    };

    // --- 확장된 단속 카메라 DB (천안·아산 및 주요 간선도로 실좌표 내장) ---

      { id: 102, lat: 36.8198, lon: 127.1565, limitSpeed: 50, desc: '신부동 천안종합터미널앞 단속' },
      { id: 103, lat: 36.8322, lon: 127.1488, limitSpeed: 50, desc: '두정역입구 교차로 신호과속' },
      { id: 104, lat: 36.8285, lon: 127.1235, limitSpeed: 60, desc: '백석동 백석사거리 신호단속' },

      { id: 108, lat: 36.8455, lon: 127.1355, limitSpeed: 50, desc: '성성동 업성수변로 과속단속' },
      
      // 천안 스쿨존 (어린이보호구역 30km/h)
      { id: 109, lat: 36.7925, lon: 127.1185, limitSpeed: 30, desc: '쌍용초/나사렛대 스쿨존 단속' },
      { id: 110, lat: 36.8145, lon: 127.1125, limitSpeed: 30, desc: '불당초교앞 어린이보호구역' },
      { id: 111, lat: 36.8215, lon: 127.1355, limitSpeed: 30, desc: '성정초교앞 스쿨존 단속' },
      { id: 112, lat: 36.7845, lon: 127.1485, limitSpeed: 30, desc: '청수초교앞 어린이보호구역' },

      // 아산 도심 및 탕정/배방권
      { id: 201, lat: 36.7845, lon: 127.0041, limitSpeed: 50, desc: '아산시청앞 교차로 신호단속' },
      { id: 202, lat: 36.7802, lon: 127.0045, limitSpeed: 50, desc: '온양온천역 광장앞 신호단속' },
      { id: 203, lat: 36.7775, lon: 127.0525, limitSpeed: 50, desc: '배방역삼거리 모산로 단속' },
      { id: 204, lat: 36.8105, lon: 127.0625, limitSpeed: 60, desc: '탕정 디스플레이시티대로 단속' },

      // 아산 스쿨존 (어린이보호구역 30km/h)
      { id: 209, lat: 36.7985, lon: 127.0555, limitSpeed: 30, desc: '탕정초교앞 어린이보호구역' },
      { id: 210, lat: 36.7725, lon: 127.0185, limitSpeed: 30, desc: '온양초교앞 스쿨존 단속' },
      { id: 211, lat: 36.7745, lon: 127.0585, limitSpeed: 30, desc: '배방초교앞 어린이보호구역' },

      // 천안-아산 주요 국도 및 자동차전용도로
      { id: 301, lat: 36.7825, lon: 127.1215, limitSpeed: 60, desc: '21번국도 신방삼거리 단속' },
      { id: 302, lat: 36.7615, lon: 126.9855, limitSpeed: 70, desc: '21번국도 장존교차로 단속' },
      { id: 303, lat: 36.7755, lon: 127.1685, limitSpeed: 70, desc: '남부대로 유량교차로 과속단속' },
      { id: 304, lat: 36.8725, lon: 127.1515, limitSpeed: 70, desc: '1번국도 직산사거리 단속' },
      { id: 305, lat: 36.8355, lon: 127.0355, limitSpeed: 80, desc: '43번국도 세종평택로 진입로' },

      // 서울/수도권 주요 랜드마크 샘플
      { id: 401, lat: 37.5665, lon: 126.9780, limitSpeed: 50, desc: '서울시청앞 신호·과속 단속' },
      { id: 402, lat: 37.4979, lon: 127.0276, limitSpeed: 50, desc: '강남역교차로 과속단속' },
      { id: 403, lat: 37.5172, lon: 127.0473, limitSpeed: 60, desc: '봉은사로 신호·과속 단속' }
    ];

    // 스토리지 표준 기본값
    const DEFAULT_STORAGE = {
      activeType: 'corporate',
      corporate: {
        carNumber: '',
        dailyDeposit: 201000,
        deductionRate: 9.0,
        fixedAllowanceItems: [
          { id: 1, name: '기본급', amount: 1181700 },
          { id: 2, name: '승무수당', amount: 130000 },
          { id: 3, name: '교육수당', amount: 21000 },
          { id: 4, name: '법정휴일수당', amount: 35000 }
        ],
        fixedExpenseItems: [
          { id: 1, name: '노조비', amount: 25000 },
          { id: 2, name: '상조회비', amount: 0 }
        ],
        records: {}
      },
      private: {
        carNumber: '',
        records: {}
      },
      speedingLogs: []
    };

    // 안전 데이터 로더 (기존 저장 데이터 마이그레이션)
    const loadSafeData = () => {
      try {
        let saved = null;
        for (let i = 15; i >= 1; i--) {
          const raw = localStorage.getItem(`K_TAXI_RECORD_DATA_V${i}`);
          if (raw) { saved = raw; break; }
        }
        if (!saved) saved = localStorage.getItem('K_TAXI_RECORD_DATA_V12');

        if (saved) {
          const p = JSON.parse(saved);
          return {
            activeType: (p.activeType || p.activeTab || 'corporate') === 'private' ? 'private' : 'corporate',
            corporate: {
              carNumber: p.corporate?.carNumber || '',
              dailyDeposit: Number(p.corporate?.dailyDeposit || p.corporate?.baseDeposit || 201000),
              deductionRate: Number(p.corporate?.deductionRate || 9.0),
              fixedAllowanceItems: Array.isArray(p.corporate?.fixedAllowanceItems) && p.corporate.fixedAllowanceItems.length > 0
                ? p.corporate.fixedAllowanceItems
                : DEFAULT_STORAGE.corporate.fixedAllowanceItems,
              fixedExpenseItems: Array.isArray(p.corporate?.fixedExpenseItems)
                ? p.corporate.fixedExpenseItems
                : DEFAULT_STORAGE.corporate.fixedExpenseItems,
              records: p.corporate?.records || {}
            },
            private: {
              carNumber: p.private?.carNumber || '',
              records: p.private?.records || {}
            },
            speedingLogs: Array.isArray(p.speedingLogs) ? p.speedingLogs : []
          };
        }
      } catch (e) {
        console.warn('Storage fallback', e);
      }
      return DEFAULT_STORAGE;
    };

    // 스마트 금액 입력 인풋
    function SmartMoneyInput({ value, onChange, placeholder = "0", className = "", colorClass = "text-white" }) {
      const numVal = Number(value) || 0;
      const displayVal = numVal > 0 ? numVal.toLocaleString('ko-KR') : '';

      return (
        <div className="relative flex items-center w-full">
          {numVal > 0 && (
            <button
              type="button"
              onClick={() => onChange(0)}
              className="absolute left-2 z-10 text-slate-400 hover:text-red-400 bg-slate-800 active:bg-slate-700 rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-black"
              tabIndex={-1}
            >
              ✕
            </button>
          )}
          <input
            type="text"
            inputMode="numeric"
            value={displayVal}
            placeholder={placeholder}
            onFocus={(e) => e.target.select()}
            onChange={(e) => {
              const raw = e.target.value.replace(/[^0-9]/g, '');
              onChange(raw ? Number(raw) : 0);
            }}
            className={`w-full bg-slate-900 border border-slate-700 p-2 text-sm rounded-xl text-right font-bold ${colorClass} focus:border-yellow-500 focus:outline-none ${className}`}
          />
        </div>
      );
    }

    function App() {
      const [appData, setAppData] = useState(loadSafeData);
      const [currentTab, setCurrentTab] = useState('calendar'); // 'calendar' | 'settlement' | 'hud' | 'settings'
      const [selectedDate, setSelectedDate] = useState(getTodayKey());
      const [currentYearMonth, setCurrentYearMonth] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      });

      // 모달 상태
      const [showDailyModal, setShowDailyModal] = useState(false);
      const [showTaxModal, setShowTaxModal] = useState(false);
      const [showSpeedLogModal, setShowSpeedLogModal] = useState(false);
      const [showFixedAllowanceModal, setShowFixedAllowanceModal] = useState(false);
      const [showFixedExpenseModal, setShowFixedExpenseModal] = useState(false);

      // GPS & HUD 상태
      const [gpsSpeed, setGpsSpeed] = useState(0);
      const [nearestCamera, setNearestCamera] = useState(null);
      const [hudMirrored, setHudMirrored] = useState(false);
      const [audioReady, setAudioReady] = useState(false);
      
      const lastAlertedCamRef = useRef(null);
      const lastLoggedCamRef = useRef(null);

      // 스토리지 동기화
      useEffect(() => {
        try {
          localStorage.setItem('K_TAXI_RECORD_DATA_V12', JSON.stringify(appData));
        } catch (e) {
          console.warn('Storage Save Warning', e);
        }
      }, [appData]);

      // TTS 발화
      const speak = (text) => {
        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ko-KR';
          utterance.rate = 1.05;
          utterance.pitch = 1.0;
          utterance.volume = 1.0;

          const voices = window.speechSynthesis.getVoices();
          const koVoice = voices.find(v => v.lang.includes('ko'));
          if (koVoice) utterance.voice = koVoice;

          window.speechSynthesis.speak(utterance);
        } catch (e) {
          console.warn('TTS Error', e);
        }
      };

      const initAudioChannel = () => {
        if ('speechSynthesis' in window) {
          try {
            const dummy = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(dummy);
            setAudioReady(true);
            speak('안전운행 음성 안내가 활성화되었습니다.');
          } catch (e) {
            setAudioReady(true);
          }
        }
      };

      // GPS 감시 및 고속 반경 연산 필터링
      useEffect(() => {
        if (!navigator.geolocation) return;

        const watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
            setGpsSpeed(speedKmh);

            const userLat = pos.coords.latitude;
            const userLon = pos.coords.longitude;

            let closest = null;
            let minDist = Infinity;

            // 1차 반경(0.01도, 약 1.1km) 거친 필터링 후 정밀 하버사인 계산 (연산 최적화)
            ENFORCEMENT_CAMERAS.forEach((cam) => {
              if (Math.abs(userLat - cam.lat) < 0.015 && Math.abs(userLon - cam.lon) < 0.015) {
                const dist = getDistanceMeters(userLat, userLon, cam.lat, cam.lon);
                if (dist < 600 && dist < minDist) {
                  minDist = Math.round(dist);
                  closest = { ...cam, distance: minDist };
                }
              }
            });

            setNearestCamera(closest);

            if (closest) {
              if (closest.distance <= 300 && closest.distance > 60 && lastAlertedCamRef.current !== `${closest.id}-300`) {
                speak(`전방 300미터 앞 제한속도 ${closest.limitSpeed}킬로미터 단속 구간입니다.`);
                lastAlertedCamRef.current = `${closest.id}-300`;
              } else if (closest.distance > 300 && closest.distance <= 500 && lastAlertedCamRef.current !== `${closest.id}-500`) {
                speak(`전방에 ${closest.limitSpeed}킬로미터 단속 카메라가 있습니다.`);
                lastAlertedCamRef.current = `${closest.id}-500`;
              }

              // 단속 지점 통과 시 과속 감지 자동 기록
              if (closest.distance <= 45 && speedKmh > closest.limitSpeed) {
                if (lastLoggedCamRef.current !== closest.id) {
                  const overKm = speedKmh - closest.limitSpeed;
                  const newLog = {
                    id: Date.now(),
                    timestamp: getNowTimestamp(),
                    desc: closest.desc,
                    limitSpeed: closest.limitSpeed,
                    passSpeed: speedKmh,
                    overSpeed: overKm
                  };

                  setAppData(prev => ({
                    ...prev,
                    speedingLogs: [newLog, ...(prev.speedingLogs || [])]
                  }));

                  speak(`제한속도 ${overKm}킬로미터 초과! 단속 의심 내역에 기록되었습니다.`);
                  lastLoggedCamRef.current = closest.id;
                }
              }
            } else {
              lastAlertedCamRef.current = null;
              lastLoggedCamRef.current = null;
            }
          },
          (err) => console.warn('GPS Info:', err.message),
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
        );

        return () => navigator.geolocation.clearWatch(watchId);
      }, []);

      const activeType = appData?.activeType === 'private' ? 'private' : 'corporate';

      const setVehicleType = (type) => {
        setAppData(prev => ({ ...prev, activeType: type }));
      };

      const handleCarNumberChange = (val) => {
        setAppData(prev => ({
          ...prev,
          [activeType]: { ...(prev[activeType] || {}), carNumber: val }
        }));
      };

      const handleCorporateConfigChange = (key, val) => {
        setAppData(prev => ({
          ...prev,
          corporate: { ...(prev.corporate || {}), [key]: Number(val) || 0 }
        }));
      };

      // 수당 관리
      const handleAddFixedAllowance = () => {
        const newItem = { id: Date.now(), name: '수당추가', amount: 0 };
        setAppData(prev => ({
          ...prev,
          corporate: {
            ...prev.corporate,
            fixedAllowanceItems: [...(prev.corporate?.fixedAllowanceItems || []), newItem]
          }
        }));
      };

      const handleUpdateFixedAllowance = (id, field, value) => {
        setAppData(prev => ({
          ...prev,
          corporate: {
            ...prev.corporate,
            fixedAllowanceItems: (prev.corporate?.fixedAllowanceItems || []).map(item =>
              item.id === id ? { ...item, [field]: field === 'amount' ? Number(value) : value } : item
            )
          }
        }));
      };

      const handleDeleteFixedAllowance = (id) => {
        setAppData(prev => ({
          ...prev,
          corporate: {
            ...prev.corporate,
            fixedAllowanceItems: (prev.corporate?.fixedAllowanceItems || []).filter(item => item.id !== id)
          }
        }));
      };

      // 고정비 관리
      const handleAddFixedExpense = () => {
        const newItem = { id: Date.now(), name: '항목추가', amount: 0 };
        setAppData(prev => ({
          ...prev,
          corporate: {
            ...prev.corporate,
            fixedExpenseItems: [...(prev.corporate?.fixedExpenseItems || []), newItem]
          }
        }));
      };

      const handleUpdateFixedExpense = (id, field, value) => {
        setAppData(prev => ({
          ...prev,
          corporate: {
            ...prev.corporate,
            fixedExpenseItems: (prev.corporate?.fixedExpenseItems || []).map(item =>
              item.id === id ? { ...item, [field]: field === 'amount' ? Number(value) : value } : item
            )
          }
        }));
      };

      const handleDeleteFixedExpense = (id) => {
        setAppData(prev => ({
          ...prev,
          corporate: {
            ...prev.corporate,
            fixedExpenseItems: (prev.corporate?.fixedExpenseItems || []).filter(item => item.id !== id)
          }
        }));
      };

      // 일별 기록 저장
      const handleSaveRecord = (dateKey, recordData) => {
        setAppData(prev => ({
          ...prev,
          [activeType]: {
            ...prev[activeType],
            records: {
              ...(prev[activeType]?.records || {}),
              [dateKey]: recordData
            }
          }
        }));
        setShowDailyModal(false);
      };

      const handleDeleteDailyRecord = (dateKey) => {
        if (!confirm(`${dateKey} 기록을 삭제하시겠습니까?`)) return;
        const updatedRecords = { ...(appData[activeType]?.records || {}) };
        delete updatedRecords[dateKey];
        setAppData(prev => ({
          ...prev,
          [activeType]: { ...prev[activeType], records: updatedRecords }
        }));
      };

      const handleDeleteSpeedLog = (id) => {
        setAppData(prev => ({
          ...prev,
          speedingLogs: (prev.speedingLogs || []).filter(item => item.id !== id)
        }));
      };

      const handleClearAllSpeedLogs = () => {
        if (confirm('모든 단속 의심 이력을 삭제하시겠습니까?')) {
          setAppData(prev => ({ ...prev, speedingLogs: [] }));
        }
      };

      // 수당 & 공제 자동합산
      const totalFixedAllowances = useMemo(() => {
        const items = appData?.corporate?.fixedAllowanceItems || [];
        return items.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [appData?.corporate?.fixedAllowanceItems]);

      const totalFixedExpenses = useMemo(() => {
        const items = appData?.corporate?.fixedExpenseItems || [];
        return items.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [appData?.corporate?.fixedExpenseItems]);

      // 월별 정산 통계
      const currentMonthStats = useMemo(() => {
        const records = appData[activeType]?.records || {};
        const entries = Object.entries(records).filter(([date]) => date && String(date).startsWith(currentYearMonth));

        let workDays = 0;
        let holidayDays = 0;

        if (activeType === 'corporate') {
          const dailyDeposit = Number(appData.corporate?.dailyDeposit || 201000);
          const deductionRate = Number(appData.corporate?.deductionRate || 9.0) / 100;

          let totalRevenue = 0;
          let totalGasCompany = 0;
          let totalDriverExpense = 0;
          let totalIncentive = 0;

          entries.forEach(([_, r]) => {
            if (r?.isHoliday) {
              holidayDays++;
            } else {
              workDays++;
              const rev = Number(r?.revenue || 0);
              totalRevenue += rev;
              totalGasCompany += Number(r?.gas || 0);
              totalDriverExpense += Number(r?.driverExpense || 0);

              const dailyOver = Math.max(0, rev - dailyDeposit);
              totalIncentive += Math.round(dailyOver * 0.7);
            }
          });

          const grossSalary = totalFixedAllowances + totalIncentive;
          const taxAndInsurance = Math.round(grossSalary * deductionRate);
          const totalDeductions = taxAndInsurance + totalFixedExpenses;
          const netSalaryFromCompany = grossSalary - totalDeductions;
          const finalNetIncome = netSalaryFromCompany - totalDriverExpense;

          return {
            workDays,
            holidayDays,
            dailyDeposit,
            totalFixedAllowances,
            totalRevenue,
            totalGasCompany,
            totalIncentive,
            grossSalary,
            taxAndInsurance,
            totalFixedExpenses,
            totalDeductions,
            netSalaryFromCompany,
            totalDriverExpense,
            finalNetIncome
          };
        } else {
          let cardTotal = 0;
          let cashTotal = 0;
          let gasTotal = 0;
          let tollTotal = 0;
          let maintTotal = 0;
          let otherTotal = 0;

          entries.forEach(([_, r]) => {
            if (r?.isHoliday) {
              holidayDays++;
            } else {
              workDays++;
              cardTotal += Number(r?.cardRev || 0);
              cashTotal += Number(r?.cashRev || 0);
              gasTotal += Number(r?.gas || 0);
              tollTotal += Number(r?.toll || 0);
              maintTotal += Number(r?.maint || 0);
              otherTotal += Number(r?.other || 0);
            }
          });

          const totalRevenue = cardTotal + cashTotal;
          const totalExpense = gasTotal + tollTotal + maintTotal + otherTotal;
          const netIncome = totalRevenue - totalExpense;

          return {
            workDays,
            holidayDays,
            cardTotal,
            cashTotal,
            totalRevenue,
            gasTotal,
            tollTotal,
            maintTotal,
            otherTotal,
            totalExpense,
            netIncome

        for (let i = 0; i < firstDayWeekIndex; i++) {

------------------------------------
※ 본 자료는 K-TAXI에서 자동 산출된 자료입니다.`;

                <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                  <h3 className="text-xs font-bold text-slate-300">차량 및 기준 설정</h3>
                  
                  <div className="flex items-center justify-between text-xs">
                    <span className="text-slate-400">차량 번호</span>
                    <input
                      type="text"
                      placeholder="충남31바 1234"
                      value={appData[activeType]?.carNumber || ''}
                      onChange={(e) => handleCarNumberChange(e.target.value)}
                      className="bg-slate-950 border border-slate-700 px-3 py-1.5 rounded-xl text-right font-bold w-36 text-white"
                    />
                  </div>

                  {activeType === 'corporate' && (
                    <>
                      <div className="flex items-center justify-between text-xs pt-2 border-t border-slate-800">
                        <span className="text-slate-400">1일 기준 사납금</span>
                        <div className="w-32">
                          <SmartMoneyInput
                            value={appData.corporate?.dailyDeposit}
                            onChange={(val) => handleCorporateConfigChange('dailyDeposit', val)}
                          />
                        </div>
                      </div>

                      <div className="flex items-center justify-between text-xs pt-2 border-t border-slate-800">
                        <span className="text-slate-400">고정 수당 목록 ({appData.corporate?.fixedAllowanceItems?.length || 0}개)</span>
                        <button
                          onClick={() => setShowFixedAllowanceModal(true)}
                          className="px-3 py-1 bg-slate-800 text-blue-300 font-bold rounded-xl border border-blue-500/30"
                        >
                          {formatMoney(totalFixedAllowances)} ⚙️
                        </button>
                      </div>

                      <div className="flex items-center justify-between text-xs pt-2 border-t border-slate-800">
                        <span className="text-slate-400">회사 고정비 공제 ({appData.corporate?.fixedExpenseItems?.length || 0}개)</span>
                        <button
                          onClick={() => setShowFixedExpenseModal(true)}
                          className="px-3 py-1 bg-slate-800 text-orange-300 font-bold rounded-xl border border-orange-500/30"
                        >
                          {formatMoney(totalFixedExpenses)} ⚙️
                        </button>
                      </div>

                      <div className="flex items-center justify-between text-xs pt-2 border-t border-slate-800">
                        <span className="text-slate-400">4대보험 및 세금 공제율</span>
                        <div className="flex items-center gap-1">
                          <input
                            type="number"
                            step="0.1"
                            value={appData.corporate?.deductionRate || 9.0}
                            onChange={(e) => handleCorporateConfigChange('deductionRate', e.target.value)}
                            className="bg-slate-950 border border-slate-700 px-2 py-1 text-xs rounded-xl text-right w-16 text-white font-bold"
                          />
                          <span className="text-slate-400">%</span>
                        </div>
                      </div>
                    </>
                  )}
                </div>

                <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold text-slate-300 block">과속 단속 의심 이력</span>
                    <span className="text-[10px] text-slate-500">카메라 통과 시 과속 감지 로그</span>
                  </div>
                  <button
                    onClick={() => setShowSpeedLogModal(true)}
                    className="px-3 py-1.5 bg-red-950/80 border border-red-800 text-red-300 font-bold rounded-xl text-xs"
                  >
                    확인 ({appData.speedingLogs?.length || 0}건)
                  </button>
                </div>

                <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2.5">
                  <span className="text-xs font-bold text-slate-300 block">장부 데이터 백업 & 복원</span>
                  <div className="flex gap-2">
                    <button
                      onClick={exportBackup}
                      className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs border border-slate-700"
                    >
                      백업 파일 저장 (.json)
                    </button>
                    <label className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs border border-slate-700 text-center cursor-pointer">
                      백업 파일 복원
                      <input type="file" accept=".json" onChange={importBackup} className="hidden" />
                    </label>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* 하단 탭 바 */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 backdrop-blur border-t border-slate-800 grid grid-cols-4 z-40 pb-safe">
            <button
              onClick={() => setCurrentTab('calendar')}
              className={`flex flex-col items-center py-2.5 ${currentTab === 'calendar' ? 'text-yellow-400 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-lg">📅</span>
              <span className="text-[10px] mt-0.5">운행일지</span>
            </button>
            <button
              onClick={() => setCurrentTab('settlement')}
              className={`flex flex-col items-center py-2.5 ${currentTab === 'settlement' ? 'text-yellow-400 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-lg">📊</span>
              <span className="text-[10px] mt-0.5">월간정산</span>
            </button>
            <button
              onClick={() => setCurrentTab('hud')}
              className={`flex flex-col items-center py-2.5 ${currentTab === 'hud' ? 'text-yellow-400 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-lg">🏎️</span>
              <span className="text-[10px] mt-0.5">안전HUD</span>
            </button>
            <button
              onClick={() => setCurrentTab('settings')}
              className={`flex flex-col items-center py-2.5 ${currentTab === 'settings' ? 'text-yellow-400 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-lg">⚙️</span>
              <span className="text-[10px] mt-0.5">설정/백업</span>
            </button>
          </nav>

          {/* 일별 기록 모달 */}
          {showDailyModal && (
            <DailyRecordModal
              activeType={activeType}
              dateKey={selectedDate}
              existingData={appData[activeType]?.records?.[selectedDate] || {}}
              onSave={(data) => handleSaveRecord(selectedDate, data)}
              onClose={() => setShowDailyModal(false)}
            />
          )}

          {/* 수당 모달 */}
          {showFixedAllowanceModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 className="text-xs font-bold text-blue-400">고정 수당 목록 관리</h3>
                  <button onClick={() => setShowFixedAllowanceModal(false)} className="text-slate-400 text-base font-bold">✕</button>
                </div>
                <div className="max-h-56 overflow-y-auto space-y-2 pr-1">
                  {(appData.corporate?.fixedAllowanceItems || []).map((item) => (
                    <div key={item.id} className="bg-slate-950 p-2 rounded-xl border border-slate-800 flex items-center gap-1.5">
                      <input
                        type="text"
                        value={item.name}
                        onChange={(e) => handleUpdateFixedAllowance(item.id, 'name', e.target.value)}
                        className="bg-slate-900 border border-slate-700 px-2 py-1 text-xs rounded-lg text-white w-20 font-bold"
                      />
                      <div className="flex-1">
                        <SmartMoneyInput
                          value={item.amount}
                          onChange={(val) => handleUpdateFixedAllowance(item.id, 'amount', val)}
                          colorClass="text-blue-300"
                        />
                      </div>
                      <button onClick={() => handleDeleteFixedAllowance(item.id)} className="text-slate-500 hover:text-red-400 text-xs px-1">✕</button>
                    </div>
                  ))}
                </div>
                <div className="pt-2 border-t border-slate-800 flex gap-2">
                  <button onClick={handleAddFixedAllowance} className="flex-1 py-2 bg-slate-800 text-yellow-400 font-bold rounded-xl text-xs">+ 수당 추가</button>
                  <button onClick={() => setShowFixedAllowanceModal(false)} className="px-5 py-2 bg-yellow-500 text-black font-bold rounded-xl text-xs">완료</button>
                </div>
              </div>
            </div>
          )}

          {/* 고정비 모달 */}
          {showFixedExpenseModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 className="text-xs font-bold text-orange-400">회사 고정비 공제 관리</h3>
                  <button onClick={() => setShowFixedExpenseModal(false)} className="text-slate-400 text-base font-bold">✕</button>
                </div>
                <div className="max-h-56 overflow-y-auto space-y-2 pr-1">
                  {(appData.corporate?.fixedExpenseItems || []).map((item) => (
                    <div key={item.id} className="bg-slate-950 p-2 rounded-xl border border-slate-800 flex items-center gap-1.5">
                      <input
                        type="text"
                        value={item.name}
                        onChange={(e) => handleUpdateFixedExpense(item.id, 'name', e.target.value)}
                        className="bg-slate-900 border border-slate-700 px-2 py-1 text-xs rounded-lg text-white w-20 font-bold"
                      />
                      <div className="flex-1">
                        <SmartMoneyInput
                          value={item.amount}
                          onChange={(val) => handleUpdateFixedExpense(item.id, 'amount', val)}
                          colorClass="text-orange-400"
                        />
                      </div>
                      <button onClick={() => handleDeleteFixedExpense(item.id)} className="text-slate-500 hover:text-red-400 text-xs px-1">✕</button>
                    </div>
                  ))}
                </div>
                <div className="pt-2 border-t border-slate-800 flex gap-2">
                  <button onClick={handleAddFixedExpense} className="flex-1 py-2 bg-slate-800 text-yellow-400 font-bold rounded-xl text-xs">+ 항목 추가</button>
                  <button onClick={() => setShowFixedExpenseModal(false)} className="px-5 py-2 bg-yellow-500 text-black font-bold rounded-xl text-xs">완료</button>
                </div>
              </div>
            </div>
          )}

          {/* 과속 단속 의심 모달 */}
          {showSpeedLogModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3 max-h-[80vh] flex flex-col">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 className="text-xs font-bold text-red-400">과속 단속 의심 이력 ({appData.speedingLogs?.length || 0}건)</h3>
                  <button onClick={() => setShowSpeedLogModal(false)} className="text-slate-400 text-base font-bold">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                  {(!appData.speedingLogs || appData.speedingLogs.length === 0) ? (
                    <div className="text-center py-8 text-xs text-slate-500">기록된 단속 의심 이력이 없습니다.</div>
                  ) : (
                    appData.speedingLogs.map((log) => (
                      <div key={log.id} className="bg-slate-950 p-2.5 rounded-xl border border-red-950 space-y-0.5">
                        <div className="flex justify-between text-xs font-bold text-slate-200">
                          <span>{log.desc}</span>
                          <button onClick={() => handleDeleteSpeedLog(log.id)} className="text-[10px] text-slate-500">삭제</button>
                        </div>
                        <div className="text-[10px] text-slate-400">{log.timestamp}</div>
                        <div className="flex justify-between text-xs pt-1">
                          <span className="text-slate-400">제한 {log.limitSpeed} / 통과 {log.passSpeed}km/h</span>
                          <span className="text-red-400 font-bold">+{log.overSpeed} km/h 초과</span>
                        </div>
                      </div>
                    ))
                  )}
                </div>
                {appData.speedingLogs && appData.speedingLogs.length > 0 && (
                  <button onClick={handleClearAllSpeedLogs} className="w-full py-2 bg-red-950 text-red-300 font-bold rounded-xl text-xs">
                    이력 전체 삭제
                  </button>
                )}
              </div>
            </div>
          )}

          {/* 세무서 양식 모달 */}
          {showTaxModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="text-xs font-bold text-yellow-400">세무서 제출 양식</h3>
                  <button onClick={() => setShowTaxModal(false)} className="text-slate-400 text-base font-bold">✕</button>
                </div>
                <textarea
                  readOnly
                  value={taxReportText}
                  className="w-full h-56 bg-slate-950 text-slate-200 text-xs font-mono p-2.5 rounded-xl border border-slate-800 resize-none focus:outline-none"
                />
                <button
                  onClick={() => {
                    navigator.clipboard.writeText(taxReportText);
                    alert('복사되었습니다.');
                  }}
                  className="w-full py-2.5 bg-yellow-500 text-black font-bold rounded-xl text-xs"
                >
                  내용 전체 복사
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 일별 기록 모달
    function DailyRecordModal({ activeType, dateKey, existingData, onSave, onClose }) {
      const [isHoliday, setIsHoliday] = useState(existingData?.isHoliday || false);
      const [memo, setMemo] = useState(existingData?.memo || '');

      const [revenue, setRevenue] = useState(existingData?.revenue || 0);
      const [gas, setGas] = useState(existingData?.gas || 0);
      const [driverExpense, setDriverExpense] = useState(existingData?.driverExpense || 0);

      const [cardRev, setCardRev] = useState(existingData?.cardRev || 0);
      const [cashRev, setCashRev] = useState(existingData?.cashRev || 0);
      const [privGas, setPrivGas] = useState(existingData?.gas || 0);
      const [toll, setToll] = useState(existingData?.toll || 0);
      const [maint, setMaint] = useState(existingData?.maint || 0);
      const [other, setOther] = useState(existingData?.other || 0);

      const handleSave = () => {
        if (activeType === 'corporate') {
          onSave({
            isHoliday,
            memo,
            revenue: Number(revenue) || 0,
            gas: Number(gas) || 0,
            driverExpense: Number(driverExpense) || 0
          });
        } else {
          onSave({
            isHoliday,
            memo,
            cardRev: Number(cardRev) || 0,
            cashRev: Number(cashRev) || 0,
            gas: Number(privGas) || 0,
            toll: Number(toll) || 0,
            maint: Number(maint) || 0,
            other: Number(other) || 0
          });
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center pb-2 border-b border-slate-800">
              <h3 className="text-xs font-bold text-yellow-400">{dateKey} 운행 기록</h3>
              <button onClick={onClose} className="text-slate-400 font-bold text-base">✕</button>
            </div>

            <label className="flex items-center gap-2 bg-slate-950 p-2.5 rounded-xl border border-slate-800 cursor-pointer">
              <input
                type="checkbox"
                checked={isHoliday}
                onChange={(e) => setIsHoliday(e.target.checked)}
                className="w-4 h-4 rounded text-yellow-500 focus:ring-0"
              />
              <span className="text-xs font-bold text-slate-300">이 날은 휴무했습니다 (미운행)</span>
            </label>

            {!isHoliday && (
              <div className="space-y-2.5">
                {activeType === 'corporate' ? (
                  <>
                    <div>
                      <label className="text-[11px] text-slate-400 block mb-1">당일 운행 총매출액</label>
                      <SmartMoneyInput value={revenue} onChange={setRevenue} colorClass="text-yellow-400" />
                    </div>
                    <div>
                      <label className="text-[11px] text-blue-400 block mb-1">가스 충전비 (회사부담 참고)</label>
                      <SmartMoneyInput value={gas} onChange={setGas} colorClass="text-blue-300" />
                    </div>
                    <div>
                      <label className="text-[11px] text-orange-400 block mb-1">기타 기사경비 (식대/세차 등)</label>
                      <SmartMoneyInput value={driverExpense} onChange={setDriverExpense} colorClass="text-orange-300" />
                    </div>
                  </>
                ) : (
                  <>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[10px] text-slate-400 block mb-1">카드/앱 매출</label>
                        <SmartMoneyInput value={cardRev} onChange={setCardRev} />
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 block mb-1">현금 수입</label>
                        <SmartMoneyInput value={cashRev} onChange={setCashRev} />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[10px] text-slate-400 block mb-1">가스비</label>
                        <SmartMoneyInput value={privGas} onChange={setPrivGas} />
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 block mb-1">통행료</label>
                        <SmartMoneyInput value={toll} onChange={setToll} />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[10px] text-slate-400 block mb-1">정비비</label>
                        <SmartMoneyInput value={maint} onChange={setMaint} />
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 block mb-1">기타경비</label>
                        <SmartMoneyInput value={other} onChange={setOther} />
                      </div>
                    </div>
                  </>
                )}

                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">운행 메모</label>
                  <input
                    type="text"
                    placeholder="특이사항 메모"
                    value={memo}
                    onChange={(e) => setMemo(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 p-2 text-xs rounded-xl text-white focus:outline-none"
                  />
                </div>
              </div>
            )}

            <div className="flex gap-2 pt-2">
              <button onClick={handleSave} className="flex-1 py-2.5 bg-yellow-500 text-black font-bold rounded-xl text-xs">
                저장 완료
              </button>
              <button onClick={onClose} className="px-4 py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">
                취소
              </button>
            </div>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
